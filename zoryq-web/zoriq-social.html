<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050609">
<title>ZORYQ — Web3 Super App</title>
<style>
:root{--bg:#050609;--panel:#0b1018;--panel2:#111722;--line:#1b2433;--text:#f5f7fb;--muted:#8390a6;--primary:#7657ff;--accent:#5edbff;--danger:#ff6688;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.shell{max-width:1320px;margin:auto;min-height:100vh}.top{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,6,9,.95);backdrop-filter:blur(18px);z-index:20}.brand{font-weight:950;letter-spacing:2px;font-size:20px}.brand small{letter-spacing:0;color:var(--accent);font-size:9px;margin-left:7px}.utility{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.utility button,.walletBtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 11px;border-radius:11px;font-weight:850;cursor:pointer;font-size:11px}.utility button:hover,.utility button.on{border-color:#3b4b69;background:#151c29}.layout{display:grid;grid-template-columns:215px minmax(0,680px) 290px;gap:16px;padding:16px}.side{position:sticky;top:82px;height:max-content}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#cfd6e3;text-align:left;padding:13px;border-radius:12px;font-size:14px;font-weight:850;cursor:pointer}.nav button:hover,.nav button.on{background:#151b29;color:#fff}.box,.post{background:var(--panel);border:1px solid var(--line);border-radius:18px}.box{padding:14px}.stack{display:flex;flex-direction:column;gap:12px}.tabs,.kinds{display:flex;gap:4px;background:#0c1018;border:1px solid var(--line);padding:4px;border-radius:14px;overflow:auto}.tabs button,.kinds button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-weight:850;cursor:pointer}.tabs button.on,.kinds button.on{background:#2b2350;color:#fff}.post{padding:14px}.head{display:flex;gap:10px;align-items:center}.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:#050609;font-weight:950;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.author{font-weight:900}.handle,.meta,.muted{color:var(--muted);font-size:12px}.body{font-size:15px;line-height:1.5;white-space:pre-wrap;margin:10px 0}.media{width:100%;max-height:560px;object-fit:cover;border-radius:15px;border:1px solid var(--line)}.actions{display:flex;justify-content:space-between;gap:4px;align-items:center;margin-top:9px;overflow:auto}.action{border:0;background:transparent;color:#8c98ad;cursor:pointer;padding:7px;font-weight:850;white-space:nowrap}.action.on{color:var(--danger)}.action.transfer{color:var(--accent);font-size:18px;font-weight:950}textarea,input,select{width:100%;background:var(--panel2);color:#fff;border:1px solid #202a3b;border-radius:12px;padding:11px;font:inherit;outline:none}textarea{resize:vertical;min-height:100px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;background:#202838;color:#fff}.btn.primary{background:var(--primary)}.btn.accent{background:#14364a;color:#78e6ff}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.title{font-size:20px;font-weight:950}.hero{font-size:28px;font-weight:950;margin:0}.registration{border-color:#3e356b;background:linear-gradient(145deg,#111126,var(--panel))}.verified{color:var(--accent);font-size:11px;font-weight:900}.field{margin:9px 0}.field label{display:block;color:#9ba6ba;font-size:11px;font-weight:850;margin-bottom:5px}.profileStat{padding:9px;background:var(--panel2);border-radius:11px;text-align:center;min-width:72px}.profileStat b{display:block;font-size:17px}.search{display:flex;gap:8px}.tag{background:#101827;border:1px solid #20304b;color:var(--accent);border-radius:999px;padding:8px 11px;cursor:pointer}.notice{display:flex;gap:10px;padding:11px}.empty{padding:32px;text-align:center;color:var(--muted)}.web3card{background:#10172a;border:1px solid #29375e;border-radius:14px;padding:12px;margin-top:8px}.comment{background:#0e141e;padding:9px;border-radius:10px;margin-top:7px}.right .box{margin-bottom:12px}.status{display:flex;justify-content:space-between;padding:7px 0;font-size:12px}.good{color:#5ee3a7}.modalBack{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;place-items:center;padding:16px}.modalBack.show{display:grid}.modal{width:min(520px,100%);max-height:90vh;overflow:auto}.community,.conversation{padding:12px;background:#10151f;border-radius:12px;margin-top:8px;cursor:pointer;border:1px solid transparent}.community:hover,.conversation:hover{border-color:#26334a}.warning{padding:9px;background:#241f12;border-radius:10px;color:#e8c46d;font-size:11px}.bubble{padding:10px;border-radius:12px;background:#101722;margin:7px 0}.bubble.mine{background:#392c7a;margin-left:15%}.messageComposer{display:flex;gap:8px;margin-top:10px}.mobile{display:none}@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr)}.right{display:none}}@media(max-width:760px){.layout{display:block;padding:10px 10px 80px}.left{display:none}.top{align-items:flex-start;flex-direction:column}.utility{width:100%;justify-content:space-between}.utility button,.walletBtn{flex:1;padding:8px 6px;font-size:9px}.mobile{display:flex;position:fixed;bottom:10px;left:10px;right:10px;background:rgba(10,13,20,.96);border:1px solid var(--line);border-radius:17px;padding:5px;z-index:30;justify-content:space-around}.mobile button{border:0;background:none;color:#b8c0cf;padding:10px;font-size:16px}.mobile button.on{color:var(--primary)}.post{border-radius:15px}.search{flex-direction:column}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand">ZORYQ <small>WEB3 SUPER APP</small></div><div class="utility"><button data-product="communities">Comunidades</button><button data-product="messages">Mensagens</button><button id="walletBtn" class="walletBtn">Wallet</button><button id="swapBtn">Swap</button></div></header><div class="layout"><aside class="left side"><div class="nav"><button data-view="home" class="on">⌂ Home</button><button data-view="explore">⌕ Explorar</button><button data-view="create">＋ Criar</button><button data-view="activity">♡ Atividade</button><button data-view="profile">◎ Perfil</button></div></aside><main id="main" class="stack"></main><aside class="right"><div class="box"><div class="title">Sincronização</div><div class="status"><span>Social Gateway</span><b id="socialStatus">…</b></div><div class="status"><span>ZORYQ Testnet</span><b>5919065</b></div><div class="status"><span>Web + APK</span><b class="good">UI + dados unificados</b></div><p class="muted">Mesmos campos, mesmos nomes e mesma fonte de dados. A disposição muda apenas para caber melhor no computador ou celular.</p></div><div class="box"><div class="title">Identidade</div><div id="sideProfile" class="muted">Conecte sua wallet.</div></div></aside></div></div>
<div class="mobile"><button data-view="home" class="on">⌂</button><button data-view="explore">⌕</button><button data-view="create">＋</button><button data-view="activity">♡</button><button data-view="profile">◎</button></div>
<div id="modalBack" class="modalBack"><div id="modal" class="box modal"></div></div>
<script>
const ROOT='https://zoryq-wallet-swap-production.up.railway.app',SOCIAL=ROOT+'/social',COMMUNITY=ROOT+'/community',MESSAGE=ROOT+'/message',CHAIN_ID=5919065,CHAIN_HEX='0x5a5159';
let account='',session=localStorage.getItem('zoryq.social.session.v1.web')||'',me=null,view='home',scope='for-you',composerKind='text',feed=[],exploreData=null,notices=[],activeProfile=null,profilePosts=[],communities=[],conversations=[],openConversation=null,thread=[];
const main=document.getElementById('main'),walletBtn=document.getElementById('walletBtn'),modalBack=document.getElementById('modalBack'),modal=document.getElementById('modal');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),short=a=>a?`${a.slice(0,6)}…${a.slice(-4)}`:'—';
async function req(base,path,opt={}){const headers={'accept':'application/json',...(opt.body?{'content-type':'application/json'}:{}),...(session?{authorization:`Bearer ${session}`}:{})};const r=await fetch(base+path,{...opt,headers:{...headers,...(opt.headers||{})},cache:'no-store'});const j=await r.json().catch(()=>({ok:false,error:'INVALID_RESPONSE'}));if(!r.ok||j.ok===false)throw Error(j.error||`HTTP_${r.status}`);return j}
async function ensureChain(){if(!window.ethereum)throw Error('Nenhuma wallet EVM detectada.');const id=await ethereum.request({method:'eth_chainId'});if(id.toLowerCase()===CHAIN_HEX)return;try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_HEX}]})}catch{await ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:CHAIN_HEX,chainName:'ZORYQ EVM Testnet',nativeCurrency:{name:'ZORYQ',symbol:'ZQ',decimals:18},rpcUrls:['https://zoryq-evm-node-live-production.up.railway.app/rpc'],blockExplorerUrls:['https://zoryq-evm-node-live-production.up.railway.app/explorer']}]})}}
async function connect(){if(!window.ethereum)throw Error('Nenhuma wallet EVM detectada no navegador.');const a=await ethereum.request({method:'eth_requestAccounts'});account=a[0];walletBtn.textContent=short(account);await ensureChain();const c=await req(SOCIAL,`/v1/auth/challenge?address=${account}`);const signature=await ethereum.request({method:'personal_sign',params:[c.message,account]});const auth=await req(SOCIAL,'/v1/auth/verify',{method:'POST',body:JSON.stringify({address:account,signature})});session=auth.token;localStorage.setItem('zoryq.social.session.v1.web',session);localStorage.setItem('zoryq.social.address.v1.web',account.toLowerCase());me=auth.profile;activeProfile=me;if(auth.profileRegistrationRequired)openRegistration();else{await refreshMe();render()}}
async function reconnect(){if(!window.ethereum||!session)return;try{const a=await ethereum.request({method:'eth_accounts'});if(!a.length)return;const remembered=localStorage.getItem('zoryq.social.address.v1.web');if(remembered&&remembered!==a[0].toLowerCase()){session='';localStorage.removeItem('zoryq.social.session.v1.web');return}account=a[0];walletBtn.textContent=short(account);const p=await req(SOCIAL,`/v1/profile/${account}`);me=p.profile;activeProfile=me;renderSide()}catch{session='';localStorage.removeItem('zoryq.social.session.v1.web')}}
function typedDataFor(reg){return {domain:reg.typedData.domain,primaryType:'ProfileRegistration',types:{EIP712Domain:[{name:'name',type:'string'},{name:'version',type:'string'},{name:'chainId',type:'uint256'}],...reg.typedData.types},message:reg.typedData.message}}
function openRegistration(){if(!account)return connect().catch(e=>alert(e.message));modalBack.classList.add('show');modal.innerHTML=`<h2>Crie seu perfil ZORYQ</h2><p class="muted">Assinatura EIP-712 na ZORYQ Testnet (Chain ID 5919065). Sem gas e sem transferência.</p><div class="field"><label>@handle</label><input id="regHandle" value="zq_${account.slice(2,8).toLowerCase()}"></div><div class="field"><label>Nome</label><input id="regName" value="ZORYQ User"></div><div class="field"><label>Bio</label><textarea id="regBio"></textarea></div><div class="row"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="registerProfile()">Assinar e criar perfil</button></div>`}
async function registerProfile(){try{await ensureChain();const draft={handle:regHandle.value.trim().replace(/^@/,''),displayName:regName.value.trim()||'ZORYQ User',bio:regBio.value.trim()};const reg=await req(SOCIAL,'/v1/profile/registration-challenge',{method:'POST',body:JSON.stringify(draft)});if(reg.chainId!==CHAIN_ID||reg.scheme!=='eip712')throw Error('Challenge fora da ZORYQ Testnet');const signature=await ethereum.request({method:'eth_signTypedData_v4',params:[account,JSON.stringify(typedDataFor(reg))]});const done=await req(SOCIAL,'/v1/profile/register',{method:'POST',body:JSON.stringify({signature})});me=done.profile;activeProfile=me;closeModal();renderSide();showView('profile')}catch(e){alert(e.message)}}
function closeModal(){modalBack.classList.remove('show')}
async function refreshMe(){if(!account)return;const p=await req(SOCIAL,`/v1/profile/${account}`);me=p.profile;activeProfile=me;renderSide()}
function renderSide(){document.getElementById('sideProfile').innerHTML=me?.registered?`${avatar(me)}<div style="margin-top:8px"><b>${esc(me.displayName)}</b><div class="handle">@${esc(me.handle)}</div><div class="verified">◆ ZORYQ-signed</div></div>`:`<span class="muted">${account?short(account):'Conecte sua wallet'}</span>`}
function avatar(p){return p?.avatarUrl?`<span class="avatar"><img src="${esc(p.avatarUrl)}"></span>`:`<span class="avatar">${esc((p?.displayName||'Z')[0].toUpperCase())}</span>`}
function profileRow(p){return `<div class="head">${avatar(p)}<div class="grow"><div class="author">${esc(p.displayName)} <span class="handle">@${esc(p.handle)}</span></div><div class="meta">${short(p.address)} ${p.registration?.chainId===CHAIN_ID?'· ◆ ZORYQ-signed':''}</div></div></div>`}
async function loadFeed(){const j=await req(SOCIAL,`/v1/feed?scope=${scope}`);feed=j.items||[]}
async function loadExplore(){exploreData=await req(SOCIAL,'/v1/explore')}
async function loadActivity(){if(!me?.registered)return;const j=await req(SOCIAL,'/v1/notifications');notices=j.items||[];if(j.unread)await req(SOCIAL,'/v1/notifications/read',{method:'POST'})}
async function loadProfile(address=activeProfile?.address||account){if(!address)return;const [p,posts]=await Promise.all([req(SOCIAL,`/v1/profile/${address}`),req(SOCIAL,`/v1/profiles/${address}/posts`)]);activeProfile=p.profile;profilePosts=posts.items||[]}
async function loadCommunities(){const j=await req(COMMUNITY,'/v1/communities');communities=j.items||[]}
async function loadMessages(){if(!me?.registered)return;const j=await req(MESSAGE,'/v1/conversations');conversations=j.items||[]}
async function showView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));document.querySelectorAll('[data-product]').forEach(b=>b.classList.toggle('on',b.dataset.product===v));try{if(v==='home')await loadFeed();if(v==='explore')await loadExplore();if(v==='activity')await loadActivity();if(v==='profile')await loadProfile();if(v==='communities')await loadCommunities();if(v==='messages')await loadMessages()}catch(e){main.innerHTML=`<div class="box empty">${esc(e.message)}</div>`;return}render()}
function registrationOrLogin(){if(!account)return `<div class="box registration"><div class="title">Uma wallet. Uma identidade.</div><p class="muted">Use a mesma wallet do APK para abrir o mesmo perfil e os mesmos dados.</p><button class="btn primary" onclick="connect()">Entrar com Wallet</button></div>`;if(!me?.registered)return `<div class="box registration"><div class="title">Crie seu perfil na ZORYQ Testnet</div><p class="muted">@handle, Nome e Bio são os mesmos campos do APK.</p><button class="btn primary" onclick="openRegistration()">Assinar e criar perfil</button></div>`;return''}
function attachmentHtml(a){if(!a)return'';if(a.type==='image')return `<img class="media" src="${esc(a.url)}" loading="lazy">`;return `<div class="web3card"><div class="verified">${esc(a.type.toUpperCase())} · Chain ${esc(a.chainId||'')}</div><b>${a.type==='token'?`${esc(a.symbol)} · ${esc(a.name)}`:a.type==='tx'?'Transação verificável':esc(a.name)}</b><div class="meta">${esc(a.address||a.hash||a.url||'')}</div></div>`}
function postHtml(p){return `<article class="post">${profileRow(p.authorProfile)}<div class="body">${esc(p.content)}</div>${attachmentHtml(p.attachment)}<div class="actions"><button class="action ${p.liked?'on':''}" onclick="act('${p.id}','like')">${p.liked?'♥':'♡'} ${p.likeCount||0}</button><button class="action" onclick="comments('${p.id}')">💬 ${p.commentCount||0}</button><button class="action ${p.reposted?'on':''}" onclick="act('${p.id}','repost')">↻ ${p.repostCount||0}</button><button class="action ${p.bookmarked?'on':''}" onclick="act('${p.id}','bookmark')">${p.bookmarked?'★':'☆'}</button><button class="action" onclick="sharePost('${p.id}')">↗</button>${me?.registered&&p.author.toLowerCase()!==account.toLowerCase()?`<button class="action transfer" title="Transferir para @${esc(p.authorProfile.handle)}" onclick="openTransfer('${p.author}','${esc(p.authorProfile.handle)}')">$</button>`:''}</div><div id="comments-${p.id}"></div></article>`}
async function act(id,a){if(!me?.registered)return openRegistration();await req(SOCIAL,`/v1/posts/${id}/${a}`,{method:'POST'});await showView(view)}
async function comments(id){const holder=document.getElementById(`comments-${id}`);if(holder.dataset.open){holder.innerHTML='';holder.dataset.open='';return}const j=await req(SOCIAL,`/v1/posts/${id}/comments`);holder.dataset.open='1';holder.innerHTML=(j.items||[]).map(c=>`<div class="comment"><b>@${esc(c.authorProfile.handle)}</b><div>${esc(c.content)}</div></div>`).join('')+(me?.registered?`<div class="messageComposer"><input id="reply-${id}" placeholder="Responder…"><button class="btn primary" onclick="sendComment('${id}')">Enviar</button></div>`:'')}
async function sendComment(id){const el=document.getElementById(`reply-${id}`);if(!el.value.trim())return;await req(SOCIAL,`/v1/posts/${id}/comments`,{method:'POST',body:JSON.stringify({content:el.value.trim()})});const holder=document.getElementById(`comments-${id}`);holder.dataset.open='';await comments(id)}
function findPost(id){return [...feed,...(exploreData?.items||[]),...profilePosts].find(x=>x.id===id)}
function sharePost(id){const p=findPost(id);if(!p)return;const text=`${p.content}\n@${p.authorProfile.handle} · ZORYQ`;navigator.share?navigator.share({text}).catch(()=>{}):navigator.clipboard.writeText(text)}
function toWeiHex(value){const [a,b='']=String(value).replace(',','.').split('.');const frac=(b+'0'.repeat(18)).slice(0,18);const wei=BigInt(a||'0')*10n**18n+BigInt(frac||'0');if(wei<=0n)throw Error('Valor inválido');return '0x'+wei.toString(16)}
async function openTransfer(to,handle){try{if(!window.ethereum){await connect();if(!account)return}await ensureChain();modalBack.classList.add('show');modal.innerHTML=`<h2>Transferir para @${esc(handle)}</h2><p class="muted">O destinatário vem automaticamente da wallet assinada do autor do post.</p><div class="field"><label>Wallet destinatária</label><input value="${esc(to)}" readonly></div><div class="field"><label>Rede</label><input value="ZORYQ EVM Testnet · Chain ID 5919065" readonly></div><div class="field"><label>Valor em ZQ</label><input id="transferAmount" inputmode="decimal" value="0.0001"></div><div class="warning">Nenhum valor será enviado sem sua confirmação e a assinatura da sua wallet.</div><div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="reviewTransfer('${esc(to)}','${esc(handle)}')">Revisar transferência</button></div>`}catch(e){alert(e.message)}}
async function reviewTransfer(to,handle){try{const amount=transferAmount.value.trim();const value=toWeiHex(amount);const gas=await ethereum.request({method:'eth_estimateGas',params:[{from:account,to,value}]});const gasPrice=await ethereum.request({method:'eth_gasPrice'});const fee=BigInt(gas)*BigInt(gasPrice);const feeZq=Number(fee)/1e18;const ok=confirm(`REVISAR TRANSFERÊNCIA\n\nPara: @${handle}\nWallet: ${to}\nRede: ZORYQ EVM Testnet (5919065)\nValor: ${amount} ZQ\nTaxa estimada: ${feeZq.toFixed(8)} ZQ\n\nConfirma o envio?`);if(!ok)return;const tx=await ethereum.request({method:'eth_sendTransaction',params:[{from:account,to,value}]});closeModal();alert(`Transferência enviada\n${tx}`)}catch(e){alert(`Transferência não enviada: ${e.message}`)}}
function composerFields(){if(composerKind==='image')return `<div class="field"><label>Foto</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></div>`;if(composerKind==='token')return `<div class="field"><label>Chain ID</label><input id="chainId" value="5919065"></div><div class="field"><label>Contrato</label><input id="contract" placeholder="0x…"></div><div class="field"><label>Símbolo</label><input id="symbol" placeholder="ZQ"></div><div class="field"><label>Nome</label><input id="assetName" placeholder="Nome do token"></div>`;if(composerKind==='tx')return `<div class="field"><label>Chain ID</label><input id="chainId" value="5919065"></div><div class="field"><label>Hash</label><input id="txHash" placeholder="0x…"></div>`;if(composerKind==='dapp')return `<div class="field"><label>Chain ID</label><input id="chainId" value="5919065"></div><div class="field"><label>Nome</label><input id="dappName" placeholder="Nome do dApp"></div><div class="field"><label>HTTPS URL</label><input id="dappUrl" placeholder="https://…"></div>`;return''}
function chooseKind(k){composerKind=k;render()}
async function uploadPhoto(file){const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});const up=await req(SOCIAL,'/v1/media/image',{method:'POST',body:JSON.stringify({mime:file.type||'image/jpeg',dataBase64:data})});return up.url}
async function publish(){if(!me?.registered)return openRegistration();const content=document.getElementById('postText').value.trim();if(!content)return;let attachment=null;if(composerKind==='image'){const file=document.getElementById('photo').files[0];if(!file)throw Error('Selecione uma foto');attachment={url:await uploadPhoto(file),alt:content.slice(0,160)}}else if(composerKind==='token')attachment={chainId:Number(chainId.value),address:contract.value.trim(),symbol:symbol.value.trim(),name:assetName.value.trim()};else if(composerKind==='tx')attachment={chainId:Number(chainId.value),hash:txHash.value.trim()};else if(composerKind==='dapp')attachment={chainId:Number(chainId.value)||null,url:dappUrl.value.trim(),name:dappName.value.trim()};await req(SOCIAL,'/v1/posts',{method:'POST',body:JSON.stringify({content,kind:composerKind,attachment})});composerKind='text';await showView('home')}
async function searchNow(){const q=document.getElementById('search').value.trim();if(q.length<2)return;const j=await req(SOCIAL,`/v1/search?q=${encodeURIComponent(q)}`);main.innerHTML=`<div class="box"><div class="title">Resultados</div></div>${(j.users||[]).map(p=>`<div class="box" onclick="openProfileAddress('${p.address}')" style="cursor:pointer">${profileRow(p)}</div>`).join('')}${(j.posts||[]).map(postHtml).join('')}`}
async function openProfileAddress(a){activeProfile={address:a};view='profile';await loadProfile(a);render()}
async function follow(a){if(!me?.registered)return openRegistration();await req(SOCIAL,`/v1/follow/${a}`,{method:'POST'});await loadProfile(a);render()}
async function saveProfile(){const b={handle:editHandle.value.trim().replace(/^@/,''),displayName:editName.value.trim(),bio:editBio.value.trim(),avatarUrl:activeProfile.avatarUrl||'',bannerUrl:activeProfile.bannerUrl||''};const j=await req(SOCIAL,'/v1/profile',{method:'PUT',body:JSON.stringify(b)});me=j.profile;activeProfile=j.profile;renderSide();render()}
async function createCommunity(){if(!me?.registered)return openRegistration();const name=communityName.value.trim(),slug=communitySlug.value.trim(),description=communityDescription.value.trim();await req(COMMUNITY,'/v1/communities',{method:'POST',body:JSON.stringify({name,slug,description})});await showView('communities')}
async function runPersonSearch(){const q=messageTarget.value.trim();if(q.length<2)return;const j=/^0x[a-fA-F0-9]{40}$/.test(q)?{users:[(await req(SOCIAL,`/v1/profile/${q}`)).profile]}:await req(SOCIAL,`/v1/search?q=${encodeURIComponent(q.replace(/^@/,''))}`);document.getElementById('messageResults').innerHTML=(j.users||[]).map(p=>`<div class="conversation" onclick="newConversation('${p.address}')">${profileRow(p)}<div class="verified" style="margin-top:7px">Iniciar mensagem</div></div>`).join('')}
async function newConversation(target){if(!me?.registered)return openRegistration();const j=await req(MESSAGE,'/v1/conversations',{method:'POST',body:JSON.stringify({participant:target})});await openThread(j.conversation)}
async function openThread(c){openConversation=c;const j=await req(MESSAGE,`/v1/conversations/${c.id}/messages`);thread=j.items||[];try{await req(MESSAGE,`/v1/conversations/${c.id}/read`,{method:'POST'})}catch{}render()}
async function sendMessage(){if(!openConversation||!messageDraft.value.trim())return;await req(MESSAGE,`/v1/conversations/${openConversation.id}/messages`,{method:'POST',body:JSON.stringify({content:messageDraft.value.trim()})});await openThread(openConversation)}
function render(){renderSide();if(view==='home'){main.innerHTML=`${registrationOrLogin()}<div class="tabs"><button class="${scope==='for-you'?'on':''}" onclick="scope='for-you';showView('home')">Para você</button><button class="${scope==='following'?'on':''}" onclick="scope='following';showView('home')">Seguindo</button><button class="${scope==='bookmarks'?'on':''}" onclick="scope='bookmarks';showView('home')">Salvos</button></div>${feed.length?feed.map(postHtml).join(''):'<div class="box empty">Seu feed está começando.</div>'}`;return}if(view==='explore'){main.innerHTML=`<div class="box search"><input id="search" placeholder="Buscar pessoas, #hashtags, Web3…"><button class="btn primary" onclick="searchNow()">Buscar</button></div><div class="box"><div class="title">Em alta</div><div class="row wrap" style="margin-top:10px">${(exploreData?.trending||[]).map(t=>`<button class="tag" onclick="document.getElementById('search').value='#${esc(t.tag)}';searchNow()">#${esc(t.tag)} · ${t.count}</button>`).join('')}</div></div>${(exploreData?.suggestedProfiles||[]).map(p=>`<div class="box" onclick="openProfileAddress('${p.address}')" style="cursor:pointer">${profileRow(p)}</div>`).join('')}${(exploreData?.items||[]).map(postHtml).join('')}`;return}if(view==='create'){main.innerHTML=`${registrationOrLogin()}${me?.registered?`<div class="box"><h1 class="hero">Criar</h1><p class="muted">Os mesmos tipos e campos do APK.</p><div class="kinds">${[['text','Texto'],['image','Imagem'],['token','Token'],['tx','Transação'],['dapp','dApp']].map(([k,l])=>`<button class="${composerKind===k?'on':''}" onclick="chooseKind('${k}')">${l}</button>`).join('')}</div><div class="field"><label>Conteúdo</label><textarea id="postText" maxlength="500" placeholder="O que está acontecendo no Web3?"></textarea></div>${composerFields()}<button class="btn primary" onclick="publish().catch(e=>alert(e.message))">Publicar</button></div>`:''}`;return}if(view==='activity'){main.innerHTML=`${registrationOrLogin()}${notices.map(n=>`<div class="box notice" onclick="openProfileAddress('${n.actor}')" style="cursor:pointer">${avatar(n.actorProfile)}<div><b>@${esc(n.actorProfile.handle)}</b> · ${esc(n.type)}<div class="meta">${new Date(n.createdAt).toLocaleString()}</div></div></div>`).join('')}`;return}if(view==='profile'){if(!account||!me?.registered){main.innerHTML=registrationOrLogin();return}const p=activeProfile||me,mine=p.address.toLowerCase()===account.toLowerCase();main.innerHTML=`<div class="box">${profileRow(p)}<p>${esc(p.bio||'')}</p><div class="row wrap"><div class="profileStat"><b>${p.followers}</b><span class="muted">Seguidores</span></div><div class="profileStat"><b>${p.following}</b><span class="muted">Seguindo</span></div><div class="profileStat"><b>${p.posts}</b><span class="muted">Posts</span></div><div class="profileStat"><b>${p.reputation?.score||0}</b><span class="muted">Reputação</span></div></div>${mine?`<div class="field"><label>Nome</label><input id="editName" value="${esc(p.displayName)}"></div><div class="field"><label>@handle</label><input id="editHandle" value="${esc(p.handle)}"></div><div class="field"><label>Bio</label><textarea id="editBio">${esc(p.bio)}</textarea></div><button class="btn primary" onclick="saveProfile()">Salvar</button>`:`<button class="btn primary" onclick="follow('${p.address}')">${p.followedByViewer?'Seguindo':'Seguir'}</button>`}</div>${profilePosts.map(postHtml).join('')}`;return}if(view==='communities'){main.innerHTML=`${registrationOrLogin()}<div class="box"><div class="title">Comunidades</div><p class="muted">Mesma rede de comunidades do APK.</p>${me?.registered?`<div class="field"><label>Nome</label><input id="communityName"></div><div class="field"><label>slug</label><input id="communitySlug"></div><div class="field"><label>Descrição</label><textarea id="communityDescription"></textarea></div><button class="btn primary" onclick="createCommunity()">Criar comunidade</button>`:''}</div>${communities.map(c=>`<div class="box community"><b>${esc(c.name)}</b><div class="muted">/${esc(c.slug)} · ${c.members} membros · ${c.channels} canais</div><p>${esc(c.description||'')}</p></div>`).join('')}`;return}if(view==='messages'){if(openConversation){main.innerHTML=`<div class="box"><div class="row between"><div class="title">Mensagens</div><button class="btn" onclick="openConversation=null;render()">← Conversas</button></div><div class="warning">Privada por controle de acesso. Ainda não possui criptografia ponta a ponta.</div>${thread.map(m=>`<div class="bubble ${m.sender?.toLowerCase()===account.toLowerCase()?'mine':''}"><div>${esc(m.content)}</div><div class="meta">${new Date(m.createdAt).toLocaleString()}</div></div>`).join('')}<div class="messageComposer"><input id="messageDraft" placeholder="Mensagem…"><button class="btn primary" onclick="sendMessage()">Enviar</button></div></div>`;return}main.innerHTML=`${registrationOrLogin()}${me?.registered?`<div class="box"><div class="title">Mensagens</div><div class="search"><input id="messageTarget" placeholder="Buscar @usuário ou wallet"><button class="btn primary" onclick="runPersonSearch()">Buscar</button></div><div id="messageResults"></div><p class="muted">Wallet-to-wallet. O conteúdo ainda não é E2E.</p></div>`:''}${conversations.map(c=>`<div class="box conversation" onclick='openThread(${JSON.stringify(c).replace(/'/g,"&#39;")})'><b>${esc(c.lastMessage?.content||'Conversa iniciada')}</b><div class="meta">${c.participants.map(short).join(' ↔ ')} · ${c.unread||0} não lidas</div></div>`).join('')}`}}
walletBtn.onclick=()=>connect().catch(e=>alert(e.message));document.getElementById('swapBtn').onclick=()=>location.href='/swap';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>showView(b.dataset.product));modalBack.onclick=e=>{if(e.target===modalBack)closeModal()};if(window.ethereum)ethereum.on?.('accountsChanged',()=>location.reload());
(async()=>{try{const h=await req(SOCIAL,'/health');document.getElementById('socialStatus').textContent=h.ok?'ONLINE':'OFFLINE';document.getElementById('socialStatus').className=h.ok?'good':''}catch{document.getElementById('socialStatus').textContent='OFFLINE'}await reconnect();await Promise.all([loadFeed(),loadExplore()]);render()})();
</script>
</body></html>
