<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a10"><title>ZORYQ Generated dApp</title><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js"></script><link rel="stylesheet" href="/styles.css"><style>.wrap{width:min(900px,calc(100% - 28px));margin:auto}.hero{padding:48px 0 18px}.hero h1{font-size:clamp(40px,7vw,68px);line-height:1;margin:8px 0}.lead,.muted{color:#91a5bd}.card{border:1px solid #203149;background:radial-gradient(circle at 100% 0,rgba(198,255,0,.08),transparent 35%),linear-gradient(145deg,#101827,#0b111b);border-radius:22px;padding:22px;margin-bottom:50px}.input{width:100%;padding:13px;margin:7px 0;border:1px solid #2b3c54;border-radius:12px;background:#080f19;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.metric{font-size:56px;font-weight:900;margin:20px 0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.ok{color:#48dc97}.bad{color:#ff7474}.pill{display:inline-block;border:1px solid #33465f;border-radius:999px;padding:5px 9px;font-size:11px;color:#9fb3c9;margin:3px}</style></head><body><header class="nav"><a class="brand" href="/start"><span class="mark">Z</span><span>ZORYQ</span><b>GENERATED dAPP</b></a><nav><a href="/dapp-builder.html">AI dApp Builder</a><a href="/explorer">Explorer</a><a href="/start">Chain Console</a></nav></header><main class="wrap"><section class="hero"><span class="eyebrow">LIVE ON ZORYQ TESTNET</span><h1 id="name">Generated dApp</h1><p id="description" class="lead"></p><div><span class="pill">Chain ID 5919065</span><span class="pill">Wallet-signed</span><span class="pill">On-chain state</span></div></section><section class="card"><p class="muted">Contrato</p><p id="contract" class="mono">—</p><div class="row"><button id="connect" class="btn primary">Conectar carteira</button><button id="refresh" class="btn">Atualizar estado</button></div><hr style="border:0;border-top:1px solid #203149;margin:22px 0"><label id="metricLabel">Valor on-chain</label><div id="metricValue" class="metric">—</div><input id="value" class="input" type="number" min="0" step="1" placeholder="Novo valor"><button id="save" class="btn primary" disabled>Salvar on-chain</button><div id="msg" class="muted" style="margin-top:12px"></div></section></main><script>const RPC='https://zoryq-evm-node-live-production.up.railway.app/rpc',BASE='https://zoryq-evm-node-live-production.up.railway.app',CHAIN_ID=5919065,CHAIN='0x5a5159',ABI=['function set(uint256 newValue)','function value() view returns (uint256)'];const $=id=>document.getElementById(id);const q=new URLSearchParams(location.search);const address=q.get('contract');$('name').textContent=q.get('name')||'ZORYQ Generated dApp';$('metricLabel').textContent=q.get('metric')||'Valor on-chain';$('description').textContent=q.get('description')||'dApp gerado e implantado na ZORYQ Testnet.';$('contract').textContent=address||'Contrato não informado';let signer=null;function valid(){return address&&ethers.isAddress(address)}async function addNetwork(){if(!window.ethereum)throw Error('Instale MetaMask, Rabby ou outra carteira EVM.');await ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:CHAIN,chainName:'ZORYQ EVM Testnet',nativeCurrency:{name:'ZORYQ',symbol:'ZQ',decimals:18},rpcUrls:[RPC],blockExplorerUrls:[BASE+'/explorer']}]})}async function ensureNetwork(){const id=await ethereum.request({method:'eth_chainId'});if(parseInt(id,16)!==CHAIN_ID){try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN}]})}catch{await addNetwork()}}}async function connect(){if(!valid())throw Error('Endereço do contrato inválido.');if(!window.ethereum)throw Error('Carteira EVM não encontrada.');await ethereum.request({method:'eth_requestAccounts'});await addNetwork();await ensureNetwork();const p=new ethers.BrowserProvider(ethereum);signer=await p.getSigner();$('connect').textContent='Carteira conectada';$('save').disabled=false;await refresh()}async function refresh(){try{if(!valid())throw Error('Contrato inválido.');const p=new ethers.JsonRpcProvider(RPC,CHAIN_ID,{staticNetwork:true});const c=new ethers.Contract(address,ABI,p);const v=await c.value();$('metricValue').textContent=Number(v).toLocaleString('pt-BR');$('msg').innerHTML='<span class="ok">Estado lido diretamente da ZORYQ Testnet.</span>'}catch(e){$('metricValue').textContent='—';$('msg').innerHTML='<span class="bad">'+e.message+'</span>'}}async function save(){try{if(!signer)await connect();await ensureNetwork();const raw=$('value').value;if(raw===''||Number(raw)<0||!Number.isInteger(Number(raw)))throw Error('Informe um número inteiro não negativo.');$('save').disabled=true;$('msg').textContent='Aguardando confirmação na carteira…';const c=new ethers.Contract(address,ABI,signer);const tx=await c.set(BigInt(raw));$('msg').textContent='Transação enviada. Aguardando confirmação…';const r=await tx.wait();if(!r||r.status!==1)throw Error('Transação não confirmada.');$('msg').innerHTML='<span class="ok">Valor salvo on-chain.</span> Tx: <span class="mono">'+tx.hash+'</span>';await refresh()}catch(e){$('msg').innerHTML='<span class="bad">'+(e.shortMessage||e.message)+'</span>'}finally{$('save').disabled=!signer}}$('connect').onclick=()=>connect().catch(e=>alert(e.message));$('refresh').onclick=refresh;$('save').onclick=save;if(valid())refresh();else $('msg').innerHTML='<span class="bad">Abra este dApp usando o link gerado pelo ZORYQ AI dApp Builder.</span>';</script></body></html>
