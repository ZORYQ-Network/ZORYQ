<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZORYQ Quest Admin</title><script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.min.js"></script><style>body{margin:0;background:#050609;color:#fff;font-family:Inter,system-ui}.w{max-width:900px;margin:auto;padding:28px}.brand{font-weight:1000;letter-spacing:.24em}.card{background:#0c0f15;border:1px solid #242a38;border-radius:20px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea{width:100%;box-sizing:border-box;background:#07090d;color:#fff;border:1px solid #2a3140;border-radius:12px;padding:13px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:900;cursor:pointer;background:#b8ff49;color:#071000}.muted{color:#8b93a7}.ok{color:#b8ff49}.warn{color:#ffcf66}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="brand">ZORYQ</div><h1>Quest Admin</h1><p class="muted">Crie e gerencie quests registradas na ZORYQ Testnet. A wallet conectada precisa ser a owner do Quest Registry.</p><div class="card"><div class="grid"><input id="registry" placeholder="Quest Registry 0x..."><button id="connect">Conectar Wallet</button></div><p id="status" class="muted">Chain ID esperado: 5919065</p></div><div class="card"><h2>Nova quest</h2><div class="grid"><input id="title" placeholder="Título"><input id="points" type="number" min="1" placeholder="Pontos"><input id="start" type="datetime-local"><input id="end" type="datetime-local"></div><textarea id="uri" rows="3" placeholder="Metadata URI / hash / URL versionada" style="margin-top:12px"></textarea><button id="create" style="margin-top:12px">Criar quest on-chain</button><p id="result" class="muted"></p></div><div class="card"><h2>Ativar / pausar</h2><div class="grid"><input id="qid" type="number" min="1" placeholder="Quest ID"><select id="active" style="background:#07090d;color:#fff;border:1px solid #2a3140;border-radius:12px;padding:13px"><option value="true">Ativar</option><option value="false">Pausar</option></select></div><button id="toggle" style="margin-top:12px">Atualizar status</button></div><p><a href="/" style="color:#00e5ff">← Voltar ao ZORYQ Hub</a></p></div><script src="./config.js"></script><script>
const CHAIN=ZORYQ_CONFIG.chainIdHex;const ZERO='0x0000000000000000000000000000000000000000';const ABI=['function owner() view returns(address)','function createQuest(string,string,uint256,uint64,uint64) returns(uint256)','function setQuestActive(uint256,bool)','event QuestCreated(uint256 indexed questId,string title,uint256 points,uint64 startAt,uint64 endAt,string metadataURI)'];let signer;
const $=id=>document.getElementById(id);$('registry').value=ZORYQ_CONFIG.questRegistry===ZERO?'':ZORYQ_CONFIG.questRegistry;async function ensureChain(){const c=await ethereum.request({method:'eth_chainId'});if(c!==CHAIN)throw new Error('Conecte a wallet à ZORYQ EVM Testnet (Chain ID 5919065).')}
$('connect').onclick=async()=>{try{if(!window.ethereum)throw new Error('Wallet EVM não encontrada');await ethereum.request({method:'eth_requestAccounts'});await ensureChain();signer=await new ethers.BrowserProvider(ethereum).getSigner();$('status').className='ok';$('status').textContent='Conectado: '+await signer.getAddress()+(ZORYQ_CONFIG.questRegistry===ZERO?' • Quest Registry ainda não implantado':'')}catch(e){$('status').className='warn';$('status').textContent=e.message}}
function contract(){const a=$('registry').value.trim();if(!ethers.isAddress(a)||a===ZERO)throw new Error('Quest Registry ainda não foi implantado/configurado');if(!signer)throw new Error('Conecte a wallet');return new ethers.Contract(a,ABI,signer)}
$('create').onclick=async()=>{try{await ensureChain();const t=$('title').value.trim(),p=BigInt($('points').value||0),u=$('uri').value.trim();if(!t||p<=0n)throw new Error('Título e pontos são obrigatórios');const s=$('start').value?Math.floor(new Date($('start').value).getTime()/1000):0;const e=$('end').value?Math.floor(new Date($('end').value).getTime()/1000):0;$('result').textContent='Enviando transação...';const tx=await contract().createQuest(t,u,p,s,e);$('result').textContent='Tx: '+tx.hash;const r=await tx.wait();$('result').textContent='Quest criada. Bloco '+r.blockNumber+' • '+tx.hash}catch(e){$('result').textContent=e.shortMessage||e.message}}
$('toggle').onclick=async()=>{try{await ensureChain();const tx=await contract().setQuestActive(BigInt($('qid').value),$('active').value==='true');await tx.wait();alert('Status atualizado on-chain')}catch(e){alert(e.shortMessage||e.message)}}
</script></body></html>
