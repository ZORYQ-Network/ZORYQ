<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZORYQ Testnet Faucet</title><link rel="stylesheet" href="./styles.css"></head><body><header class="nav"><a class="brand" href="./"><span class="mark">Z</span><span>ZORYQ</span><b>FAUCET</b></a><nav><a href="./start">Start</a><a href="./explorer">Explorer</a><a href="./docs.html">Docs</a></nav><span id="netStatus" class="pill warn">Checking network</span></header><main class="explorer-shell"><span class="eyebrow">ZORYQ EVM TESTNET</span><h1 style="font-size:58px">Get 100 ZQ Testnet.</h1><p style="color:var(--muted);max-width:720px">ZQ from this faucet is testnet-only, has no monetary value and does not guarantee any future token or airdrop rights.</p><div class="searchbar"><input id="address" placeholder="0x wallet address"><button id="connect" class="btn">Connect wallet</button><button id="claim" class="btn primary">Claim 100 ZQ</button></div><div style="margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:14px"><a class="btn" target="_blank" rel="noopener noreferrer" href="https://x.com/intent/follow?screen_name=ZORIQNetwork">Follow @ZORIQNetwork ↗</a><label style="display:block;margin-top:12px;color:var(--muted)"><input id="follow" type="checkbox"> I confirm I followed @ZORIQNetwork. This is a self-attestation for faucet access; social Genesis points remain pending until X OAuth/API verification exists.</label></div><pre id="result" class="result">Connect a wallet or paste a ZORYQ Testnet address.</pre></main><script src="./config.js"></script><script src="./app.js"></script><script>const base=(window.ZORYQ_CONFIG||{}).rpcBase||'';const out=document.getElementById('result');document.getElementById('connect').onclick=async()=>{try{if(!window.ethereum)throw new Error('No EVM wallet detected');const a=await ethereum.request({method:'eth_requestAccounts'});if(a&&a[0])document.getElementById('address').value=a[0]}catch(e){out.textContent=e.message}};document.getElementById('claim').onclick=async()=>{const address=document.getElementById('address').value.trim();const followed=document.getElementById('follow').checked;if(!/^0x[0-9a-fA-F]{40}$/.test(address)){out.textContent='Enter a valid EVM address.';return}if(!followed){out.textContent='Follow @ZORIQNetwork and confirm the checkbox before claiming.';return}out.textContent='Submitting faucet claim…';try{const r=await fetch(base+'/faucet',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address,followAttested:true,xHandle:'@ZORIQNetwork'})});const j=await r.json();if(!r.ok)throw new Error(j.error==='cooldown'&&j.nextClaim?`Cooldown active. Next claim: ${j.nextClaim}`:j.error||'Faucet request failed');out.textContent=JSON.stringify(j,null,2);if(j.txHash){let a=document.getElementById('txlink');if(!a){a=document.createElement('a');a.id='txlink';a.style.display='block';a.style.marginTop='16px';document.querySelector('main').appendChild(a)}a.href='./tx/'+j.txHash;a.textContent='Open transaction in Explorer →'}}catch(e){out.textContent='Faucet unavailable: '+e.message}};</script></body></html>
