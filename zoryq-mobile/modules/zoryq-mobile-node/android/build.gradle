apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'network.zoryq.mobilenode'
version = '0.1.0'

android {
  namespace 'network.zoryq.mobilenode.expo'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  sourceSets {
    main {
      java.srcDirs += '../../../../zoryq-mobile-node/android/app/src/main/java'
      // The Wallet embeds only the reusable Mobile Node core/service classes.
      // MainActivity belongs to the standalone hardening APK and depends on
      // AppCompat + standalone UI resources that must not enter this library.
      java.exclude '**/MainActivity.kt'
    }
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
