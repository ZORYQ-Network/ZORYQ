apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'network.zoryq.mobilenode'
version = '0.1.0'

android {
  namespace 'network.zoryq.mobilenode.expo'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// The Wallet embeds only the reusable Mobile Node core/service classes.
// Keep the standalone Android Activity out of the Expo library: Kotlin does
// not honor Java SourceDirectorySet excludes for .kt sources pulled from an
// external java directory, so configure the Kotlin source set explicitly.
kotlin {
  sourceSets {
    main {
      kotlin.srcDir '../../../../zoryq-mobile-node/android/app/src/main/java'
      kotlin.exclude '**/MainActivity.kt'
    }
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
