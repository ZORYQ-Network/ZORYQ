name: ZORYQ State Recovery

on:
  push:
    branches: [zoryq-evm-testnet-node, zoryq-p0-soak-chaos]
    paths:
      - 'zoryq-evm-node/**'
      - '.github/workflows/zoryq-state-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_MNEMONIC: test test test test test test test test test test test junk
      TEST_ADDRESS: '0x1000000000000000000000000000000000000001'
    steps:
      - uses: actions/checkout@v4

      - name: Build node image
        run: docker build -t zoryq-recovery ./zoryq-evm-node

      - name: Start node with persistent Reth volume
        run: |
          set -euo pipefail
          docker volume create zoryq-recovery-state
          docker run -d --name zoryq-recovery \
            -p 18081:8080 \
            -v zoryq-recovery-state:/data \
            -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" \
            zoryq-recovery
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/health >/tmp/health.json; then
              if jq -e '(.chain.chainId // .chainId) == 5919065 and .persistence.mode == "reth-native-db" and .persistence.ready == true' /tmp/health.json >/dev/null; then
                docker exec zoryq-recovery test -d /data/reth/db
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs zoryq-recovery
          exit 1

      - name: Create deterministic state in isolated node
        run: |
          set -euo pipefail
          # This faucet call is against the isolated CI container only; it never touches the public testnet faucet.
          STATUS=$(curl -sS -o /tmp/faucet.json -w '%{http_code}' \
            -X POST http://127.0.0.1:18081/faucet \
            -H 'content-type: application/json' \
            -H 'x-real-ip: 127.0.0.2' \
            -d "{\"address\":\"$TEST_ADDRESS\"}")
          test "$STATUS" = '200'
          jq -e '.ok == true' /tmp/faucet.json >/dev/null

          for i in $(seq 1 60); do
            EXPECTED=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
              -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$TEST_ADDRESS\",\"latest\"]}" | jq -r .result)
            if [ "$EXPECTED" != '0x0' ] && [ "$EXPECTED" != 'null' ]; then break; fi
            sleep 1
          done
          test "$EXPECTED" != '0x0'
          test "$EXPECTED" != 'null'
          echo "$EXPECTED" >/tmp/expected-balance

          GENESIS=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"eth_getBlockByNumber","params":["0x0",false]}' | jq -r .result.hash)
          test -n "$GENESIS"
          test "$GENESIS" != 'null'
          echo "$GENESIS" >/tmp/genesis-hash

          for i in $(seq 1 60); do
            HEAD=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":3,"method":"eth_blockNumber","params":[]}' | jq -r .result)
            HEAD_DEC=$((16#${HEAD#0x}))
            if [ "$HEAD_DEC" -ge 5 ]; then break; fi
            sleep 1
          done
          test "$HEAD_DEC" -ge 5
          echo "$HEAD_DEC" >/tmp/head-before
          docker exec zoryq-recovery sh -c 'test -d /data/reth/db && test "$(find /data/reth/db -type f | wc -l)" -gt 0'

      - name: Hard-kill node without deleting native state
        run: |
          set -euo pipefail
          docker kill -s KILL zoryq-recovery
          docker rm zoryq-recovery

      - name: Restart from the same Reth database
        run: |
          set -euo pipefail
          docker run -d --name zoryq-recovered \
            -p 18081:8080 \
            -v zoryq-recovery-state:/data \
            -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" \
            zoryq-recovery
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/health >/tmp/recovered-health.json; then
              if jq -e '(.chain.chainId // .chainId) == 5919065 and .persistence.mode == "reth-native-db" and .persistence.ready == true' /tmp/recovered-health.json >/dev/null; then
                ready=1
                break
              fi
            fi
            if ! docker inspect -f '{{.State.Running}}' zoryq-recovered 2>/dev/null | grep -q true; then
              docker logs zoryq-recovered
              exit 1
            fi
            sleep 1
          done
          test "$ready" = '1'
          docker exec zoryq-recovered sh -c 'test -d /data/reth/db && test "$(find /data/reth/db -type f | wc -l)" -gt 0'

      - name: Verify native state survived crash and restart
        run: |
          set -euo pipefail
          EXPECTED=$(cat /tmp/expected-balance)
          ACTUAL=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"eth_getBalance\",\"params\":[\"$TEST_ADDRESS\",\"latest\"]}" | jq -r .result)
          test "$ACTUAL" = "$EXPECTED"

          EXPECTED_GENESIS=$(cat /tmp/genesis-hash)
          ACTUAL_GENESIS=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":5,"method":"eth_getBlockByNumber","params":["0x0",false]}' | jq -r .result.hash)
          test "$ACTUAL_GENESIS" = "$EXPECTED_GENESIS"

          BEFORE=$(cat /tmp/head-before)
          AFTER_HEX=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":6,"method":"eth_blockNumber","params":[]}' | jq -r .result)
          AFTER=$((16#${AFTER_HEX#0x}))
          test "$AFTER" -ge "$BEFORE"

          CHAIN_ID=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":7,"method":"eth_chainId","params":[]}' | jq -r .result)
          test "$CHAIN_ID" = '0x5a5159'
          docker logs zoryq-recovered 2>&1 | grep -q '/data/reth/db'
          echo "Native Reth DB recovery verified: state, genesis, height and chain identity survived SIGKILL."

      - name: Show recovery logs on failure
        if: failure()
        run: |
          docker logs zoryq-recovery 2>/dev/null || true
          docker logs zoryq-recovered 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f zoryq-recovery zoryq-recovered 2>/dev/null || true
          docker volume rm zoryq-recovery-state 2>/dev/null || true
