name: ZORYQ State Recovery

on:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-evm-node/**'
      - '.github/workflows/zoryq-state-recovery.yml'
  workflow_dispatch:

jobs:
  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build node image
        run: docker build -t zoryq-recovery ./zoryq-evm-node

      - name: Start node with persistent test volume
        run: |
          docker volume create zoryq-recovery-state
          docker run -d --name zoryq-recovery \
            -p 8080:8080 \
            -v zoryq-recovery-state:/data \
            -e ZORYQ_STATE_INTERVAL=30 \
            -e ZORYQ_STATE_BACKUP_INTERVAL=5 \
            -e ZORYQ_STATE_SNAPSHOT_RETRIES=5 \
            -e ZORYQ_STATE_SNAPSHOT_RETRY_DELAY=1 \
            zoryq-recovery
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then
              test "$(jq -r .chainId /tmp/health.json)" = "5919065"
              exit 0
            fi
            sleep 1
          done
          docker logs zoryq-recovery
          exit 1

      - name: Create deterministic local-only state
        run: |
          ADDRESS=0x1000000000000000000000000000000000000001
          curl -fsS -X POST http://127.0.0.1:8080/faucet \
            -H 'content-type: application/json' \
            -H 'x-real-ip: 127.0.0.1' \
            -d "{\"address\":\"$ADDRESS\"}" >/tmp/faucet.json
          EXPECTED=$(curl -fsS -X POST http://127.0.0.1:8080/rpc \
            -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$ADDRESS\",\"latest\"]}" | jq -r .result)
          test "$EXPECTED" != "0x0"
          echo "$EXPECTED" >/tmp/expected-balance

      - name: Wait for persisted state and verified compressed snapshot
        run: |
          sleep 42
          for i in $(seq 1 12); do
            if docker exec zoryq-recovery sh -c 'test -s /data/zoryq-state.json && test -s /data/zoryq-state.json.bak.gz'; then
              if docker logs zoryq-recovery 2>&1 | grep -q 'verified compressed recovery snapshot updated'; then
                exit 0
              fi
            fi
            sleep 5
          done
          docker logs zoryq-recovery
          exit 1

      - name: Stop node and corrupt only primary state
        run: |
          docker stop zoryq-recovery
          docker rm zoryq-recovery
          docker run --rm -v zoryq-recovery-state:/data alpine:3.20 sh -c "printf '{corrupted' > /data/zoryq-state.json"

      - name: Restart from the same volume and prove recovery
        run: |
          docker run -d --name zoryq-recovered \
            -p 8080:8080 \
            -v zoryq-recovery-state:/data \
            -e ZORYQ_STATE_INTERVAL=30 \
            -e ZORYQ_STATE_BACKUP_INTERVAL=5 \
            zoryq-recovery
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/recovered-health.json; then
              test "$(jq -r .chainId /tmp/recovered-health.json)" = "5919065"
              break
            fi
            sleep 1
          done
          docker logs zoryq-recovered 2>&1 | grep -q 'restored last verified compressed backup'
          docker exec zoryq-recovered node -e "JSON.parse(require('fs').readFileSync('/data/zoryq-state.json','utf8'))"

      - name: Verify funded state survived restore
        run: |
          ADDRESS=0x1000000000000000000000000000000000000001
          EXPECTED=$(cat /tmp/expected-balance)
          ACTUAL=$(curl -fsS -X POST http://127.0.0.1:8080/rpc \
            -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$ADDRESS\",\"latest\"]}" | jq -r .result)
          test "$ACTUAL" = "$EXPECTED"

      - name: Show recovery logs on failure
        if: failure()
        run: |
          docker logs zoryq-recovery 2>/dev/null || true
          docker logs zoryq-recovered 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f zoryq-recovery zoryq-recovered 2>/dev/null || true
          docker volume rm zoryq-recovery-state 2>/dev/null || true
