name: ZORYQ State Recovery

on:
  push:
    branches: [zoryq-evm-testnet-node, zoryq-p0-soak-chaos]
    paths:
      - 'zoryq-evm-node/**'
      - '.github/workflows/zoryq-state-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_MNEMONIC: test test test test test test test test test test test junk
      TEST_ADDRESS: '0x1000000000000000000000000000000000000001'
    steps:
      - uses: actions/checkout@v4

      - name: Build node image
        run: docker build -t zoryq-recovery ./zoryq-evm-node

      - name: Start node with persistent Reth volume
        run: |
          set -euo pipefail
          docker volume create zoryq-recovery-state
          docker run -d --name zoryq-recovery \
            -p 18081:8080 \
            -v zoryq-recovery-state:/data \
            -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" \
            zoryq-recovery
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/health >/tmp/health.json; then
              if jq -e '(.chain.chainId // .chainId) == 5919065 and .persistence.mode == "reth-native-db" and .persistence.readyForTraffic == true' /tmp/health.json >/dev/null; then
                docker exec zoryq-recovery test -d /data/reth/db
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs zoryq-recovery
          exit 1

      - name: Create deterministic state in isolated node
        run: |
          set -euo pipefail
          # This faucet call is against the isolated CI container only; it never touches the public testnet faucet.
          STATUS=$(curl -sS -o /tmp/faucet.json -w '%{http_code}' \
            -X POST http://127.0.0.1:18081/faucet/claim \
            -H 'content-type: application/json' \
            -H 'x-real-ip: 127.0.0.2' \
            -d "{\"address\":\"$TEST_ADDRESS\"}")
          test "$STATUS" = '200'
          jq -e '.ok == true' /tmp/faucet.json >/dev/null

          for i in $(seq 1 60); do
            EXPECTED=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
              -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$TEST_ADDRESS\",\"latest\"]}" | jq -r .result)
            if [ "$EXPECTED" != '0x0' ] && [ "$EXPECTED" != 'null' ]; then break; fi
            sleep 1
          done
          test "$EXPECTED" != '0x0'
          test "$EXPECTED" != 'null'
          echo "$EXPECTED" >/tmp/expected-balance

          GENESIS=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"eth_getBlockByNumber","params":["0x0",false]}' | jq -r .result.hash)
          test -n "$GENESIS"
          test "$GENESIS" != 'null'
          echo "$GENESIS" >/tmp/genesis-hash

          for i in $(seq 1 60); do
            HEAD=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":3,"method":"eth_blockNumber","params":[]}' | jq -r .result)
            HEAD_DEC=$((16#${HEAD#0x}))
            if [ "$HEAD_DEC" -ge 5 ]; then break; fi
            sleep 1
          done
          test "$HEAD_DEC" -ge 5
          echo "$HEAD_DEC" >/tmp/head-before
          docker exec zoryq-recovery sh -c 'test -d /data/reth/db && test "$(find /data/reth/db -type f | wc -l)" -gt 0'

      - name: Hard-kill node without deleting native state
        run: |
          set -euo pipefail
          docker kill -s KILL zoryq-recovery
          docker rm zoryq-recovery

      - name: Restart from the same Reth database
        run: |
          set -euo pipefail
          docker run -d --name zoryq-recovered \
            -p 18081:8080 \
            -v zoryq-recovery-state:/data \
            -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" \
            zoryq-recovery
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/health >/tmp/recovered-health.json; then
              if jq -e '(.chain.chainId // .chainId) == 5919065 and .persistence.mode == "reth-native-db" and .persistence.readyForTraffic == true' /tmp/recovered-health.json >/dev/null; then
                ready=1
                break
              fi
            fi
            if ! docker inspect -f '{{.State.Running}}' zoryq-recovered 2>/dev/null | grep -q true; then
              docker logs zoryq-recovered
              exit 1
            fi
            sleep 1
          done
          test "$ready" = '1'
          docker exec zoryq-recovered sh -c 'test -d /data/reth/db && test "$(find /data/reth/db -type f | wc -l)" -gt 0'

      - name: Verify native state survived crash and restart
        run: |
          set -euo pipefail
          EXPECTED=$(cat /tmp/expected-balance)
          ACTUAL=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"eth_getBalance\",\"params\":[\"$TEST_ADDRESS\",\"latest\"]}" | jq -r .result)
          echo "balance_before=$EXPECTED balance_after=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          EXPECTED_GENESIS=$(cat /tmp/genesis-hash)
          ACTUAL_GENESIS=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":5,"method":"eth_getBlockByNumber","params":["0x0",false]}' | jq -r .result.hash)
          echo "genesis_before=$EXPECTED_GENESIS genesis_after=$ACTUAL_GENESIS"
          test "$ACTUAL_GENESIS" = "$EXPECTED_GENESIS"

          BEFORE=$(cat /tmp/head-before)
          RECOVERED=0
          AFTER=0
          for i in $(seq 1 30); do
            AFTER_HEX=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":6,"method":"eth_blockNumber","params":[]}' | jq -r .result)
            AFTER=$((16#${AFTER_HEX#0x}))
            echo "head_before=$BEFORE head_after=$AFTER"
            if [ "$AFTER" -ge "$BEFORE" ]; then
              RECOVERED=1
              break
            fi
            sleep 1
          done
          test "$RECOVERED" = '1'

          CHAIN_ID=$(curl -fsS -X POST http://127.0.0.1:18081/rpc \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":7,"method":"eth_chainId","params":[]}' | jq -r .result)
          test "$CHAIN_ID" = '0x5a5159'

          docker logs zoryq-recovered > /tmp/recovered.log 2>&1
          docker exec zoryq-recovered test -d /data/reth/db
          RECOVERED_DB_ENTRIES=$(docker exec zoryq-recovered sh -lc 'find /data/reth/db -type f 2>/dev/null | wc -l')
          test "$RECOVERED_DB_ENTRIES" -gt 0
          echo "recovered_reth_db_entries=$RECOVERED_DB_ENTRIES"
          echo "Native Reth DB recovery verified: durable state and genesis survived SIGKILL, recovered Reth DB contains persisted files, and canonical head resumed to the pre-kill height."

      - name: Capture recovery diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p zoryq-recovery-evidence
          cp /tmp/expected-balance zoryq-recovery-evidence/expected-balance.txt 2>/dev/null || true
          cp /tmp/genesis-hash zoryq-recovery-evidence/expected-genesis-hash.txt 2>/dev/null || true
          cp /tmp/head-before zoryq-recovery-evidence/head-before.txt 2>/dev/null || true
          cp /tmp/health.json zoryq-recovery-evidence/health-before.json 2>/dev/null || true
          cp /tmp/recovered-health.json zoryq-recovery-evidence/health-after.json 2>/dev/null || true
          cp /tmp/faucet.json zoryq-recovery-evidence/isolated-faucet-response.json 2>/dev/null || true

          curl -sS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":101,\"method\":\"eth_getBalance\",\"params\":[\"$TEST_ADDRESS\",\"latest\"]}" > zoryq-recovery-evidence/balance-after.json || true
          curl -sS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":102,"method":"eth_getBlockByNumber","params":["0x0",false]}' > zoryq-recovery-evidence/genesis-after.json || true
          curl -sS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":103,"method":"eth_blockNumber","params":[]}' > zoryq-recovery-evidence/head-after.json || true
          curl -sS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":104,"method":"eth_chainId","params":[]}' > zoryq-recovery-evidence/chain-id-after.json || true
          docker logs zoryq-recovered > zoryq-recovery-evidence/recovered-node.log 2>&1 || true
          docker inspect zoryq-recovered > zoryq-recovery-evidence/recovered-container.json 2>&1 || true
          docker exec zoryq-recovered sh -c 'find /data/reth/db -type f -printf "%p %s bytes\n" | sort' > zoryq-recovery-evidence/reth-db-files.txt 2>&1 || true
          {
            echo "expected_balance=$(cat /tmp/expected-balance 2>/dev/null)"
            echo "actual_balance=$(jq -r '.result // .error // empty' zoryq-recovery-evidence/balance-after.json 2>/dev/null)"
            echo "expected_genesis=$(cat /tmp/genesis-hash 2>/dev/null)"
            echo "actual_genesis=$(jq -r '.result.hash // .error // empty' zoryq-recovery-evidence/genesis-after.json 2>/dev/null)"
            echo "head_before=$(cat /tmp/head-before 2>/dev/null)"
            echo "head_after=$(jq -r '.result // .error // empty' zoryq-recovery-evidence/head-after.json 2>/dev/null)"
            echo "chain_id_after=$(jq -r '.result // .error // empty' zoryq-recovery-evidence/chain-id-after.json 2>/dev/null)"
          } > zoryq-recovery-evidence/summary.txt
          cat zoryq-recovery-evidence/summary.txt

      - name: Upload recovery evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zoryq-state-recovery-${{ github.sha }}
          path: zoryq-recovery-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Show recovery logs on failure
        if: failure()
        run: |
          docker logs zoryq-recovery 2>/dev/null || true
          docker logs zoryq-recovered 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f zoryq-recovery zoryq-recovered 2>/dev/null || true
          docker volume rm zoryq-recovery-state 2>/dev/null || true
