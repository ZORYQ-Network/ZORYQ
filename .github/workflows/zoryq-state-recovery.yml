name: ZORYQ State Recovery

on:
  push:
    branches: [zoryq-evm-testnet-node, zoryq-p0-soak-chaos]
    paths:
      - 'zoryq-evm-node/**'
      - '.github/workflows/zoryq-state-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_MNEMONIC: test test test test test test test test test test test junk
      ZORYQ_CHAIN_ID_DEC: '5919065'
    steps:
      - uses: actions/checkout@v4

      - name: Build node image
        run: docker build -t zoryq-recovery ./zoryq-evm-node

      - name: Start node with persistent Reth volume
        run: |
          set -euo pipefail
          docker volume create zoryq-recovery-state
          docker run -d --name zoryq-recovery \
            -p 18081:8080 \
            -v zoryq-recovery-state:/data \
            -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" \
            zoryq-recovery
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/health >/tmp/health.json; then
              if jq -e --argjson chainId "$ZORYQ_CHAIN_ID_DEC" '(.chain.chainId // .chainId) == $chainId and (.chain.persistence.mode // .persistence.mode) == "reth-native-db" and ((.chain.persistence.readyForTraffic // .persistence.ready // false) == true)' /tmp/health.json >/dev/null; then
                docker exec zoryq-recovery test -d /data/reth/db
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs zoryq-recovery
          exit 1

      - name: Capture deterministic funded state in isolated node
        run: |
          set -euo pipefail
          TEST_ADDRESS=$(docker exec zoryq-recovery node --input-type=module -e 'import {HDNodeWallet} from "ethers"; console.log(HDNodeWallet.fromPhrase(process.env.ZORYQ_RETH_MNEMONIC,"","m/44'"'"'/60'"'"'/0'"'"'/0/0").address.toLowerCase())')
          test "$TEST_ADDRESS" != '0x0000000000000000000000000000000000000000'
          echo "$TEST_ADDRESS" >/tmp/test-address
          echo "canonical_operator=$TEST_ADDRESS"

          GENESIS_BALANCE=$(docker exec zoryq-recovery node --input-type=module -e 'import fs from "node:fs"; import {HDNodeWallet} from "ethers"; const g=JSON.parse(fs.readFileSync("/data/zoryq-reth-effective-genesis.json","utf8")); const a=HDNodeWallet.fromPhrase(process.env.ZORYQ_RETH_MNEMONIC,"","m/44'"'"'/60'"'"'/0'"'"'/0/0").address; const v=g.alloc[a]||g.alloc[a.toLowerCase()]; if(!v?.balance) process.exit(2); console.log(v.balance)')
          GENESIS_BALANCE_HEX=$(node -e 'process.stdout.write("0x"+BigInt(process.argv[1]).toString(16))' "$GENESIS_BALANCE")
          test "$GENESIS_BALANCE_HEX" != '0x0'
          echo "effective_genesis_balance_raw=$GENESIS_BALANCE"
          echo "effective_genesis_balance_hex=$GENESIS_BALANCE_HEX"

          for i in $(seq 1 60); do
            EXPECTED=$(curl -fsS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$TEST_ADDRESS\",\"latest\"]}" | jq -r .result)
            if [ "$EXPECTED" != '0x0' ] && [ "$EXPECTED" != 'null' ]; then break; fi
            sleep 1
          done
          test "$EXPECTED" != '0x0'
          test "$EXPECTED" != 'null'
          EXPECTED_DEC=$(node -e 'process.stdout.write(BigInt(process.argv[1]).toString())' "$EXPECTED")
          GENESIS_DEC=$(node -e 'process.stdout.write(BigInt(process.argv[1]).toString())' "$GENESIS_BALANCE_HEX")
          test "$EXPECTED_DEC" = "$GENESIS_DEC"
          echo "$EXPECTED" >/tmp/expected-balance

          GENESIS=$(curl -fsS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":2,"method":"eth_getBlockByNumber","params":["0x0",false]}' | jq -r .result.hash)
          test -n "$GENESIS"
          test "$GENESIS" != 'null'
          echo "$GENESIS" >/tmp/genesis-hash

          for i in $(seq 1 60); do
            HEAD=$(curl -fsS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":3,"method":"eth_blockNumber","params":[]}' | jq -r .result)
            HEAD_DEC=$((16#${HEAD#0x}))
            if [ "$HEAD_DEC" -ge 5 ]; then break; fi
            sleep 1
          done
          test "$HEAD_DEC" -ge 5
          echo "$HEAD_DEC" >/tmp/head-before
          docker exec zoryq-recovery sh -c 'test -d /data/reth/db && test "$(find /data/reth/db -type f | wc -l)" -gt 0'

      - name: Hard-kill node without deleting native state
        run: |
          set -euo pipefail
          docker kill -s KILL zoryq-recovery
          docker rm zoryq-recovery

      - name: Restart from the same Reth database
        run: |
          set -euo pipefail
          docker run -d --name zoryq-recovered -p 18081:8080 -v zoryq-recovery-state:/data -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" zoryq-recovery
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/health >/tmp/recovered-health.json; then
              if jq -e --argjson chainId "$ZORYQ_CHAIN_ID_DEC" '(.chain.chainId // .chainId) == $chainId and (.chain.persistence.mode // .persistence.mode) == "reth-native-db" and ((.chain.persistence.readyForTraffic // .persistence.ready // false) == true)' /tmp/recovered-health.json >/dev/null; then ready=1; break; fi
            fi
            if ! docker inspect -f '{{.State.Running}}' zoryq-recovered 2>/dev/null | grep -q true; then docker logs zoryq-recovered; exit 1; fi
            sleep 1
          done
          test "$ready" = '1'
          docker exec zoryq-recovered sh -c 'test -d /data/reth/db && test "$(find /data/reth/db -type f | wc -l)" -gt 0'

      - name: Verify native state survived crash and restart
        run: |
          set -euo pipefail
          TEST_ADDRESS=$(cat /tmp/test-address)
          EXPECTED=$(cat /tmp/expected-balance)
          ACTUAL=$(curl -fsS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"eth_getBalance\",\"params\":[\"$TEST_ADDRESS\",\"latest\"]}" | jq -r .result)
          echo "balance_before=$EXPECTED balance_after=$ACTUAL"
          test "$(node -e 'process.stdout.write(BigInt(process.argv[1]).toString())' "$ACTUAL")" = "$(node -e 'process.stdout.write(BigInt(process.argv[1]).toString())' "$EXPECTED")"
          EXPECTED_GENESIS=$(cat /tmp/genesis-hash)
          ACTUAL_GENESIS=$(curl -fsS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":5,"method":"eth_getBlockByNumber","params":["0x0",false]}' | jq -r .result.hash)
          test "$ACTUAL_GENESIS" = "$EXPECTED_GENESIS"
          BEFORE=$(cat /tmp/head-before); RECOVERED=0
          for i in $(seq 1 30); do AFTER_HEX=$(curl -fsS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":6,"method":"eth_blockNumber","params":[]}' | jq -r .result); AFTER=$((16#${AFTER_HEX#0x})); if [ "$AFTER" -ge "$BEFORE" ]; then RECOVERED=1; break; fi; sleep 1; done
          test "$RECOVERED" = '1'
          CHAIN_ID=$(curl -fsS -X POST http://127.0.0.1:18081/rpc -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":7,"method":"eth_chainId","params":[]}' | jq -r .result)
          test "$CHAIN_ID" = "$(printf '0x%x' "$ZORYQ_CHAIN_ID_DEC")"
          docker exec zoryq-recovered sh -lc 'test -d /data/reth/db && test "$(find /data/reth/db -type f | wc -l)" -gt 0'
          echo "Native Reth DB recovery verified after SIGKILL."

      - name: Capture recovery diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p zoryq-recovery-evidence
          cp /tmp/test-address zoryq-recovery-evidence/test-address.txt 2>/dev/null || true
          cp /tmp/expected-balance zoryq-recovery-evidence/expected-balance.txt 2>/dev/null || true
          cp /tmp/genesis-hash zoryq-recovery-evidence/expected-genesis-hash.txt 2>/dev/null || true
          cp /tmp/head-before zoryq-recovery-evidence/head-before.txt 2>/dev/null || true
          cp /tmp/health.json zoryq-recovery-evidence/health-before.json 2>/dev/null || true
          cp /tmp/recovered-health.json zoryq-recovery-evidence/health-after.json 2>/dev/null || true
          docker logs zoryq-recovery > zoryq-recovery-evidence/initial-node.log 2>&1 || true
          docker logs zoryq-recovered > zoryq-recovery-evidence/recovered-node.log 2>&1 || true

      - name: Upload recovery evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zoryq-state-recovery-${{ github.sha }}
          path: zoryq-recovery-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Show recovery logs on failure
        if: failure()
        run: |
          docker logs zoryq-recovery 2>/dev/null || true
          docker logs zoryq-recovered 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f zoryq-recovery zoryq-recovered 2>/dev/null || true
          docker volume rm zoryq-recovery-state 2>/dev/null || true