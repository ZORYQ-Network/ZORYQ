name: ZORYQ Mainnet Launch Guard

on:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'Dockerfile'
      - 'zoryq-evm-node/Dockerfile'
      - 'zoryq-evm-node/entrypoint.sh'
      - 'zoryq-evm-node/mainnet-guard.mjs'
      - 'zoryq-evm-node/server.mjs'
      - 'zoryq-evm-node/prepare-reth-genesis.mjs'
      - 'zoryq-evm-node/zoryq-reth-genesis.json'
      - 'zoryq-mainnet/**'
      - '.github/workflows/zoryq-mainnet-launch-guard.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'zoryq-evm-node/Dockerfile'
      - 'zoryq-evm-node/entrypoint.sh'
      - 'zoryq-evm-node/mainnet-guard.mjs'
      - 'zoryq-evm-node/server.mjs'
      - 'zoryq-evm-node/prepare-reth-genesis.mjs'
      - 'zoryq-evm-node/zoryq-reth-genesis.json'
      - 'zoryq-mainnet/**'
      - '.github/workflows/zoryq-mainnet-launch-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Accept explicit testnet mode
        run: |
          set -euo pipefail
          ZORYQ_NETWORK_MODE=testnet node zoryq-evm-node/mainnet-guard.mjs | tee /tmp/testnet-guard.json
          jq -e '.ok == true and .mode == "testnet" and .mainnetActivated == false and .launchGuard == "armed"' /tmp/testnet-guard.json

      - name: Reject unknown network modes
        run: |
          set +e
          ZORYQ_NETWORK_MODE=production node zoryq-evm-node/mainnet-guard.mjs > /tmp/invalid-mode.json
          code=$?
          set -e
          cat /tmp/invalid-mode.json
          test "$code" -eq 64
          jq -e '.ok == false and .error == "unsupported_network_mode"' /tmp/invalid-mode.json

      - name: Prove current code cannot be mislabeled mainnet
        run: |
          set +e
          ZORYQ_NETWORK_MODE=mainnet node zoryq-evm-node/mainnet-guard.mjs > /tmp/mainnet-guard.json
          code=$?
          set -e
          cat /tmp/mainnet-guard.json
          test "$code" -eq 78
          jq -e '
            .ok == false and
            .mode == "mainnet" and
            .mainnetActivated == false and
            (.blockers | index("execution_client_dev_mode")) != null and
            (.blockers | index("execution_client_dev_mnemonic")) != null and
            (.blockers | index("embedded_dev_faucet_wallets")) != null and
            (.blockers | index("operator_mnemonic_autogeneration")) != null and
            (.blockers | index("mainnet_genesis_path_missing")) != null and
            (.blockers | index("external_signer_not_attested")) != null and
            (.blockers | index("production_consensus_not_attested")) != null and
            (.blockers | index("security_audit_not_attested")) != null and
            (.blockers | index("incident_runbook_not_attested")) != null
          ' /tmp/mainnet-guard.json

      - name: Verify public debug remains blocked in source policy
        run: |
          set -euo pipefail
          grep -F "debug_" zoryq-evm-node/server.mjs
          grep -F "BLOCKED_PREFIXES" zoryq-evm-node/server.mjs
          grep -F "Administrative or node-managed signing RPC method disabled" zoryq-evm-node/server.mjs

      - name: Generate deterministic secret-free genesis artifact
        run: |
          set -euo pipefail
          cat > /tmp/mainnet-config.json <<'JSON'
          {
            "network": "ZORYQ Mainnet Ceremony Test",
            "chainId": 15919065,
            "consensus": "external-engine",
            "timestamp": "0x1",
            "gasLimit": "0x1c9c380",
            "baseFeePerGas": "0x3b9aca00",
            "extraData": "0x",
            "allocations": [
              {"address":"0x2222222222222222222222222222222222222222","balanceWei":"0x2"},
              {"address":"0x1111111111111111111111111111111111111111","balanceWei":"0x1"}
            ]
          }
          JSON
          node zoryq-mainnet/genesis-ceremony.mjs --config /tmp/mainnet-config.json --out /tmp/ceremony-a
          node zoryq-mainnet/genesis-ceremony.mjs --config /tmp/mainnet-config.json --out /tmp/ceremony-b
          cmp /tmp/ceremony-a/genesis.json /tmp/ceremony-b/genesis.json
          cmp /tmp/ceremony-a/genesis.sha256 /tmp/ceremony-b/genesis.sha256
          jq -e '.secretMaterialAccepted == false and .chainId == 15919065 and .allocations == 2 and .allocationTotalWei == "3" and .supplyInvariantVerified == false' /tmp/ceremony-a/ceremony.json
          test "$(jq -r '.alloc | keys[0]' /tmp/ceremony-a/genesis.json)" = "0x1111111111111111111111111111111111111111"

      - name: Enforce production genesis treasury and supply invariants
        run: |
          set -euo pipefail
          cat > /tmp/production-genesis.json <<'JSON'
          {
            "network": "ZORYQ Mainnet",
            "chainId": 15919065,
            "consensus": "external-engine",
            "timestamp": "0x1",
            "treasuryAddress": "0x1111111111111111111111111111111111111111",
            "expectedAllocTotalWei": "0x3",
            "allocations": [
              {"address":"0x1111111111111111111111111111111111111111","balanceWei":"0x1"},
              {"address":"0x2222222222222222222222222222222222222222","balanceWei":"0x2"}
            ]
          }
          JSON
          node zoryq-mainnet/genesis-ceremony.mjs --config /tmp/production-genesis.json --out /tmp/production-ceremony
          jq -e '.network == "ZORYQ Mainnet" and .allocationTotalWei == "3" and .expectedAllocTotalWei == "3" and .supplyInvariantVerified == true and .treasuryAddress == "0x1111111111111111111111111111111111111111"' /tmp/production-ceremony/ceremony.json

          jq '.expectedAllocTotalWei = "0x4"' /tmp/production-genesis.json > /tmp/bad-supply.json
          if node zoryq-mainnet/genesis-ceremony.mjs --config /tmp/bad-supply.json --out /tmp/bad-supply-out; then
            echo 'ceremony unexpectedly accepted mismatched production supply' >&2
            exit 1
          fi

          jq '.treasuryAddress = "0x3333333333333333333333333333333333333333"' /tmp/production-genesis.json > /tmp/bad-treasury.json
          if node zoryq-mainnet/genesis-ceremony.mjs --config /tmp/bad-treasury.json --out /tmp/bad-treasury-out; then
            echo 'ceremony unexpectedly accepted an unallocated production treasury' >&2
            exit 1
          fi

          jq 'del(.treasuryAddress)' /tmp/production-genesis.json > /tmp/no-treasury.json
          if node zoryq-mainnet/genesis-ceremony.mjs --config /tmp/no-treasury.json --out /tmp/no-treasury-out; then
            echo 'ceremony unexpectedly accepted production genesis without treasuryAddress' >&2
            exit 1
          fi

      - name: Reject testnet chain id and secret material in mainnet ceremony
        run: |
          set -euo pipefail
          cat > /tmp/reused-testnet.json <<'JSON'
          {"network":"bad","chainId":5919065,"consensus":"external-engine","timestamp":"0x1","allocations":[]}
          JSON
          if node zoryq-mainnet/genesis-ceremony.mjs --config /tmp/reused-testnet.json --out /tmp/reused; then
            echo 'ceremony unexpectedly accepted the testnet chain id' >&2
            exit 1
          fi
          cat > /tmp/secret-config.json <<'JSON'
          {"network":"bad","chainId":15919065,"consensus":"external-engine","timestamp":"0x1","mnemonic":"never accept this","allocations":[]}
          JSON
          if node zoryq-mainnet/genesis-ceremony.mjs --config /tmp/secret-config.json --out /tmp/secret; then
            echo 'ceremony unexpectedly accepted secret material' >&2
            exit 1
          fi

      - name: Verify threshold-signed launch certificate
        run: |
          set -euo pipefail
          node zoryq-mainnet/launch-certificate-selftest.mjs | tee /tmp/launch-certificate-selftest.json
          jq -e '.ok == true and .scheme == "ed25519" and .threshold == 3 and .tamperRejected == true and .belowThresholdRejected == true and .privateKeysPersisted == false' /tmp/launch-certificate-selftest.json
