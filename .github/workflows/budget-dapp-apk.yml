name: Build ZORYQ App Runner APK

on:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'apps/budget-dapp-android/BUILD_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: apps/budget-dapp-android
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp apps/budget-dapp-android/app/build/outputs/apk/debug/app-debug.apk dist/ZORYQ-App-Runner.apk
          sha256sum dist/ZORYQ-App-Runner.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-App-Runner-APK-${{ github.run_number }}
          path: |
            dist/ZORYQ-App-Runner.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
