name: ZORYQ OBEP Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zoryq-developer/obep/**'
      - '.github/workflows/zoryq-obep-proof.yml'

permissions:
  contents: read

jobs:
  obep-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        run: |
          mkdir -p zoryq-evidence/obep
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "runner_os=${RUNNER_OS}"
          } | tee zoryq-evidence/obep/environment.txt

      - name: Install OBEP verifier dependencies
        working-directory: zoryq-developer/obep
        run: npm install --package-lock=false

      - name: Run OBEP lifecycle and adversarial tests
        working-directory: zoryq-developer/obep
        run: |
          set -o pipefail
          npm test | tee ../../zoryq-evidence/obep/test-output.txt

      - name: Verify versioned live reference exactly as an external developer would
        working-directory: zoryq-developer/obep
        run: |
          set -o pipefail
          npm run verify:reference | tee ../../zoryq-evidence/obep/reference-verification.txt

      - name: Generate independently-verifiable local Proof Pack fixture
        run: |
          node zoryq-developer/obep/proof-fixture.mjs > zoryq-evidence/obep/proof-pack.json
          node zoryq-developer/obep/verify-proof-pack.mjs zoryq-evidence/obep/proof-pack.json | tee zoryq-evidence/obep/verification.txt

      - name: Generate fresh live ZORYQ Testnet OBEP economic proof
        env:
          ZORYQ_PUBLIC_BASE_URL: https://zoryq-evm-node-live-production.up.railway.app
        run: |
          set -o pipefail
          node zoryq-developer/obep/live-proof.mjs zoryq-evidence/obep/live-proof.json | tee zoryq-evidence/obep/live-proof-generation.txt

      - name: Independently re-verify fresh live proof from public RPC
        run: |
          set -o pipefail
          node zoryq-developer/obep/verify-live-proof.mjs zoryq-evidence/obep/live-proof.json | tee zoryq-evidence/obep/live-proof-verification.txt

      - name: Upload OBEP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoryq-obep-proof-${{ github.sha }}
          path: zoryq-evidence/obep/
          if-no-files-found: error
          retention-days: 90
