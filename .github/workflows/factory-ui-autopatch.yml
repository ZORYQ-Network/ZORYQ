name: Wire Factory Automatic APK Button

on:
  push:
    branches:
      - fix/factory-standalone-apk-install
    paths:
      - '.github/workflows/factory-ui-autopatch.yml'
      - '.github/scripts/patch_factory_apk_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/factory-standalone-apk-install
      - name: Wire automatic APK button
        run: python .github/scripts/patch_factory_apk_ui.py
      - name: Commit Factory UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name zoryq-factory-bot
          git config user.email actions@users.noreply.github.com
          git add zoryq-web/launch-studio.html
          if git diff --cached --quiet; then
            echo 'No Factory UI changes required.'
            exit 0
          fi
          git commit -m 'feat(factory): generate signed APK from Factory button'
          git push origin HEAD:fix/factory-standalone-apk-install
