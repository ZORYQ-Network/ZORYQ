name: Deploy ZORYQ Testnet Contracts V2

'on':
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_NEW_ZORYQ_TESTNET_SUITE to acknowledge this creates a new contract suite'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_NEW_ZORYQ_TESTNET_SUITE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build and test contracts before any broadcast
        working-directory: zoryq-contracts
        run: |
          printf '[profile.default]\nsrc = "src"\ntest = "test"\nout = "out"\nsolc_version = "0.8.24"\n' > foundry.toml
          forge build
          forge test -vv
      - name: Refuse deployment while privileged signer control is unverified
        run: |
          echo 'Deployment intentionally blocked.'
          echo 'Current on-chain owner alignment points to 0xc0e03982FB8615ddf8b8faBd27e5A35541E12F33, but authorized signer control has not been verified.'
          echo 'Use a reviewed deployment workflow only after signer control, target addresses, initial liquidity, and post-deploy verification are explicitly approved.'
          exit 1
