name: ZORYQ Multi-Process Candidate EVM Evidence

on:
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-developer/verification/multiprocess-candidate-evm.mjs'
      - '.github/workflows/zoryq-multiprocess-candidate-evm.yml'

permissions:
  contents: read

jobs:
  multiprocess-candidate-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_MNEMONIC: test test test test test test test test test test test junk
    steps:
      - uses: actions/checkout@v4
      - name: Build ZORYQ executor image
        run: docker build -t zoryq-fabric-evidence ./zoryq-evm-node
      - name: Start three candidate executors and isolated serial reference
        run: |
          set -euo pipefail
          for n in 0 1 2 serial; do docker volume create "zoryq-fabric-${n}-db" >/dev/null; done
          docker run -d --name zoryq-fabric-executor-0 -p 8081:8080 -v zoryq-fabric-0-db:/data -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" zoryq-fabric-evidence
          docker run -d --name zoryq-fabric-executor-1 -p 8082:8080 -v zoryq-fabric-1-db:/data -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" zoryq-fabric-evidence
          docker run -d --name zoryq-fabric-executor-2 -p 8083:8080 -v zoryq-fabric-2-db:/data -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" zoryq-fabric-evidence
          docker run -d --name zoryq-fabric-serial -p 8084:8080 -v zoryq-fabric-serial-db:/data -e ZORYQ_RETH_MNEMONIC="$TEST_MNEMONIC" zoryq-fabric-evidence
          for port in 8081 8082 8083 8084; do
            ok=0
            for i in $(seq 1 120); do
              if curl -fsS "http://127.0.0.1:${port}/health" >/tmp/health-${port}.json; then
                test "$(jq -r '.chain.chainId // .chainId' /tmp/health-${port}.json)" = "5919065"
                ok=1
                break
              fi
              sleep 1
            done
            test "$ok" = "1"
          done
      - name: Install verification-only dependencies
        working-directory: zoryq-evm-node
        run: npm install --no-save --no-audit --no-fund solc@0.8.30
      - name: Run multi-process candidate EVM experiment
        env:
          ZORYQ_MULTIPROCESS_EVM_OUT: multiprocess-candidate-evm.json
        run: node zoryq-developer/verification/multiprocess-candidate-evm.mjs
      - name: Enforce evidence semantics
        run: |
          set -euo pipefail
          jq -e '.status == "MULTIPROCESS_CONCURRENT_EVM_CANDIDATE_EXECUTION"' multiprocess-candidate-evm.json >/dev/null
          jq -e '.canonical == false' multiprocess-candidate-evm.json >/dev/null
          jq -e '.executorCount >= 3' multiprocess-candidate-evm.json >/dev/null
          jq -e '.separateContainers == true' multiprocess-candidate-evm.json >/dev/null
          jq -e '.equivalentParentFixture == true' multiprocess-candidate-evm.json >/dev/null
          jq -e '.concurrentIntervalsOverlap == true' multiprocess-candidate-evm.json >/dev/null
          jq -e '.candidateResults | length >= 3' multiprocess-candidate-evm.json >/dev/null
          jq -e '[.candidateResults[].access.writes | length > 0] | all' multiprocess-candidate-evm.json >/dev/null
          jq -e '.equality.finalStorage == true' multiprocess-candidate-evm.json >/dev/null
          jq -e '.equality.receiptStatusAndGas == true' multiprocess-candidate-evm.json >/dev/null
          jq -e '.claimBoundary | contains("does not prove parallel EVM state transition inside a single execution client")' multiprocess-candidate-evm.json >/dev/null
          sha256sum multiprocess-candidate-evm.json | tee multiprocess-candidate-evm.sha256
      - name: Capture executor logs
        if: always()
        run: |
          for n in executor-0 executor-1 executor-2 serial; do docker logs "zoryq-fabric-${n}" > "zoryq-fabric-${n}.log" 2>&1 || true; done
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoryq-multiprocess-candidate-evm-${{ github.sha }}
          path: |
            multiprocess-candidate-evm.json
            multiprocess-candidate-evm.sha256
            zoryq-fabric-executor-0.log
            zoryq-fabric-executor-1.log
            zoryq-fabric-executor-2.log
            zoryq-fabric-serial.log
          if-no-files-found: error
          retention-days: 30
