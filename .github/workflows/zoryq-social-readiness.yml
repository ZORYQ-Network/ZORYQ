name: ZORYQ Social Readiness

on:
  pull_request:
    paths:
      - 'zoryq-web/zoryq-social.html'
      - 'zoryq-web/config.js'
      - 'zoryq-web/vercel.json'
      - 'zoryq-developer/scripts/check-zoryq-social-readiness.mjs'
      - '.github/workflows/zoryq-social-readiness.yml'
  push:
    branches:
      - zoryq-evm-testnet-node
    paths:
      - 'zoryq-web/zoryq-social.html'
      - 'zoryq-web/config.js'
      - 'zoryq-web/vercel.json'
      - 'zoryq-developer/scripts/check-zoryq-social-readiness.mjs'
      - '.github/workflows/zoryq-social-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Static deploy readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ZORYQ Social deployment package
        run: node zoryq-developer/scripts/check-zoryq-social-readiness.mjs
