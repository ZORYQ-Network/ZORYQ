name: ZORYQ Rush City Source Readiness

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'zoryq-games-unity/**'
      - 'zoryq-mobile/ZoryqPlayBridge.ts'
      - 'zoryq-mobile/with-zoryq-game-bridge.js'
      - '.github/workflows/zoryq-rush-city-readiness.yml'
      - '.github/workflows/zoryq-rush-city-unity-build.yml'

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Unity production structure
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity
          test -f zoryq-games-unity/ProjectSettings/ProjectVersion.txt
          grep -Fq '6000.3.15f1' zoryq-games-unity/ProjectSettings/ProjectVersion.txt
          test -f zoryq-games-unity/Assets/ZORYQ/Core/ZoryqPlayBridge.cs
          for f in RushCityGameManager RushCityPlayerController RushCityTrackManager RushCityCameraController RushCityProceduralCity RushCityQualityManager RushCityMissionDirector RushCityPowerUp RushCityTelemetry RushCityChaseDirector RushCityNearMissZone RushCityGhostRecorder RushCityGhostPlayback RushCityGhostRaceManager RushCityLiveOpsConfig RushCityRouteDirector RushCityRouteChoiceZone RushCityGameEvents RushCityPresentationDirector RushCityAudioDirector RushCityHudPresenter RushCityVfxDirector RushCityEnvironmentDirector; do
            test -f "$ROOT/Scripts/$f.cs"
          done
          test -f $ROOT/Editor/RushCitySceneBuilder.cs
          test -f $ROOT/Editor/RushCityCiBuild.cs

      - name: Verify movement physics and branching routes
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity/Scripts
          PLAYER=$ROOT/RushCityPlayerController.cs
          TRACK=$ROOT/RushCityTrackManager.cs
          ROUTE=$ROOT/RushCityRouteDirector.cs
          grep -Fq 'wallProbeDistance = 1.75f' "$PLAYER"
          grep -Fq 'CharacterController' "$PLAYER"
          grep -Fq 'WallRun()' "$PLAYER"
          grep -Fq 'RushCityRouteDirector.Instance.CurrentCenterX' "$PLAYER"
          grep -Fq '"Road"' "$TRACK"
          grep -Fq '_road, true' "$TRACK"
          grep -Fq 'ShiftFutureSegments' "$TRACK"
          grep -Fq 'BranchDeck' "$TRACK"
          grep -Fq 'RushCityRouteChoiceZone' "$TRACK"
          grep -Fq 'CurrentCenterX' "$ROUTE"
          grep -Fq 'ChooseBranch' "$ROUTE"
          grep -Fq 'RushDistrict' "$ROUTE"

      - name: Verify premium gameplay systems
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity/Scripts
          GAME=$ROOT/RushCityGameManager.cs
          TRACK=$ROOT/RushCityTrackManager.cs
          QUALITY=$ROOT/RushCityQualityManager.cs
          MISSION=$ROOT/RushCityMissionDirector.cs
          POWER=$ROOT/RushCityPowerUp.cs
          GHOST=$ROOT/RushCityGhostRecorder.cs
          PLAYBACK=$ROOT/RushCityGhostPlayback.cs
          GHOSTMGR=$ROOT/RushCityGhostRaceManager.cs
          LIVEOPS=$ROOT/RushCityLiveOpsConfig.cs
          grep -Fq 'SkillFlow' "$GAME"
          grep -Fq 'RegisterNearMiss' "$GAME"
          grep -Fq 'ActivatePowerUp' "$GAME"
          grep -Fq 'RegisterRouteChoice' "$GAME"
          grep -Fq 'RushCityLiveOpsConfig.Instance' "$GAME"
          grep -Fq 'ZqDensity' "$TRACK"
          grep -Fq 'zqDensityMultiplier' "$TRACK"
          grep -Fq 'TargetFps' "$QUALITY"
          grep -Fq '120' "$QUALITY"
          grep -Fq 'RushMissionType' "$MISSION"
          grep -Fq 'NearMiss' "$MISSION"
          for p in Magnet Shield Overdrive Multiplier; do grep -Fq "$p" "$POWER"; done
          grep -Fq 'zoryq.rush.ghost.v1' "$GHOST"
          grep -Fq 'sampleInterval' "$GHOST"
          grep -Fq 'LoadJson' "$PLAYBACK"
          grep -Fq 'ghostRaceEnabled' "$GHOSTMGR"
          grep -Fq 'zoryq.rush.liveops.v1' "$LIVEOPS"
          grep -Fq 'stormEventEnabled' "$LIVEOPS"

      - name: Verify presentation game feel and HUD
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity/Scripts
          CAMERA=$ROOT/RushCityCameraController.cs
          PRESENT=$ROOT/RushCityPresentationDirector.cs
          AUDIO=$ROOT/RushCityAudioDirector.cs
          HUD=$ROOT/RushCityHudPresenter.cs
          VFX=$ROOT/RushCityVfxDirector.cs
          ENV=$ROOT/RushCityEnvironmentDirector.cs
          grep -Fq 'Impulse' "$CAMERA"
          grep -Fq 'FovKick' "$CAMERA"
          grep -Fq 'RollKick' "$CAMERA"
          grep -Fq 'RushCityGameEvents' "$PRESENT"
          grep -Fq 'Handheld.Vibrate' "$PRESENT"
          grep -Fq 'windLoop' "$AUDIO"
          grep -Fq 'chaseLoop' "$AUDIO"
          grep -Fq 'CanvasScaler' "$HUD"
          grep -Fq 'ChaseBar' "$HUD"
          grep -Fq 'FlowBar' "$HUD"
          grep -Fq 'ParticleSystem' "$VFX"
          grep -Fq 'stormEventEnabled' "$ENV"
          grep -Fq 'RenderSettings.fogColor' "$ENV"

      - name: Verify scene assembles production systems
        run: |
          SCENE=zoryq-games-unity/Assets/ZORYQ/RushCity/Editor/RushCitySceneBuilder.cs
          for marker in RushCityQualityManager RushCityTelemetry RushCityLiveOpsConfig RushCityRouteDirector RushCityEnvironmentDirector RushCityMissionDirector RushCityGhostRecorder RushCityGhostPlayback RushCityGhostRaceManager RushCityPresentationDirector RushCityAudioDirector RushCityHudPresenter RushCityVfxDirector RushCityChaseDirector; do
            grep -Fq "$marker" "$SCENE"
          done
          grep -Fq 'EngineeringRig' "$SCENE"

      - name: Verify reproducible Unity Android export
        run: |
          BUILD=zoryq-games-unity/Assets/ZORYQ/RushCity/Editor/RushCityCiBuild.cs
          FLOW=.github/workflows/zoryq-rush-city-unity-build.yml
          grep -Fq 'ZORYQ-Rush-City-Vertical-Slice.apk' "$BUILD"
          grep -Fq 'unityLibrary' "$BUILD"
          grep -Fq 'IL2CPP' "$BUILD"
          grep -Fq 'AndroidArchitecture.ARM64' "$BUILD"
          grep -Fq 'game-ci/unity-builder@v5' "$FLOW"
          grep -Fq 'ZORYQ-Rush-City-Unity-' "$FLOW"

      - name: Verify wallet security boundary
        run: |
          BRIDGE=zoryq-games-unity/Assets/ZORYQ/Core/ZoryqPlayBridge.cs
          MOBILE=zoryq-mobile/ZoryqPlayBridge.ts
          NATIVE=zoryq-mobile/with-zoryq-game-bridge.js
          grep -Fq 'client-untrusted' "$BRIDGE"
          grep -Fq 'zoryq.play.run.v1' "$BRIDGE"
          grep -Fq 'zoryq.play.launch.v1' "$MOBILE"
          grep -Fq 'GAME_ENGINE_UNAVAILABLE' "$NATIVE"
          grep -Fq 'zoryq_play_result' "$NATIVE"
          ! grep -R -E 'eth_sendTransaction|personal_sign|eth_signTypedData|Wallet\.createRandom|fromPhrase|mnemonic|privateKey|seedPhrase' zoryq-games-unity/Assets/ZORYQ --include='*.cs'
          echo 'Rush City production source readiness verified.'
