name: ZORYQ Rush City Source Readiness

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'zoryq-games-unity/**'
      - 'zoryq-mobile/ZoryqPlayBridge.ts'
      - 'zoryq-mobile/with-zoryq-game-bridge.js'
      - '.github/workflows/zoryq-rush-city-readiness.yml'
      - '.github/workflows/zoryq-rush-city-unity-build.yml'

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Unity production structure
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity
          test -f zoryq-games-unity/ProjectSettings/ProjectVersion.txt
          grep -Fq '6000.3.15f1' zoryq-games-unity/ProjectSettings/ProjectVersion.txt
          test -f zoryq-games-unity/Assets/ZORYQ/Core/ZoryqPlayBridge.cs
          for f in IRushCityReusable RushCityTrackSegmentRuntime RushCityGameManager RushCityPlayerController RushCityCharacterAnimator RushCityTrackManager RushCityCameraController RushCityProceduralCity RushCityQualityManager RushCityMissionDirector RushCityPowerUp RushCityTelemetry RushCityChaseDirector RushCityNearMissZone RushCityGhostRecorder RushCityGhostPlayback RushCityGhostRaceManager RushCityLiveOpsConfig RushCityRunModeDirector RushCityProgression RushCityRouteDirector RushCityRouteChoiceZone RushCityGameEvents RushCityPresentationDirector RushCityAudioDirector RushCityHudPresenter RushCityResultPresenter RushCityVfxDirector RushCityEnvironmentDirector RushCityWorldEventDirector RushCityWorldEventGameplay RushCityWorldEventHazard; do
            test -f "$ROOT/Scripts/$f.cs"
          done
          test -f $ROOT/Editor/RushCitySceneBuilder.cs
          test -f $ROOT/Editor/RushCityCiBuild.cs

      - name: Verify responsive movement physics and branching routes
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity/Scripts
          PLAYER=$ROOT/RushCityPlayerController.cs
          TRACK=$ROOT/RushCityTrackManager.cs
          ROUTE=$ROOT/RushCityRouteDirector.cs
          grep -Fq 'wallProbeDistance = 1.75f' "$PLAYER"
          grep -Fq 'coyoteTime = .105f' "$PLAYER"
          grep -Fq 'jumpBufferTime = .12f' "$PLAYER"
          grep -Fq 'ResolveJumpBuffer' "$PLAYER"
          grep -Fq 'CharacterController' "$PLAYER"
          grep -Fq 'WallRun()' "$PLAYER"
          grep -Fq 'RushCityRouteDirector.Instance.CurrentCenterX' "$PLAYER"
          grep -Fq '"Road"' "$TRACK"
          grep -Fq '_road, true' "$TRACK"
          grep -Fq 'ShiftFutureSegments' "$TRACK"
          grep -Fq 'BranchDeck' "$TRACK"
          grep -Fq 'RushCityRouteChoiceZone' "$TRACK"
          grep -Fq 'RushCityRunModeDirector.Instance' "$TRACK"
          grep -Fq 'CurrentCenterX' "$ROUTE"
          grep -Fq 'ChooseBranch' "$ROUTE"
          grep -Fq 'RushDistrict' "$ROUTE"

      - name: Verify pooled runtime and district identity
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity/Scripts
          TRACK=$ROOT/RushCityTrackManager.cs
          SEGMENT=$ROOT/RushCityTrackSegmentRuntime.cs
          CITY=$ROOT/RushCityProceduralCity.cs
          grep -Fq 'prewarmSegments = 30' "$TRACK"
          grep -Fq '_reserveSegments' "$TRACK"
          grep -Fq 'ActivateSegment' "$TRACK"
          grep -Fq 'RushCityTrackSegmentRuntime' "$TRACK"
          ! grep -Fq 'Destroy(old)' "$TRACK"
          grep -Fq 'IRushCityReusable' "$SEGMENT"
          grep -Fq 'ResetForReuse' "$SEGMENT"
          for marker in HarborStack SkyTower MetroBlock NeoTower; do grep -Fq "$marker" "$CITY"; done
          grep -Fq '_harborDark' "$CITY"
          grep -Fq '_skyDark' "$CITY"
          grep -Fq '_metroDark' "$CITY"

      - name: Verify premium gameplay systems
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity/Scripts
          GAME=$ROOT/RushCityGameManager.cs
          TRACK=$ROOT/RushCityTrackManager.cs
          QUALITY=$ROOT/RushCityQualityManager.cs
          MISSION=$ROOT/RushCityMissionDirector.cs
          POWER=$ROOT/RushCityPowerUp.cs
          GHOST=$ROOT/RushCityGhostRecorder.cs
          PLAYBACK=$ROOT/RushCityGhostPlayback.cs
          GHOSTMGR=$ROOT/RushCityGhostRaceManager.cs
          LIVEOPS=$ROOT/RushCityLiveOpsConfig.cs
          MODE=$ROOT/RushCityRunModeDirector.cs
          PROGRESSION=$ROOT/RushCityProgression.cs
          grep -Fq 'SkillFlow' "$GAME"
          grep -Fq 'RegisterNearMiss' "$GAME"
          grep -Fq 'ActivatePowerUp' "$GAME"
          grep -Fq 'RegisterRouteChoice' "$GAME"
          grep -Fq 'RushCityLiveOpsConfig.Instance' "$GAME"
          grep -Fq 'ZqDensity' "$TRACK"
          grep -Fq 'zqDensityMultiplier' "$TRACK"
          grep -Fq 'TargetFps' "$QUALITY"
          grep -Fq '120' "$QUALITY"
          grep -Fq 'RushMissionType' "$MISSION"
          grep -Fq 'NearMiss' "$MISSION"
          for p in Magnet Shield Overdrive Multiplier; do grep -Fq "$p" "$POWER"; done
          grep -Fq 'zoryq.rush.ghost.v1' "$GHOST"
          grep -Fq 'sampleInterval' "$GHOST"
          grep -Fq 'LoadJson' "$PLAYBACK"
          grep -Fq 'ghostRaceEnabled' "$GHOSTMGR"
          grep -Fq 'zoryq.rush.liveops.v1' "$LIVEOPS"
          grep -Fq 'worldEventsEnabled' "$LIVEOPS"
          grep -Fq 'worldEventRewardMultiplier' "$LIVEOPS"
          grep -Fq 'RushRunMode.Daily' "$MODE"
          grep -Fq 'DateTime.UtcNow.ToString("yyyy-MM-dd")' "$MODE"
          grep -Fq 'StableHash' "$MODE"
          grep -Fq 'client-untrusted' "$MODE"
          grep -Fq 'zoryq.rush.progress.v1' "$PROGRESSION"
          grep -Fq 'RequiredXp' "$PROGRESSION"
          grep -Fq 'worldEventsCompleted' "$PROGRESSION"

      - name: Verify world events affect gameplay safely
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity/Scripts
          EVENT=$ROOT/RushCityWorldEventDirector.cs
          HAZARDS=$ROOT/RushCityWorldEventGameplay.cs
          HAZARD=$ROOT/RushCityWorldEventHazard.cs
          GAME=$ROOT/RushCityGameManager.cs
          EVENTS=$ROOT/RushCityGameEvents.cs
          TELEMETRY=$ROOT/RushCityTelemetry.cs
          for marker in DroneGauntlet HyperTrain StormRush; do grep -Fq "$marker" "$EVENT"; done
          grep -Fq 'SpeedMultiplier' "$EVENT"
          grep -Fq 'ChaseMultiplier' "$EVENT"
          grep -Fq 'ScoreMultiplier' "$EVENT"
          grep -Fq 'GrantWorldEventReward' "$GAME"
          grep -Fq 'WorldEventChanged' "$EVENTS"
          grep -Fq 'WorldEventRewarded' "$EVENTS"
          grep -Fq 'safeLane' "$HAZARDS"
          grep -Fq 'if(lane==safeLane)continue' "$HAZARDS"
          grep -Fq 'HyperTrain_Crossing' "$HAZARDS"
          grep -Fq 'StormStrike_Warning' "$HAZARDS"
          grep -Fq 'armDelay' "$HAZARD"
          grep -Fq '_collider.enabled=false' "$HAZARD"
          grep -Fq 'WorldEventStarted' "$TELEMETRY"
          grep -Fq 'WorldEventCompleted' "$TELEMETRY"

      - name: Verify presentation game feel character and results
        run: |
          ROOT=zoryq-games-unity/Assets/ZORYQ/RushCity/Scripts
          CAMERA=$ROOT/RushCityCameraController.cs
          PRESENT=$ROOT/RushCityPresentationDirector.cs
          AUDIO=$ROOT/RushCityAudioDirector.cs
          HUD=$ROOT/RushCityHudPresenter.cs
          RESULT=$ROOT/RushCityResultPresenter.cs
          VFX=$ROOT/RushCityVfxDirector.cs
          ENV=$ROOT/RushCityEnvironmentDirector.cs
          CHARACTER=$ROOT/RushCityCharacterAnimator.cs
          GAME=$ROOT/RushCityGameManager.cs
          grep -Fq 'Impulse' "$CAMERA"
          grep -Fq 'FovKick' "$CAMERA"
          grep -Fq 'RollKick' "$CAMERA"
          grep -Fq 'RushCityGameEvents' "$PRESENT"
          grep -Fq 'Handheld.Vibrate' "$PRESENT"
          grep -Fq 'windLoop' "$AUDIO"
          grep -Fq 'chaseLoop' "$AUDIO"
          grep -Fq 'WorldEventChanged' "$AUDIO"
          grep -Fq 'CanvasScaler' "$HUD"
          grep -Fq 'ChaseBar' "$HUD"
          grep -Fq 'FlowBar' "$HUD"
          grep -Fq 'EventBar' "$HUD"
          grep -Fq 'RushCityProgression.Instance' "$HUD"
          grep -Fq 'RushCityRunModeDirector.Instance' "$HUD"
          grep -Fq 'RUN COMPLETE' "$RESULT"
          grep -Fq 'RETURNING TO ZORYQ PLAY' "$RESULT"
          grep -Fq 'RushCityGameEvents.RunEnded' "$RESULT"
          grep -Fq 'resultScreenSeconds' "$GAME"
          grep -Fq 'WaitForSecondsRealtime' "$GAME"
          grep -Fq 'ParticleSystem' "$VFX"
          grep -Fq 'WorldEventChanged' "$VFX"
          grep -Fq 'StormActive' "$ENV"
          grep -Fq 'RenderSettings.fogColor' "$ENV"
          for marker in Speed VerticalVelocity Grounded Slide WallRun WallSide Boost Hit RouteTurn; do grep -Fq "$marker" "$CHARACTER"; done
          grep -Fq 'runtimeAnimatorController' "$CHARACTER"
          grep -Fq 'ApplyFallback' "$CHARACTER"

      - name: Verify scene assembles production systems
        run: |
          SCENE=zoryq-games-unity/Assets/ZORYQ/RushCity/Editor/RushCitySceneBuilder.cs
          for marker in RushCityQualityManager RushCityTelemetry RushCityLiveOpsConfig RushCityRunModeDirector RushCityProgression RushCityRouteDirector RushCityEnvironmentDirector RushCityMissionDirector RushCityGhostRecorder RushCityGhostPlayback RushCityGhostRaceManager RushCityPresentationDirector RushCityAudioDirector RushCityHudPresenter RushCityResultPresenter RushCityVfxDirector RushCityChaseDirector RushCityWorldEventDirector RushCityWorldEventGameplay RushCityCharacterAnimator; do
            grep -Fq "$marker" "$SCENE"
          done
          grep -Fq 'Runner_GameplayRoot' "$SCENE"
          grep -Fq 'RunnerVisual_Placeholder' "$SCENE"
          ! grep -Fq 'Runner_EngineeringRig' "$SCENE"

      - name: Verify reproducible Unity Android export
        run: |
          BUILD=zoryq-games-unity/Assets/ZORYQ/RushCity/Editor/RushCityCiBuild.cs
          FLOW=.github/workflows/zoryq-rush-city-unity-build.yml
          grep -Fq 'ZORYQ-Rush-City-Vertical-Slice.apk' "$BUILD"
          grep -Fq 'unityLibrary' "$BUILD"
          grep -Fq 'IL2CPP' "$BUILD"
          grep -Fq 'AndroidArchitecture.ARM64' "$BUILD"
          grep -Fq 'game-ci/unity-builder@v5' "$FLOW"
          grep -Fq 'ZORYQ-Rush-City-Unity-' "$FLOW"

      - name: Verify wallet security boundary
        run: |
          BRIDGE=zoryq-games-unity/Assets/ZORYQ/Core/ZoryqPlayBridge.cs
          MOBILE=zoryq-mobile/ZoryqPlayBridge.ts
          NATIVE=zoryq-mobile/with-zoryq-game-bridge.js
          grep -Fq 'client-untrusted' "$BRIDGE"
          grep -Fq 'zoryq.play.run.v1' "$BRIDGE"
          grep -Fq 'zoryq.play.launch.v1' "$MOBILE"
          grep -Fq "mode:gameId==='rush-city'" "$MOBILE"
          grep -Fq 'GAME_ENGINE_UNAVAILABLE' "$NATIVE"
          grep -Fq 'zoryq_play_result' "$NATIVE"
          ! grep -R -E 'eth_sendTransaction|personal_sign|eth_signTypedData|Wallet\.createRandom|fromPhrase|mnemonic|privateKey|seedPhrase' zoryq-games-unity/Assets/ZORYQ --include='*.cs'
          echo 'Rush City production source readiness verified.'
