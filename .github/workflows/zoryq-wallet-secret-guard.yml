name: ZORYQ Wallet Secret Guard

on:
  pull_request:
  push:
    branches: [zoryq-evm-testnet-node]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed secret-bearing filenames
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|p12|pfx|jks|keystore|key|secret|secrets|jwt)$|jwt\.hex$|.*(mnemonic|seed[-_]?phrase|private[-_]?key).*)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden secret-bearing files are tracked:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Fail on private-key, mnemonic and seed material patterns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, sys
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          files=[f for f in files if f and not f.endswith(('.png','.jpg','.jpeg','.webp','.gif','.zip','.tgz','.apk','.pdf'))]
          patterns=[
            re.compile(r'-----BEGIN (?:EC |RSA |OPENSSH )?PRIVATE KEY-----'),
            re.compile(r'(?i)(?:private[_ -]?key|wallet[_ -]?key|seed[_ -]?phrase|mnemonic)\s*[:=]\s*["\']?0x[0-9a-f]{64}["\']?'),
            re.compile(r'(?i)(?:private[_ -]?key|wallet[_ -]?key)\s*[:=]\s*["\']?[0-9a-f]{64}["\']?'),
          ]
          findings=[]
          for f in files:
            try: data=open(f,'r',encoding='utf-8',errors='ignore').read()
            except OSError: continue
            for p in patterns:
              if p.search(data): findings.append((f,p.pattern))
          if findings:
            print('Potential wallet secret material detected:', file=sys.stderr)
            for f,p in findings: print(f' - {f}: matched protected secret pattern', file=sys.stderr)
            sys.exit(1)
          print('No protected private-key/seed patterns detected in tracked text files.')
          PY

      - name: Enforce treasury address is public-only data
        shell: bash
        run: |
          set -euo pipefail
          TREASURY='0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33'
          echo "Treasury address may be public: $TREASURY"
          echo 'This gate intentionally permits the public address but never private signing material.'
