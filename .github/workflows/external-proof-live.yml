name: ZORYQ External Proof Live

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/external-proof/**'
      - '.github/workflows/external-proof-live.yml'

permissions:
  contents: read

jobs:
  public-first-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install proof runner
        working-directory: tools/external-proof
        run: npm install --no-audit --no-fund

      - name: Run fresh-wallet public proof
        working-directory: tools/external-proof
        run: npm run prove | tee /tmp/zoryq-external-proof.json

      - name: Validate evidence shape
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/zoryq-external-proof.json','utf8');
          const start = text.indexOf('{');
          if (start < 0) throw new Error('json evidence not found');
          const e = JSON.parse(text.slice(start));
          if (e.chainId !== 5919065) throw new Error('chain id mismatch');
          if (!e.faucetRequest?.ok || !e.faucetRequest?.txHash) throw new Error('faucet evidence missing');
          if (!(BigInt(e.fundedBalanceWei || 0) > 0n)) throw new Error('funded balance missing');
          if (!e.signedTransaction?.hash) throw new Error('signed tx missing');
          if (!e.receipt?.transactionHash || e.receipt?.status !== 1) throw new Error('successful receipt missing');
          console.log(JSON.stringify({ok:true,chainId:e.chainId,wallet:e.freshWalletAddress,faucetTx:e.faucetRequest.txHash,tx:e.receipt.transactionHash,block:e.receipt.blockNumber,status:e.receipt.status}, null, 2));
          NODE

      - name: Upload non-secret public-path evidence
        uses: actions/upload-artifact@v4
        with:
          name: zoryq-external-proof-live
          path: /tmp/zoryq-external-proof.json
          if-no-files-found: error
