name: Build ZORYQ Mobile Node APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-node-apk
    paths:
      - 'zoryq-mobile-node/android/**'
      - '.github/workflows/zoryq-mobile-node-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable testnet APK
        working-directory: zoryq-mobile-node/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare official artifact and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp zoryq-mobile-node/android/app/build/outputs/apk/debug/app-debug.apk dist/ZORYQ-Mobile-Node-Testnet.apk
          sha256sum dist/ZORYQ-Mobile-Node-Testnet.apk | tee dist/ZORYQ-Mobile-Node-Testnet.apk.sha256
          printf '{\n  "version": "0.1.0-testnet",\n  "commit": "%s",\n  "chainId": 5919065,\n  "validator": false,\n  "build": "debug-signed-testnet"\n}\n' "$GITHUB_SHA" > dist/mobile-node-release.json

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Mobile-Node-Testnet
          path: dist/
          if-no-files-found: error

      - name: Publish rolling testnet release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="mobile-node-testnet-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            dist/ZORYQ-Mobile-Node-Testnet.apk \
            dist/ZORYQ-Mobile-Node-Testnet.apk.sha256 \
            dist/mobile-node-release.json \
            --title "ZORYQ Mobile Node — Testnet Beta" \
            --notes "Experimental ZORYQ Mobile Witness Node for chain 5919065. This APK performs light/witness verification and is not a consensus validator. Testnet assets have no monetary value." \
            --prerelease
