name: Build ZORYQ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-games-native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Canonical Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify canonical source tree
        run: |
          set -euo pipefail
          test -f mobile-games-native/settings.gradle.kts
          test -f mobile-games-native/wallet-host/build.gradle.kts
          test -f mobile-games-native/runtime/build.gradle.kts
          test -f mobile-games-native/demo/build.gradle.kts
          test ! -e mobile-games-native/zoryq-src.tgz

      - name: Test Wallet and Games runtime
        working-directory: mobile-games-native
        run: gradle :runtime:testDebugUnitTest :wallet-host:testDebugUnitTest --no-daemon

      - name: Build Wallet and Games APKs
        working-directory: mobile-games-native
        run: gradle :runtime:assembleDebug :demo:assembleDebug :wallet-host:assembleDebug --no-daemon

      - name: Stage installable artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mobile-games-native/wallet-host/build/outputs/apk/debug/wallet-host-debug.apk \
            dist/ZORYQ-Wallet-Testnet-${{ github.run_number }}.apk
          cp mobile-games-native/demo/build/outputs/apk/debug/demo-debug.apk \
            dist/ZORYQ-Games-Testnet-${{ github.run_number }}.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          printf 'commit=%s\nworkflow_run=%s\nsource=mobile-games-native\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD_PROVENANCE.txt

      - name: Upload ZORYQ Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Android-Canonical-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/BUILD_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
