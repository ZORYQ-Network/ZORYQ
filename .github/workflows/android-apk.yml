name: Build ZORYQ Wallet Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, zoryq-wallet-professional]
    paths:
      - 'zoryq-wallet/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zoryq-wallet/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-wallet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: ZORYQ Wallet Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: zoryq-wallet
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK 57 dependencies
        working-directory: zoryq-wallet
        run: npx expo install --fix

      - name: TypeScript check
        working-directory: zoryq-wallet
        run: npm run typecheck

      - name: Expo Doctor
        working-directory: zoryq-wallet
        run: npx expo-doctor@latest

      - name: Generate Android native project
        working-directory: zoryq-wallet
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        working-directory: zoryq-wallet/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Package artifact
        run: |
          mkdir -p dist
          cp zoryq-wallet/android/app/build/outputs/apk/debug/app-debug.apk dist/ZORYQ-Wallet-Testnet-${{ github.run_number }}.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload ZORYQ Wallet APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Wallet-Android-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
