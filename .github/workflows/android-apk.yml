name: Build ZORYQ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zoryq-src.tgz'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract ZORYQ source
        run: |
          mkdir -p appsrc
          tar -xzf zoryq-src.tgz -C appsrc
          test -f appsrc/package.json
          test -f appsrc/app.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK dependencies
        working-directory: appsrc
        run: npx expo install --fix

      - name: TypeScript check
        working-directory: appsrc
        run: npm run typecheck

      - name: Expo Doctor
        working-directory: appsrc
        run: npx expo-doctor@latest

      - name: Generate Android native project
        working-directory: appsrc
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        working-directory: appsrc/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp appsrc/android/app/build/outputs/apk/debug/app-debug.apk dist/ZORYQ-${{ github.run_number }}.apk

      - name: APK checksum
        run: sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload ZORYQ APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Android-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
