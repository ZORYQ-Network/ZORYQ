name: Build ZORYQ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/zoryq-platform-foundation]
    paths:
      - 'source/zoryq15k/**'
      - 'tsconfig.json'
      - 'overrides/app.json'
      - 'overrides/app/(tabs)/xp.tsx'
      - 'overrides/src/components/ZoryqLogo.tsx'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source/zoryq15k/**'
      - 'tsconfig.json'
      - 'overrides/app.json'
      - 'overrides/app/(tabs)/xp.tsx'
      - 'overrides/src/components/ZoryqLogo.tsx'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g\ -XX:MaxMetaspaceSize=1024m

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct and verify ZORYQ source
        run: |
          set -euo pipefail
          cat source/zoryq15k/part-*.b64 | base64 --decode > /tmp/zoryq-source.tgz
          echo '6c8c584c88490a5296b60fbb2fe072d187dd17d776ffc7fd177f645142a25383  /tmp/zoryq-source.tgz' | sha256sum -c -
          mkdir -p appsrc
          tar -xzf /tmp/zoryq-source.tgz -C appsrc
          cp tsconfig.json appsrc/tsconfig.json
          cp overrides/app.json appsrc/app.json
          mkdir -p 'appsrc/app/(tabs)' appsrc/src/components
          cp 'overrides/app/(tabs)/xp.tsx' 'appsrc/app/(tabs)/xp.tsx'
          cp overrides/src/components/ZoryqLogo.tsx appsrc/src/components/ZoryqLogo.tsx
          test -f appsrc/package.json
          test -f appsrc/app.json
          grep -q '"name": "ZORYQ"' appsrc/app.json
          grep -q 'app.zoryq.mobile' appsrc/app.json
          ! grep -RIn --exclude='*.png' --exclude='*.jpg' -E 'ZORIQ|zoriq|KYVO|kyvo' appsrc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK dependencies
        working-directory: appsrc
        run: npx expo install --fix

      - name: TypeScript check
        working-directory: appsrc
        run: npm run typecheck

      - name: Validate Expo config
        working-directory: appsrc
        run: npx expo config --type public > /dev/null

      - name: Generate Android native project
        working-directory: appsrc
        run: npx expo prebuild --platform android --clean

      - name: Harden Gradle for GitHub runner
        working-directory: appsrc/android
        run: |
          printf '\n' >> gradle.properties
          cat >> gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          EOF
          grep -q '^expo.inlineModules.watchedDirectories=\[\]$' gradle.properties
          grep -q '^org.gradle.daemon=false$' gradle.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        id: gradle_build
        working-directory: appsrc/android
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ../../gradle-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect Gradle diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cp gradle-build.log diagnostics/gradle-build.log || true
          cp appsrc/package.json diagnostics/package.json || true
          cp appsrc/android/gradle.properties diagnostics/android-gradle.properties || true
          cp appsrc/android/build.gradle diagnostics/android-build.gradle || true
          cp appsrc/android/settings.gradle diagnostics/android-settings.gradle || true
          cp appsrc/android/app/build.gradle diagnostics/android-app-build.gradle || true
          cp appsrc/android/gradle/wrapper/gradle-wrapper.properties diagnostics/gradle-wrapper.properties || true

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Gradle-Logs-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Gradle build failed
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          echo "Gradle build failed with exit code ${{ steps.gradle_build.outputs.exit_code }}"
          exit 1

      - name: Verify generated APK
        run: |
          set -euo pipefail
          test -s appsrc/android/app/build/outputs/apk/debug/app-debug.apk
          file appsrc/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          mkdir -p dist
          cp appsrc/android/app/build/outputs/apk/debug/app-debug.apk dist/ZORYQ-${{ github.run_number }}.apk

      - name: APK checksum
        run: sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload ZORYQ APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Android-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
