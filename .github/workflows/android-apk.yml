name: Build ZORYQ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/zoryq-platform-foundation]
    paths:
      - 'source/zoryq15k/**'
      - 'tsconfig.json'
      - 'overrides/app.json'
      - 'overrides/app/(tabs)/xp.tsx'
      - 'overrides/src/components/ZoryqLogo.tsx'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source/zoryq15k/**'
      - 'tsconfig.json'
      - 'overrides/app.json'
      - 'overrides/app/(tabs)/xp.tsx'
      - 'overrides/src/components/ZoryqLogo.tsx'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct and verify ZORYQ source
        run: |
          set -euo pipefail
          cat source/zoryq15k/part-*.b64 | base64 --decode > /tmp/zoryq-source.tgz
          echo '6c8c584c88490a5296b60fbb2fe072d187dd17d776ffc7fd177f645142a25383  /tmp/zoryq-source.tgz' | sha256sum -c -
          mkdir -p appsrc
          tar -xzf /tmp/zoryq-source.tgz -C appsrc
          cp tsconfig.json appsrc/tsconfig.json
          cp overrides/app.json appsrc/app.json
          mkdir -p 'appsrc/app/(tabs)' appsrc/src/components
          cp 'overrides/app/(tabs)/xp.tsx' 'appsrc/app/(tabs)/xp.tsx'
          cp overrides/src/components/ZoryqLogo.tsx appsrc/src/components/ZoryqLogo.tsx
          test -f appsrc/package.json
          test -f appsrc/app.json
          grep -q '"name": "ZORYQ"' appsrc/app.json
          grep -q 'app.zoryq.mobile' appsrc/app.json
          ! grep -RIn --exclude='*.png' --exclude='*.jpg' -E 'ZORIQ|zoriq|KYVO|kyvo' appsrc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK dependencies
        working-directory: appsrc
        run: npx expo install --fix

      - name: TypeScript check
        working-directory: appsrc
        run: npm run typecheck

      - name: Validate Expo config
        working-directory: appsrc
        run: npx expo config --type public > /dev/null

      - name: Generate Android native project
        working-directory: appsrc
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        working-directory: appsrc/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp appsrc/android/app/build/outputs/apk/debug/app-debug.apk dist/ZORYQ-${{ github.run_number }}.apk

      - name: APK checksum
        run: sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload ZORYQ APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Android-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
