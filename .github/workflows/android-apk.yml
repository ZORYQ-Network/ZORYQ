name: Build ZORIQ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/zoriq-platform-foundation]
    paths:
      - 'source/zoriq20/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source/zoriq20/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoriq-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct and verify ZORIQ source
        run: |
          set -euo pipefail
          cat source/zoriq20/part-*.b64 | base64 --decode > /tmp/zoriq-source.tgz
          echo 'ad8bdc4486c863b279367845ea26f5412734c02a80a326544f2a50725c1a5973  /tmp/zoriq-source.tgz' | sha256sum -c -
          mkdir -p appsrc
          tar -xzf /tmp/zoriq-source.tgz -C appsrc
          test -f appsrc/package.json
          test -f appsrc/app.json
          grep -q '"name": "ZORIQ"' appsrc/app.json
          grep -q 'app.zoriq.mobile' appsrc/app.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK dependencies
        working-directory: appsrc
        run: npx expo install --fix

      - name: TypeScript check
        working-directory: appsrc
        run: npm run typecheck

      - name: Expo Doctor
        working-directory: appsrc
        run: npx expo-doctor@latest

      - name: Generate Android native project
        working-directory: appsrc
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        working-directory: appsrc/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp appsrc/android/app/build/outputs/apk/debug/app-debug.apk dist/ZORIQ-${{ github.run_number }}.apk

      - name: APK checksum
        run: sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload ZORIQ APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORIQ-Android-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
