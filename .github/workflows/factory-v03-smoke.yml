name: ZORYQ Factory v0.3 Smoke

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'zoryq-evm-node/factory-compiler.mjs'
      - 'zoryq-evm-node/factory-compiler.test.mjs'
      - 'zoryq-evm-node/factory-cloud.mjs'
      - 'zoryq-evm-node/factory-cloud.test.mjs'
      - 'zoryq-evm-node/factory-cloud-preload.mjs'
      - 'zoryq-evm-node/server-with-factory.mjs'
      - 'tools/factory-apk-worker/**'
      - '.github/workflows/factory-v03-smoke.yml'
  push:
    branches:
      - zoryq-evm-testnet-node
    paths:
      - 'Dockerfile'
      - 'zoryq-evm-node/factory-compiler.mjs'
      - 'zoryq-evm-node/factory-cloud.mjs'
      - 'zoryq-evm-node/factory-cloud-preload.mjs'
      - 'zoryq-evm-node/server-with-factory.mjs'
      - 'tools/factory-apk-worker/**'
      - '.github/workflows/factory-v03-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check zoryq-evm-node/factory-compiler.mjs
          node --check zoryq-evm-node/factory-cloud.mjs
          node --check zoryq-evm-node/factory-cloud-preload.mjs
          node --check zoryq-evm-node/server-with-factory.mjs
          node --check tools/factory-apk-worker/build-next.mjs
      - name: Verify production image wiring
        run: |
          set -euo pipefail
          grep -Fq 'COPY zoryq-evm-node/factory-compiler.mjs ./factory-compiler.mjs' Dockerfile
          grep -Fq 'COPY zoryq-evm-node/factory-cloud.mjs ./factory-cloud.mjs' Dockerfile
          grep -Fq 'COPY zoryq-evm-node/factory-cloud-preload.mjs ./factory-cloud-preload.mjs' Dockerfile
          grep -Fq 'COPY zoryq-evm-node/server-with-factory.mjs ./server.mjs' Dockerfile
          grep -Fq 'test -f /app/factory-compiler.mjs' Dockerfile
      - name: Generalized compiler tests
        run: node --test zoryq-evm-node/factory-compiler.test.mjs
      - name: Durable cloud and APK queue tests
        run: node --test zoryq-evm-node/factory-cloud.test.mjs
