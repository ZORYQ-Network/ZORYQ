name: ZORYQ Social Production Smoke

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-wallet-backend/**'
      - '.github/workflows/zoryq-social-production-smoke.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Wait for public gateway and verify read-only surfaces
        env:
          BASE: 'https://zoryq-wallet-swap-production.up.railway.app'
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 10 "$BASE/gateway/health" >/tmp/gateway.json && \
               curl -fsS --max-time 10 "$BASE/health" >/tmp/swap.json && \
               curl -fsS --max-time 10 "$BASE/social/health" >/tmp/social.json && \
               curl -fsS --max-time 10 "$BASE/community/health" >/tmp/community.json && \
               curl -fsS --max-time 10 "$BASE/message/health" >/tmp/message.json; then
              break
            fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gateway=JSON.parse(fs.readFileSync('/tmp/gateway.json','utf8'));
          const swap=JSON.parse(fs.readFileSync('/tmp/swap.json','utf8'));
          const social=JSON.parse(fs.readFileSync('/tmp/social.json','utf8'));
          const community=JSON.parse(fs.readFileSync('/tmp/community.json','utf8'));
          const message=JSON.parse(fs.readFileSync('/tmp/message.json','utf8'));
          if(!gateway.ok||gateway.service!=='zoryq-wallet-gateway'||gateway.swapWorker!==true||gateway.mediaUpload!==true||gateway.communityPrefix!=='/community'||gateway.messagePrefix!=='/message')throw Error('gateway_not_ready');
          if(!swap.ok||Number(swap.feeBps)!==25||String(swap.treasury).toLowerCase()!=='0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33')throw Error('swap_surface_regressed');
          if(!social.ok||social.service!=='zoryq-social'||social.version!=='0.3.0'||social.walletAuth!==true||!Array.isArray(social.features)||!social.features.includes('reposts')||!social.features.includes('notifications')||!social.features.includes('image-posts'))throw Error('social_pro_surface_not_ready');
          if(!String(social.persistentPath||'').endsWith('/data/social.json'))throw Error('social_persistence_path_regressed');
          if(!community.ok||community.service!=='zoryq-communities'||community.version!=='0.1.0'||community.walletAuth!==true||!Array.isArray(community.features)||!community.features.includes('channels'))throw Error('community_surface_not_ready');
          if(!message.ok||message.service!=='zoryq-messages'||message.version!=='0.1.0'||message.walletAuth!==true||message.e2e!==false||message.encryption!=='transport-and-access-control')throw Error('message_surface_not_ready');
          console.log(JSON.stringify({gateway,swap:{ok:swap.ok,feeBps:swap.feeBps,treasury:swap.treasury},social:{version:social.version,features:social.features},community:{version:community.version,features:community.features},message:{version:message.version,e2e:message.e2e,encryption:message.encryption}}));
          NODE
      - name: Verify public discovery surfaces and safe auth challenge
        env:
          BASE: 'https://zoryq-wallet-swap-production.up.railway.app'
          DISPOSABLE_ADDRESS: '0x000000000000000000000000000000000000dEaD'
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BASE/social/v1/feed?scope=for-you" >/tmp/feed.json
          curl -fsS --max-time 15 "$BASE/social/v1/explore" >/tmp/explore.json
          curl -fsS --max-time 15 "$BASE/community/v1/communities" >/tmp/communities.json
          curl -fsS --max-time 15 "$BASE/social/v1/auth/challenge?address=$DISPOSABLE_ADDRESS" >/tmp/challenge.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const feed=JSON.parse(fs.readFileSync('/tmp/feed.json','utf8'));
          const explore=JSON.parse(fs.readFileSync('/tmp/explore.json','utf8'));
          const communities=JSON.parse(fs.readFileSync('/tmp/communities.json','utf8'));
          const challenge=JSON.parse(fs.readFileSync('/tmp/challenge.json','utf8'));
          if(!feed.ok||!Array.isArray(feed.items))throw Error('public_feed_invalid');
          if(!explore.ok||!Array.isArray(explore.items)||!Array.isArray(explore.trending)||!Array.isArray(explore.suggestedProfiles))throw Error('public_explore_invalid');
          if(!communities.ok||!Array.isArray(communities.items))throw Error('public_communities_invalid');
          if(!challenge.ok||!String(challenge.message||'').includes('does not authorize a transaction or transfer funds'))throw Error('challenge_safety_copy_missing');
          if(!String(challenge.message).includes('ZORYQ Social Sign-In'))throw Error('challenge_domain_missing');
          console.log(JSON.stringify({ok:true,feedItems:feed.items.length,exploreItems:explore.items.length,communities:communities.items.length,challengeSafe:true}));
          NODE
