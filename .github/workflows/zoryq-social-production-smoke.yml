name: ZORYQ Social Production Smoke

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-wallet-backend/**'
      - '.github/workflows/zoryq-social-production-smoke.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Wait for public gateway and verify read-only surfaces
        env:
          BASE: 'https://zoryq-wallet-swap-production.up.railway.app'
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 10 "$BASE/gateway/health" >/tmp/gateway.json && \
               curl -fsS --max-time 10 "$BASE/health" >/tmp/swap.json && \
               curl -fsS --max-time 10 "$BASE/social/health" >/tmp/social.json; then
              break
            fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gateway=JSON.parse(fs.readFileSync('/tmp/gateway.json','utf8'));
          const swap=JSON.parse(fs.readFileSync('/tmp/swap.json','utf8'));
          const social=JSON.parse(fs.readFileSync('/tmp/social.json','utf8'));
          if(!gateway.ok||gateway.service!=='zoryq-wallet-gateway'||gateway.swapWorker!==true)throw Error('gateway_not_ready');
          if(!swap.ok||Number(swap.feeBps)!==25||String(swap.treasury).toLowerCase()!=='0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33')throw Error('swap_surface_regressed');
          if(!social.ok||social.service!=='zoryq-social'||social.walletAuth!==true||!String(social.persistentPath||'').endsWith('/data/social.json'))throw Error('social_surface_not_ready');
          console.log(JSON.stringify({gateway,swap:{ok:swap.ok,feeBps:swap.feeBps,treasury:swap.treasury},social}));
          NODE
      - name: Verify public feed and non-transaction auth challenge
        env:
          BASE: 'https://zoryq-wallet-swap-production.up.railway.app/social'
          DISPOSABLE_ADDRESS: '0x000000000000000000000000000000000000dEaD'
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BASE/v1/feed?scope=for-you" >/tmp/feed.json
          curl -fsS --max-time 15 "$BASE/v1/auth/challenge?address=$DISPOSABLE_ADDRESS" >/tmp/challenge.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const feed=JSON.parse(fs.readFileSync('/tmp/feed.json','utf8'));
          const challenge=JSON.parse(fs.readFileSync('/tmp/challenge.json','utf8'));
          if(!feed.ok||!Array.isArray(feed.items))throw Error('public_feed_invalid');
          if(!challenge.ok||!String(challenge.message||'').includes('does not authorize a transaction or transfer funds'))throw Error('challenge_safety_copy_missing');
          if(!String(challenge.message).includes('ZORYQ Social Sign-In'))throw Error('challenge_domain_missing');
          console.log(JSON.stringify({ok:true,feedItems:feed.items.length,challengeSafe:true}));
          NODE
