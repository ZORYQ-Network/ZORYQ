name: Test ZORYQ Project Intelligence

on:
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-evm-node/project-intelligence.mjs'
      - 'zoryq-evm-node/project-intelligence.test.mjs'
      - 'zoryq-evm-node/project-indexer.mjs'
      - 'zoryq-evm-node/project-indexer.test.mjs'
      - 'zoryq-evm-node/project-rpc-scanner.mjs'
      - 'zoryq-evm-node/project-rpc-scanner.test.mjs'
      - 'zoryq-evm-node/package.json'
      - '.github/workflows/zoryq-project-intelligence.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zoryq-evm-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
