name: Deploy ZORYQ Testnet Contracts

on:
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-contracts/src/ZoryqBootstrap.sol'
      - '.github/workflows/zoryq-deploy-testnet-contracts.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-testnet-contract-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RPC_URL: https://zoryq-evm-node-live-production.up.railway.app/rpc
      FAUCET_URL: https://zoryq-evm-node-live-production.up.railway.app/faucet
      ADMIN: 0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Prepare Foundry project
        working-directory: zoryq-contracts
        run: |
          printf '[profile.default]\nsrc = "src"\ntest = "test"\nout = "out"\nsolc_version = "0.8.24"\n' > foundry.toml

      - name: Build and test contracts
        working-directory: zoryq-contracts
        run: |
          forge build
          forge test -vv

      - name: Create transient funded deployer
        id: deployer
        shell: bash
        run: |
          set -euo pipefail
          PK="0x$(openssl rand -hex 32)"
          ADDR=$(cast wallet address --private-key "$PK")
          echo "address=$ADDR" >> "$GITHUB_OUTPUT"
          echo "private_key=$PK" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error -X POST "$FAUCET_URL" \
            -H 'content-type: application/json' \
            -d "{\"address\":\"$ADDR\"}" > /tmp/faucet.json
          sleep 2
          BAL=$(cast balance "$ADDR" --rpc-url "$RPC_URL")
          test "$BAL" -gt 10000000000000000000
          echo "Transient deployer funded: $ADDR"

      - name: Deploy atomic bootstrap
        id: deploy
        working-directory: zoryq-contracts
        shell: bash
        env:
          DEPLOYER_KEY: ${{ steps.deployer.outputs.private_key }}
        run: |
          set -euo pipefail
          forge create src/ZoryqBootstrap.sol:ZoryqBootstrap \
            --rpc-url "$RPC_URL" \
            --private-key "$DEPLOYER_KEY" \
            --constructor-args "$ADMIN" \
            --value 10000000000000000000 \
            --broadcast --json > /tmp/deploy.json
          cat /tmp/deploy.json | jq 'del(.privateKey, .private_key)'
          BOOTSTRAP=$(jq -r '.deployedTo // .deployed_to // .contractAddress // empty' /tmp/deploy.json)
          TX=$(jq -r '.transactionHash // .transaction_hash // .txHash // empty' /tmp/deploy.json)
          test -n "$BOOTSTRAP"
          echo "bootstrap=$BOOTSTRAP" >> "$GITHUB_OUTPUT"
          echo "tx=$TX" >> "$GITHUB_OUTPUT"

      - name: Verify deployment and create public manifest
        shell: bash
        env:
          BOOTSTRAP: ${{ steps.deploy.outputs.bootstrap }}
          DEPLOY_TX: ${{ steps.deploy.outputs.tx }}
        run: |
          set -euo pipefail
          CID=$(cast chain-id --rpc-url "$RPC_URL")
          test "$CID" = "5919065"
          REWARD=$(cast call "$BOOTSTRAP" 'rewardRegistry()(address)' --rpc-url "$RPC_URL")
          QUEST=$(cast call "$BOOTSTRAP" 'questRegistry()(address)' --rpc-url "$RPC_URL")
          COMPLETION=$(cast call "$BOOTSTRAP" 'questCompletionRegistry()(address)' --rpc-url "$RPC_URL")
          STAKE=$(cast call "$BOOTSTRAP" 'stakeContract()(address)' --rpc-url "$RPC_URL")
          TOKEN=$(cast call "$BOOTSTRAP" 'testToken()(address)' --rpc-url "$RPC_URL")
          SWAP=$(cast call "$BOOTSTRAP" 'swapContract()(address)' --rpc-url "$RPC_URL")

          for A in "$BOOTSTRAP" "$REWARD" "$QUEST" "$COMPLETION" "$STAKE" "$TOKEN" "$SWAP"; do
            CODE=$(cast code "$A" --rpc-url "$RPC_URL")
            test "$CODE" != "0x"
          done

          for A in "$REWARD" "$QUEST" "$COMPLETION" "$TOKEN" "$SWAP"; do
            OWNER=$(cast call "$A" 'owner()(address)' --rpc-url "$RPC_URL")
            test "${OWNER,,}" = "${ADMIN,,}"
          done

          ADMIN_TOKEN=$(cast call "$TOKEN" 'balanceOf(address)(uint256)' "$ADMIN" --rpc-url "$RPC_URL")
          readarray -t RESERVES < <(cast call "$SWAP" 'reserves()(uint256,uint256)' --rpc-url "$RPC_URL")
          ZQ_RESERVE="${RESERVES[0]}"
          TOKEN_RESERVE="${RESERVES[1]}"
          test "$ADMIN_TOKEN" = "900000000000000000000000"
          test "$ZQ_RESERVE" = "10000000000000000000"
          test "$TOKEN_RESERVE" = "100000000000000000000000"

          jq -n \
            --arg chainId "$CID" \
            --arg admin "$ADMIN" \
            --arg bootstrap "$BOOTSTRAP" \
            --arg tx "$DEPLOY_TX" \
            --arg rewardRegistry "$REWARD" \
            --arg questRegistry "$QUEST" \
            --arg questCompletionRegistry "$COMPLETION" \
            --arg stakeContract "$STAKE" \
            --arg testToken "$TOKEN" \
            --arg swapContract "$SWAP" \
            --arg adminTokenBalance "$ADMIN_TOKEN" \
            --arg zqReserve "$ZQ_RESERVE" \
            --arg tokenReserve "$TOKEN_RESERVE" \
            '{chainId:$chainId,admin:$admin,bootstrap:$bootstrap,deploymentTx:$tx,rewardRegistry:$rewardRegistry,questRegistry:$questRegistry,questCompletionRegistry:$questCompletionRegistry,stakeContract:$stakeContract,testToken:$testToken,swapContract:$swapContract,adminTokenBalanceWei:$adminTokenBalance,swapReserves:{zqWei:$zqReserve,zUSDWei:$tokenReserve},verified:true}' \
            | tee zoryq-testnet-deployment.json

      - name: Upload public deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Testnet-Deployment
          path: zoryq-testnet-deployment.json
          if-no-files-found: error
          retention-days: 90
