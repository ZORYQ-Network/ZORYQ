name: Deploy ZORYQ Testnet Contracts

'on':
  workflow_dispatch:
  push:
    branches:
      - zoryq-evm-testnet-node
    paths:
      - zoryq-contracts/scripts/deploy-testnet.sh
      - .github/workflows/zoryq-deploy-testnet-contracts.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Deploy and verify ZORYQ Testnet contracts
        working-directory: zoryq-contracts
        env:
          ADMIN: "0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33"
        run: bash scripts/deploy-testnet.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Testnet-Deployment
          path: zoryq-testnet-deployment.json
          if-no-files-found: error
