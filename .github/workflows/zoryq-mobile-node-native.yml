name: ZORYQ Mobile Node Native

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-mobile-node/android/**'
      - '.github/workflows/zoryq-mobile-node-native.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-mobile-node-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Security and truth gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CHAIN_ID = 5919065L' zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/WitnessService.kt
          grep -q 'AndroidKeyStore' zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/NodeIdentity.kt
          grep -q 'SHA256withECDSA' zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/NodeIdentity.kt
          grep -q 'ResourceGovernor.evaluate' zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/WitnessService.kt
          grep -q 'not server-verified • no XP' zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/WitnessService.kt
          grep -q 'ACTION_PAUSE' zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/WitnessService.kt
          ! grep -R -E '(seed phrase|mnemonic|private[_-]?key[[:space:]]*[:=][[:space:]]*["'"'][0-9a-fA-F]{64})' zoryq-mobile-node/android/app/src/main/java
      - name: Generate Gradle wrapper
        working-directory: zoryq-mobile-node/android
        run: gradle wrapper --gradle-version 8.10.2
      - name: Build debug APK
        working-directory: zoryq-mobile-node/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=$(find zoryq-mobile-node/android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/ZORYQ-Mobile-Node-Native-debug.apk
          sha256sum dist/ZORYQ-Mobile-Node-Native-debug.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Mobile-Node-Native-debug
          path: |
            dist/ZORYQ-Mobile-Node-Native-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
