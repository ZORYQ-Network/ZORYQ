name: ZORYQ Mobile Node Native

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-mobile-node/android/**'
      - '.github/workflows/zoryq-mobile-node-native.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-mobile-node-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Security and truth gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode')
          witness = (root/'WitnessService.kt').read_text()
          identity = (root/'NodeIdentity.kt').read_text()
          checks = {
              'chain-id': 'CHAIN_ID = 5919065L' in witness,
              'android-keystore': 'AndroidKeyStore' in identity,
              'ecdsa-signing': 'SHA256withECDSA' in identity,
              'resource-governor-wired': 'ResourceGovernor.evaluate' in witness,
              'truthful-proof-status': 'not server-verified' in witness and 'no XP' in witness,
              'pause-action': 'ACTION_PAUSE' in witness,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f'{"PASS" if ok else "FAIL"}: {name}')
          source = '\n'.join(p.read_text(errors='ignore') for p in root.glob('*.kt'))
          secret_patterns = {
              'raw-hex-private-key': r'(?i)private[_-]?key\s*[:=]\s*["\']?[0-9a-f]{64}["\']?',
              'seed-phrase-assignment': r'(?i)(mnemonic|seed[_-]?phrase)\s*[:=]\s*["\'][^"\']{16,}["\']',
          }
          for name, pattern in secret_patterns.items():
              if re.search(pattern, source):
                  print(f'FAIL: {name}')
                  failed.append(name)
              else:
                  print(f'PASS: {name}')
          if failed:
              print('Security/truth gate failed: ' + ', '.join(failed), file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Generate Gradle wrapper
        working-directory: zoryq-mobile-node/android
        run: gradle wrapper --gradle-version 8.10.2
      - name: Build debug APK
        working-directory: zoryq-mobile-node/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=$(find zoryq-mobile-node/android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/ZORYQ-Mobile-Node-Native-debug.apk
          sha256sum dist/ZORYQ-Mobile-Node-Native-debug.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Mobile-Node-Native-debug
          path: |
            dist/ZORYQ-Mobile-Node-Native-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
