name: ZORYQ Mainnet Launch Rehearsal Evidence

on:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-mainnet/launch-rehearsal-evidence.mjs'
      - 'zoryq-mainnet/launch-rehearsal-evidence.selftest.mjs'
      - 'zoryq-mainnet/readiness-gate.mjs'
      - 'zoryq-mainnet/readiness-gate.selftest.mjs'
      - '.github/workflows/zoryq-mainnet-launch-rehearsal.yml'
  pull_request:
    paths:
      - 'zoryq-mainnet/launch-rehearsal-evidence.mjs'
      - 'zoryq-mainnet/launch-rehearsal-evidence.selftest.mjs'
      - 'zoryq-mainnet/readiness-gate.mjs'
      - 'zoryq-mainnet/readiness-gate.selftest.mjs'
      - '.github/workflows/zoryq-mainnet-launch-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-rehearsal-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run launch rehearsal adversarial self-test
        run: node zoryq-mainnet/launch-rehearsal-evidence.selftest.mjs
