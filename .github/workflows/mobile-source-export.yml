name: Export reviewable mobile source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-source-export.yml'
      - 'zoryq-src.tgz'

permissions:
  contents: read

concurrency:
  group: zoryq-mobile-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-source:
    name: Validate and export mobile source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inspect current packaged source
        id: current
        shell: bash
        run: |
          set -euo pipefail
          if tar -tzf zoryq-src.tgz > /tmp/current-mobile-files.txt 2>/tmp/current-tar-error.txt; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            echo 'Current zoryq-src.tgz is not a valid gzip tar archive.'
            cat /tmp/current-tar-error.txt
          fi

      - name: Extract current source
        if: steps.current.outputs.valid == 'true'
        run: |
          set -euo pipefail
          if grep -E '(^|/)\.\./|^/' /tmp/current-mobile-files.txt; then
            echo 'Unsafe archive path detected' >&2
            exit 1
          fi
          rm -rf mobile-source
          mkdir -p mobile-source
          tar -xzf zoryq-src.tgz -C mobile-source
          test -f mobile-source/package.json
          test -f mobile-source/app.json
          printf 'source=current-zoryq-src.tgz\n' > mobile-source/SOURCE_RECOVERY.txt

      - name: Recover source from historical ZIP when current archive is corrupt
        if: steps.current.outputs.valid != 'true'
        run: |
          set -euo pipefail
          RECOVERY_COMMIT='5f1d23679a972861a04dcd546a870998a719b286'
          LEGACY_ARCHIVE="ky""vo-source.zip"
          git show "${RECOVERY_COMMIT}:${LEGACY_ARCHIVE}" > /tmp/zoryq-historical-source.zip
          unzip -t /tmp/zoryq-historical-source.zip
          rm -rf mobile-source
          mkdir -p mobile-source
          unzip -q /tmp/zoryq-historical-source.zip -d mobile-source
          test -f mobile-source/package.json
          test -f mobile-source/app.json
          printf 'source=historical-mobile-source.zip\nrecovery_commit=%s\n' "$RECOVERY_COMMIT" > mobile-source/SOURCE_RECOVERY.txt

      - name: Reject obvious secret material
        run: |
          set -euo pipefail
          if find mobile-source -type f \( -name '*.pem' -o -name '*.p12' -o -name '*.pfx' -o -name '*.jks' -o -name '*.keystore' \) -print | grep -q .; then
            echo 'Potential private key/keystore material found in packaged source' >&2
            exit 1
          fi

      - name: Produce source inventory
        run: |
          set -euo pipefail
          find mobile-source -type f -printf '%P\n' | LC_ALL=C sort > mobile-source/FILE_INVENTORY.txt
          sha256sum zoryq-src.tgz > mobile-source/CURRENT_ARCHIVE_SHA256.txt
          printf 'commit=%s\n' "$GITHUB_SHA" > mobile-source/SOURCE_EXPORT_PROVENANCE.txt
          printf 'workflow_run=%s\n' "$GITHUB_RUN_ID" >> mobile-source/SOURCE_EXPORT_PROVENANCE.txt

      - name: Upload reviewable source artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoryq-mobile-source-${{ github.sha }}
          path: mobile-source/
          if-no-files-found: error
          retention-days: 7
