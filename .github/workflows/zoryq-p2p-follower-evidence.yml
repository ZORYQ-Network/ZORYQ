name: ZORYQ P2P Follower Evidence

on:
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - '.github/workflows/zoryq-p2p-follower-evidence.yml'
      - 'zoryq-evm-node/zoryq-reth-genesis.json'
      - 'zoryq-evm-node/engine-block-producer.mjs'
      - 'zoryq-evm-node/engine-forkchoice-follower.mjs'

permissions:
  contents: read

jobs:
  engine-driven-p2p-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build identical ZORYQ Reth image
        run: docker build -t zoryq-p2p-evidence ./zoryq-evm-node

      - name: Prepare isolated network and CI-only Engine JWT
        run: |
          set -euo pipefail
          docker network create zoryq-p2p-test
          docker volume create zoryq-p2p-a-db >/dev/null
          docker volume create zoryq-p2p-b-db >/dev/null
          printf '%s' 'zoryq-ci-engine-api-v3-research-only' | sha256sum | awk '{print $1}' > /tmp/zoryq-engine.jwt
          test "$(wc -c < /tmp/zoryq-engine.jwt)" -eq 65

      - name: Start non-dev P2P-enabled Reth A with authenticated Engine API
        run: |
          set -euo pipefail
          docker run -d --name zoryq-reth-a --network zoryq-p2p-test \
            -p 8545:8545 -p 8551:8551 \
            -v zoryq-p2p-a-db:/data \
            -v /tmp/zoryq-engine.jwt:/jwt.hex:ro \
            zoryq-p2p-evidence \
            reth node \
              --chain /app/zoryq-reth-genesis.json \
              --datadir /data/reth \
              --addr 0.0.0.0 \
              --port 30303 \
              --network-id 5919065 \
              --nat none \
              --http \
              --http.addr 0.0.0.0 \
              --http.port 8545 \
              --http.api eth,net,web3,admin \
              --authrpc.addr 0.0.0.0 \
              --authrpc.port 8551 \
              --authrpc.jwtsecret /jwt.hex
          for i in $(seq 1 120); do
            if curl --max-time 3 -fsS http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              | jq -e '.result == "0x5a5159"' >/dev/null 2>&1; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' zoryq-reth-a 2>/dev/null | grep -qx true; then
              docker logs zoryq-reth-a || true
              exit 1
            fi
            sleep 1
          done
          docker logs zoryq-reth-a || true
          exit 1

      - name: Produce canonical ZORYQ blocks through Engine API V3
        env:
          ENGINE_URL: http://127.0.0.1:8551
          RPC_URL: http://127.0.0.1:8545
          JWT_SECRET_PATH: /tmp/zoryq-engine.jwt
          BLOCK_COUNT: '8'
          EVIDENCE_PATH: zoryq-engine-producer-evidence.json
        run: |
          set -euo pipefail
          node zoryq-evm-node/engine-block-producer.mjs
          jq -e '.status == "ENGINE_API_V3_NON_DEV_CANONICAL_BLOCKS" and .finalCanonicalNumber == 8' zoryq-engine-producer-evidence.json >/dev/null

      - name: Derive Reth A public identity and start non-dev Reth B
        run: |
          set -euo pipefail
          curl --max-time 5 -fsS http://127.0.0.1:8545 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"admin_nodeInfo","params":[]}' \
            | jq -e '.result.enode' > /tmp/nodeinfo.json
          ENODE=$(jq -r '.result.enode' /tmp/nodeinfo.json)
          PUBKEY=$(printf '%s' "$ENODE" | sed -nE 's#^enode://([^@]+)@.*#\1#p')
          test ${#PUBKEY} -eq 128
          A_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' zoryq-reth-a)
          test -n "$A_IP"
          TRUSTED="enode://${PUBKEY}@${A_IP}:30303"
          echo "Reth A public P2P identity validated for isolated CI."

          docker run -d --name zoryq-reth-b --network zoryq-p2p-test \
            -p 8546:8545 -p 8552:8551 \
            -v zoryq-p2p-b-db:/data \
            -v /tmp/zoryq-engine.jwt:/jwt.hex:ro \
            zoryq-p2p-evidence \
            reth node \
              --chain /app/zoryq-reth-genesis.json \
              --datadir /data/reth \
              --addr 0.0.0.0 \
              --port 30303 \
              --network-id 5919065 \
              --nat none \
              --trusted-peers "$TRUSTED" \
              --http \
              --http.addr 0.0.0.0 \
              --http.port 8545 \
              --http.api eth,net,web3 \
              --authrpc.addr 0.0.0.0 \
              --authrpc.port 8551 \
              --authrpc.jwtsecret /jwt.hex
          for i in $(seq 1 120); do
            if curl --max-time 3 -fsS http://127.0.0.1:8546 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              | jq -e '.result == "0x5a5159"' >/dev/null 2>&1; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' zoryq-reth-b 2>/dev/null | grep -qx true; then
              docker logs zoryq-reth-b || true
              exit 1
            fi
            sleep 1
          done
          docker logs zoryq-reth-b || true
          exit 1

      - name: Prove forkchoice-only target is fetched and canonicalized through P2P
        env:
          FOLLOWER_ENGINE_URL: http://127.0.0.1:8552
          FOLLOWER_RPC_URL: http://127.0.0.1:8546
          REFERENCE_RPC_URL: http://127.0.0.1:8545
          JWT_SECRET_PATH: /tmp/zoryq-engine.jwt
          EVIDENCE_PATH: zoryq-p2p-forkchoice-evidence.json
        run: |
          set -euo pipefail
          node zoryq-evm-node/engine-forkchoice-follower.mjs
          jq -e '.status == "FORKCHOICE_ONLY_P2P_CANONICAL_SYNC" and .peerCount > 0 and .payloadInjectedIntoFollowerViaRpc == false and .followerCanonicalHash == .targetHash' zoryq-p2p-forkchoice-evidence.json >/dev/null

      - name: Create combined evidence manifest
        run: |
          set -euo pipefail
          A_PEERS=$(curl --max-time 5 -fsS http://127.0.0.1:8545 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"net_peerCount","params":[]}' | jq -r '.result')
          B_PEERS=$(curl --max-time 5 -fsS http://127.0.0.1:8546 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"net_peerCount","params":[]}' | jq -r '.result')
          TARGET_NUMBER=$(jq -r '.targetNumber' zoryq-p2p-forkchoice-evidence.json)
          TARGET_HASH=$(jq -r '.targetHash' zoryq-p2p-forkchoice-evidence.json)
          PRODUCER_SHA=$(cut -d' ' -f1 zoryq-engine-producer-evidence.json.sha256)
          FOLLOWER_SHA=$(cut -d' ' -f1 zoryq-p2p-forkchoice-evidence.json.sha256)
          test $((A_PEERS)) -gt 0
          test $((B_PEERS)) -gt 0
          cat > zoryq-p2p-follower-evidence.json <<JSON
          {
            "schemaVersion": 2,
            "status": "ENGINE_DRIVEN_P2P_CANONICAL_SYNC",
            "chainId": 5919065,
            "rethMode": "non-dev",
            "engineApi": "V3",
            "producerPeerCount": $((A_PEERS)),
            "followerPeerCount": $((B_PEERS)),
            "canonicalBlock": $TARGET_NUMBER,
            "canonicalHash": "$TARGET_HASH",
            "payloadInjectedIntoFollowerViaRpc": false,
            "engineProducerEvidenceSha256": "$PRODUCER_SHA",
            "p2pFollowerEvidenceSha256": "$FOLLOWER_SHA",
            "claimBoundary": "This isolated CI evidence proves an Engine-API-driven non-dev Reth node can create canonical ZORYQ test blocks and a second non-dev Reth node can establish direct P2P, receive forkchoice information without RPC payload injection, fetch the referenced execution data through P2P, and canonicalize the same chain. It does not prove Internet reachability, an independent external operator, production consensus, decentralization, Byzantine fault tolerance, or mainnet readiness."
          }
          JSON
          jq . zoryq-p2p-follower-evidence.json
          sha256sum zoryq-p2p-follower-evidence.json | tee zoryq-p2p-follower-evidence.sha256

      - name: Capture Reth logs
        if: always()
        run: |
          for c in zoryq-reth-a zoryq-reth-b; do docker logs "$c" > "$c.log" 2>&1 || true; done

      - name: Upload Engine-driven P2P evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoryq-engine-p2p-evidence-${{ github.sha }}
          path: |
            zoryq-engine-producer-evidence.json
            zoryq-engine-producer-evidence.json.sha256
            zoryq-p2p-forkchoice-evidence.json
            zoryq-p2p-forkchoice-evidence.json.sha256
            zoryq-p2p-follower-evidence.json
            zoryq-p2p-follower-evidence.sha256
            zoryq-reth-a.log
            zoryq-reth-b.log
          if-no-files-found: warn
          retention-days: 30
