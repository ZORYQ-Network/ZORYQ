name: Test ZORYQ Contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-contracts/**'
      - 'zoryq-evm-node/deploy-autonomous-economy.mjs'
      - 'zoryq-evm-node/deploy-one-prompt-company.mjs'
      - 'zoryq-evm-node/deploy-autonomous-company-v2.mjs'
      - 'zoryq-evm-node/deploy-autonomous-company-v3.mjs'
      - 'zoryq-evm-node/ai-ceo.mjs'
      - 'zoryq-evm-node/ai-ceo.test.mjs'
      - 'zoryq-evm-node/server.mjs'
      - 'zoryq-evm-node/entrypoint.sh'
      - 'Dockerfile'
      - '.github/workflows/zoryq-contracts.yml'
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-contracts/**'
      - 'zoryq-evm-node/deploy-autonomous-economy.mjs'
      - 'zoryq-evm-node/deploy-one-prompt-company.mjs'
      - 'zoryq-evm-node/deploy-autonomous-company-v2.mjs'
      - 'zoryq-evm-node/deploy-autonomous-company-v3.mjs'
      - 'zoryq-evm-node/ai-ceo.mjs'
      - 'zoryq-evm-node/ai-ceo.test.mjs'
      - 'zoryq-evm-node/server.mjs'
      - 'zoryq-evm-node/entrypoint.sh'
      - 'Dockerfile'
      - '.github/workflows/zoryq-contracts.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate protocol and AI CEO wiring
        run: |
          set -euo pipefail
          sh -n zoryq-evm-node/entrypoint.sh
          node --check zoryq-evm-node/server.mjs
          node --check zoryq-evm-node/ai-ceo.mjs
          node --check zoryq-evm-node/deploy-autonomous-economy.mjs
          node --check zoryq-evm-node/deploy-one-prompt-company.mjs
          node --check zoryq-evm-node/deploy-autonomous-company-v2.mjs
          node --check zoryq-evm-node/deploy-autonomous-company-v3.mjs
          grep -q 'deploy-autonomous-economy.mjs' Dockerfile
          grep -q 'deploy-one-prompt-company.mjs' Dockerfile
          grep -q 'deploy-autonomous-company-v2.mjs' Dockerfile
          grep -q 'deploy-autonomous-company-v3.mjs' Dockerfile
          grep -q 'ai-ceo.mjs' Dockerfile
      - name: Install Node dependencies for planner tests
        working-directory: zoryq-evm-node
        run: npm install --no-audit --no-fund
      - name: Test AI CEO policy mirror
        working-directory: zoryq-evm-node
        run: node --test ai-ceo.test.mjs
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare Foundry project
        working-directory: zoryq-contracts
        run: |
          test -f foundry.toml || printf '[profile.default]\nsrc = "src"\ntest = "test"\nout = "out"\nsolc_version = "0.8.24"\n' > foundry.toml
      - name: Build
        working-directory: zoryq-contracts
        run: forge build
      - name: Test
        working-directory: zoryq-contracts
        run: forge test -vv
      - name: Package protocol creation artifacts
        run: |
          set -euo pipefail
          mkdir -p protocol-build
          cp zoryq-contracts/out/ZoryqDexV1.sol/ZoryqDexV1.json protocol-build/
          cp zoryq-contracts/out/ZoryqLendingLab.sol/ZoryqLendingLab.json protocol-build/
          cp zoryq-contracts/out/ZoryqProjectRegistry.sol/ZoryqProjectRegistry.json protocol-build/
          cp zoryq-contracts/out/ZoryqAutonomousEconomy.sol/ZoryqAutonomousEconomy.json protocol-build/
          cp zoryq-contracts/out/ZoryqOnePromptCompany.sol/ZoryqOnePromptCompany.json protocol-build/
          cp zoryq-contracts/out/ZoryqAutonomousCompanyV2.sol/ZoryqAutonomousCompanyV2.json protocol-build/
          cp zoryq-contracts/out/ZoryqAutonomousCompanyV3.sol/ZoryqAutonomousCompanyV3.json protocol-build/
      - name: Upload protocol build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Protocol-Build
          path: protocol-build/*.json
          if-no-files-found: error
          retention-days: 7
