name: ZORYQ Live Protocol State

on:
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - '.github/workflows/zoryq-live-protocol-state.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: 'https://zoryq-evm-node-live-production.up.railway.app'
      RPC: 'https://zoryq-evm-node-live-production.up.railway.app/rpc'
      TREASURY: '0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33'
      ZUSD: '0xd2121E96C6af936c0496fDB499c1D0613d26c2B9'
    steps:
      - name: Read verified deployment registry
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/admin/control/deployments")"
          echo "$body" | jq .
          echo "$body" | jq -e '.ok == true and .controlProven == true' >/dev/null
          printf '%s' "$body" > /tmp/deployments.json

      - name: Verify every recorded deployment has live code
        shell: bash
        run: |
          set -euo pipefail
          rpc(){ curl --fail --silent --show-error -H 'content-type: application/json' --data "$1" "$RPC"; }
          for key in dexV1 lending projectRegistry; do
            addr="$(jq -r --arg key "$key" '.deployments[$key].address // empty' /tmp/deployments.json)"
            if [ -z "$addr" ]; then echo "$key: not recorded"; continue; fi
            code="$(rpc "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getCode\",\"params\":[\"$addr\",\"latest\"]}" | jq -r '.result')"
            test "$code" != '0x'
            echo "$key=$addr codeBytes=$(( (${#code} - 2) / 2 ))"
          done

      - name: Verify DEX liquidity and executable quotes
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install ethers@6 --no-audit --no-fund >/dev/null 2>&1
          node <<'NODE'
          const {JsonRpcProvider,Contract,formatEther,parseEther}=require('ethers');
          const fs=require('fs');
          const state=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const dex=state.deployments.dexV1?.address;
          if(!dex) throw new Error('dexV1_not_recorded');
          const provider=new JsonRpcProvider(process.env.RPC,5919065,{staticNetwork:true});
          const d=new Contract(dex,[
            'function reserves() view returns(uint256 zqReserve,uint256 tokenReserve)',
            'function active() view returns(bool)',
            'function totalSupply() view returns(uint256)',
            'function quoteZQForToken(uint256) view returns(uint256 amountOut,uint256 lpFee,uint256 protocolFee)',
            'function quoteTokenForZQ(uint256) view returns(uint256 amountOut,uint256 lpFee,uint256 protocolFee)'
          ],provider);
          (async()=>{
            const [r,active,supply,q1,q2]=await Promise.all([
              d.reserves(), d.active(), d.totalSupply(),
              d.quoteZQForToken(parseEther('1')),
              d.quoteTokenForZQ(parseEther('100'))
            ]);
            console.log(`DEX address: ${dex}`);
            console.log(`DEX active: ${active}`);
            console.log(`DEX reserves: ${formatEther(r.zqReserve)} ZQ / ${formatEther(r.tokenReserve)} zUSD`);
            console.log(`DEX LP total supply: ${formatEther(supply)}`);
            console.log(`Quote 1 ZQ -> ${formatEther(q1.amountOut)} zUSD`);
            console.log(`Quote 100 zUSD -> ${formatEther(q2.amountOut)} ZQ`);
            if(!active) throw new Error('dex_not_active');
            if(r.zqReserve<=0n || r.tokenReserve<=0n || supply<=0n) throw new Error('dex_liquidity_missing');
            if(q1.amountOut<=0n || q2.amountOut<=0n) throw new Error('dex_quote_not_executable');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Report Treasury balances
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install ethers@6 --no-audit --no-fund >/dev/null 2>&1
          node <<'NODE'
          const {JsonRpcProvider,Contract,formatEther}=require('ethers');
          const provider=new JsonRpcProvider(process.env.RPC,5919065,{staticNetwork:true});
          const token=new Contract(process.env.ZUSD,['function balanceOf(address) view returns(uint256)'],provider);
          (async()=>{
            const [zq,zusd]=await Promise.all([provider.getBalance(process.env.TREASURY),token.balanceOf(process.env.TREASURY)]);
            console.log(`Treasury balance: ${formatEther(zq)} ZQ`);
            console.log(`Treasury zUSD balance: ${formatEther(zusd)} zUSD`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
