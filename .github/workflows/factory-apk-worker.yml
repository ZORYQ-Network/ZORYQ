name: ZORYQ Factory APK Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zoryq-factory-apk-worker
  cancel-in-progress: false

jobs:
  build-next:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted Factory deployment branch
        uses: actions/checkout@v4
        with:
          ref: zoryq-evm-testnet-node
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35 verification tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Process queued APK builds
        env:
          GH_TOKEN: ${{ github.token }}
          ZORYQ_FACTORY_BASE: https://zoryq-evm-node-live-production.up.railway.app
          ZORYQ_APK_WORKER_MAX: '2'
        run: node tools/factory-apk-worker/build-next.mjs
