name: ZORYQ Factory Dynamic Smoke

on:
  pull_request:
    paths:
      - 'zoryq-web/launch-studio.html'
      - 'zoryq-web/project-launch.html'
      - 'zoryq-evm-node/factory-cloud.mjs'
      - 'zoryq-evm-node/public-gateway.mjs'
      - 'tools/factory-smoke/**'
      - '.github/workflows/factory-dynamic-smoke.yml'
      - '.github/workflows/factory-app-apk.yml'
  push:
    branches:
      - zoryq-evm-testnet-node
    paths:
      - 'zoryq-web/launch-studio.html'
      - 'zoryq-web/project-launch.html'
      - 'zoryq-evm-node/factory-cloud.mjs'
      - 'zoryq-evm-node/public-gateway.mjs'
      - 'tools/factory-smoke/**'
      - '.github/workflows/factory-dynamic-smoke.yml'
      - '.github/workflows/factory-app-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse backend modules
        run: |
          node --check zoryq-evm-node/factory-cloud.mjs
          node --check zoryq-evm-node/public-gateway.mjs
      - name: Verify Factory v0.2 runtime
        run: node tools/factory-smoke/check.mjs
