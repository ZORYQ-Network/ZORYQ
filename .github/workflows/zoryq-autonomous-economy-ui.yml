name: Validate Autonomous Company v3 + AI CEO

on:
  workflow_dispatch:
  pull_request:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-web/proof.html'
      - 'zoryq-contracts/src/ZoryqAutonomousCompanyV3.sol'
      - 'zoryq-evm-node/ai-ceo.mjs'
      - 'zoryq-evm-node/server.mjs'
      - '.github/workflows/zoryq-autonomous-economy-ui.yml'
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-web/proof.html'
      - 'zoryq-contracts/src/ZoryqAutonomousCompanyV3.sol'
      - 'zoryq-evm-node/ai-ceo.mjs'
      - 'zoryq-evm-node/server.mjs'
      - '.github/workflows/zoryq-autonomous-economy-ui.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('zoryq-web/proof.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', html, flags=re.S|re.I)
          if not blocks:
              raise SystemExit('proof.html contains no inline script')
          Path('/tmp/zoryq-proof.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/zoryq-proof.js
      - name: Assert AI CEO UX and testnet boundaries
        run: |
          grep -q 'Autonomous Company V3' zoryq-web/proof.html
          grep -q 'GERAR PLANO COM AI CEO' zoryq-web/proof.html
          grep -q 'REVISAR E APROVAR ON-CHAIN' zoryq-web/proof.html
          grep -q 'AI Marketing' zoryq-web/proof.html
          grep -q 'AI Designer' zoryq-web/proof.html
          grep -q 'AI Research' zoryq-web/proof.html
          grep -q 'AI Developer' zoryq-web/proof.html
          grep -q 'dUSD' zoryq-web/proof.html
          grep -qi 'sem valor monetário\|sem valor monetario' zoryq-web/proof.html
          ! grep -Eqi 'sk-[A-Za-z0-9_-]{20,}' zoryq-web/proof.html
      - name: Verify deployed v3 public boundary after merge
        if: github.event_name == 'push'
        env:
          BASE: https://zoryq-evm-node-live-production.up.railway.app
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base=os.environ['BASE'].rstrip('/')
          def get_json(url):
              last=None
              for _ in range(45):
                  try:
                      with urllib.request.urlopen(url, timeout=15) as r:
                          return json.loads(r.read())
                  except Exception as e:
                      last=e; time.sleep(4)
              raise last
          def get_text(url):
              last=None
              for _ in range(45):
                  try:
                      with urllib.request.urlopen(url, timeout=15) as r:
                          return r.read().decode('utf-8')
                  except Exception as e:
                      last=e; time.sleep(4)
              raise last
          def rpc(method, params=None):
              data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params or []}).encode()
              req=urllib.request.Request(base+'/rpc',data=data,headers={'content-type':'application/json'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  out=json.loads(r.read())
              if out.get('error'): raise RuntimeError(out['error'])
              return out.get('result')
          status=get_json(base+'/ai-ceo/status')
          assert status.get('chainId')==5919065, status
          address=status.get('contractAddress')
          assert isinstance(address,str) and len(address)==42, status
          assert int(status.get('canonicalCompanyId') or 0)>=1, status
          code=rpc('eth_getCode',[address,'latest'])
          assert isinstance(code,str) and code!='0x' and len(code)>10, 'v3 bytecode missing'
          assert rpc('eth_chainId')=='0x5a5159', 'wrong chain id'
          html=get_text(base+'/proof')
          assert 'GERAR PLANO COM AI CEO' in html, 'AI CEO public UI not served'
          payload=json.dumps({'companyId':status['canonicalCompanyId'],'directive':'Crie um plano teste dentro dos limites.'}).encode()
          req=urllib.request.Request(base+'/ai-ceo/plan',data=payload,headers={'content-type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=45) as r:
                  plan=json.loads(r.read())
                  assert plan.get('ok') is True and plan.get('onchainApproval',{}).get('contractAddress')==address, plan
          except urllib.error.HTTPError as e:
              body=json.loads(e.read() or b'{}')
              assert e.code==503 and body.get('error')=='AI_NOT_CONFIGURED', (e.code,body)
          print('Autonomous Company v3 verified: public UI + live contract + AI planning boundary')
          PY
