name: ZORYQ Wallet Revenue Backend

on:
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-wallet-backend/**'
      - '.github/workflows/zoryq-wallet-backend.yml'
  pull_request:
    paths:
      - 'zoryq-wallet-backend/**'
      - '.github/workflows/zoryq-wallet-backend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Syntax check
        run: node --check zoryq-wallet-backend/server.mjs
      - name: Verify treasury fee policy is encoded
        run: |
          set -euo pipefail
          grep -q "chargeFeeBy','currency_in" zoryq-wallet-backend/server.mjs
          grep -q "feeReceiver',TREASURY" zoryq-wallet-backend/server.mjs
          grep -q "isInBps','true" zoryq-wallet-backend/server.mjs
          grep -q "feeAmount',String(FEE_BPS)" zoryq-wallet-backend/server.mjs
          grep -q "KYBER_FEE_NOT_VERIFIED" zoryq-wallet-backend/server.mjs
          grep -q "TREASURY_FEE_POLICY_MISMATCH" zoryq-wallet-backend/server.mjs
      - name: Verify fail-closed without treasury
        run: |
          PORT=18080 node zoryq-wallet-backend/server.mjs >/tmp/wallet-backend.log 2>&1 & PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 20); do curl -s http://127.0.0.1:18080/health >/tmp/h.json && break || sleep 1; done
          jq -e '.ok == false and .treasuryConfigured == false' /tmp/h.json
          kill $PID; wait $PID || true; trap - EXIT
      - name: Verify public Kyber fallback becomes ready with canonical treasury
        run: |
          PORT=18081 ZORYQ_WALLET_TREASURY='0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33' ZORYQ_WALLET_SWAP_FEE_BPS=25 node zoryq-wallet-backend/server.mjs >/tmp/wallet-backend2.log 2>&1 & PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 20); do curl -s http://127.0.0.1:18081/health >/tmp/h2.json && break || sleep 1; done
          jq -e '.ok == true and .feeBps == 25 and .treasuryConfigured == true and .zeroXApiConfigured == false and .kyberPublicConfigured == true and .providerPreference == "kyberswap-public" and .treasury == "0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33"' /tmp/h2.json
          curl -sS -X POST http://127.0.0.1:18081/quote -H 'content-type: application/json' -d '{"chainId":999999,"sellToken":"0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE","buyToken":"0x1111111111111111111111111111111111111111","sellAmount":"1000","taker":"0x2222222222222222222222222222222222222222"}' >/tmp/bad.json
          jq -e '.ok == false and .error == "UNSUPPORTED_CHAIN"' /tmp/bad.json
