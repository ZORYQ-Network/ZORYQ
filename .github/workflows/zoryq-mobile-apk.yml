name: Build ZORIQ Social + ZORYQ Wallet APK

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'zoryq-mobile/**'
      - '.github/workflows/zoryq-mobile-apk.yml'
  push:
    branches: [zoryq-p0-social-financial]
    paths:
      - 'zoryq-mobile/**'
      - '.github/workflows/zoryq-mobile-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: 'production'
      EXPO_PUBLIC_ZORYQ_BASE: 'https://zoryq-evm-node-live-production.up.railway.app'
      EXPO_PUBLIC_ZORYQ_RPC: 'https://zoryq-evm-node-live-production.up.railway.app/rpc'
      EXPO_PUBLIC_ZORYQ_EXPLORER: 'https://zoryq-testnet.vercel.app/explorer.html'
      EXPO_PUBLIC_REWARD_REGISTRY: '0xAB1Dd21c529b182191ED84f00A4dF1917652CB10'
      EXPO_PUBLIC_QUEST_REGISTRY: '0x85747F9BdCd758fcfB562c929236CCA6eEB025a9'
      EXPO_PUBLIC_QUEST_COMPLETION_REGISTRY: '0xD371eb7863cA000fF5039e2Db613F2094ba46b15'
      EXPO_PUBLIC_STAKE_CONTRACT: '0xbB26FaADD1E083C7c0dc0A82Ddb96cC45253Ecb1'
      EXPO_PUBLIC_TEST_TOKEN: '0xd2121E96C6af936c0496fDB499c1D0613d26c2B9'
      EXPO_PUBLIC_SWAP_CONTRACT: '0x8205F34B803eDd79DDCA414F00e12eCdDEdDacbE'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: zoryq-mobile
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        working-directory: zoryq-mobile
        run: npx expo install --fix

      - name: TypeScript check
        working-directory: zoryq-mobile
        run: npm run typecheck

      - name: Generate ZORYQ chain app icon
        run: |
          python -m pip install --quiet pillow
          mkdir -p zoryq-mobile/assets
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          S=1024
          im=Image.new('RGB',(S,S),(5,6,9))
          px=im.load()
          for y in range(S):
              for x in range(S):
                  dx=(x-S/2)/(S/2); dy=(y-S/2)/(S/2)
                  r=min(1,(dx*dx+dy*dy)**0.5)
                  t=(x+y)/(2*S)
                  px[x,y]=(int(5+4*(1-r)),int(7+15*(1-r)),int(15+34*t*(1-r)))
          glow=Image.new('RGBA',(S,S),(0,0,0,0)); gd=ImageDraw.Draw(glow)
          for w,a in [(70,20),(40,45),(18,110)]:
              gd.ellipse((145,330,885,720),outline=(70,30,255,a),width=w)
              gd.arc((115,260,910,790),200,340,fill=(0,230,255,a),width=max(8,w//2))
          glow=glow.filter(ImageFilter.GaussianBlur(10)); im=Image.alpha_composite(im.convert('RGBA'),glow)
          z=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(z)
          poly=[(250,250),(785,250),(665,390),(425,390),(745,390),(430,775),(245,775),(360,635),(530,635),(315,635),(625,250)]
          d.polygon(poly,fill=(65,92,255,255))
          d.line([(250,250),(785,250),(665,390),(425,390)],fill=(73,231,255,255),width=14)
          d.line([(745,390),(430,775),(245,775)],fill=(198,73,255,255),width=14)
          d.polygon([(430,390),(745,390),(430,775),(535,635),(315,635)],fill=(30,46,195,255))
          d.line([(430,390),(745,390),(430,775)],fill=(118,61,255,255),width=12)
          z=z.filter(ImageFilter.GaussianBlur(0.6)); im=Image.alpha_composite(im,z)
          flare=Image.new('RGBA',(S,S),(0,0,0,0)); fd=ImageDraw.Draw(flare)
          cx,cy=820,470
          for rad,a in [(65,20),(35,60),(14,220)]: fd.ellipse((cx-rad,cy-rad,cx+rad,cy+rad),fill=(120,230,255,a))
          fd.line((cx-95,cy,cx+95,cy),fill=(210,245,255,190),width=5); fd.line((cx,cy-95,cx,cy+95),fill=(210,245,255,190),width=5)
          flare=flare.filter(ImageFilter.GaussianBlur(8)); im=Image.alpha_composite(im,flare)
          im.convert('RGB').save('zoryq-mobile/assets/zoryq-icon.png','PNG',optimize=True)
          PY

      - name: Expo doctor
        working-directory: zoryq-mobile
        run: npx expo-doctor@latest

      - name: Generate Android project
        working-directory: zoryq-mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standalone release APK
        working-directory: zoryq-mobile/android
        env:
          NODE_ENV: 'production'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify JS bundle is packaged
        run: |
          APK=$(find zoryq-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'index\.android\.bundle|assets/.*\.bundle' >/dev/null

      - name: Package artifact
        run: |
          mkdir -p dist
          APK=$(find zoryq-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" dist/ZORIQ-Social-ZORYQ-Wallet-${{ github.run_number }}.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZORIQ-Social-ZORYQ-Wallet-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
