name: Build ZORYQ Wallet APK

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-release-candidate-full-product, zoryq-p0-wallet-superapp]
    paths:
      - 'zoryq-mobile/**'
      - '.github/workflows/zoryq-mobile-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: 'production'
      EXPO_PUBLIC_ZORYQ_BASE: 'https://zoryq-evm-node-live-production.up.railway.app'
      EXPO_PUBLIC_ZORYQ_RPC: 'https://zoryq-evm-node-live-production.up.railway.app/rpc'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: zoryq-mobile
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        working-directory: zoryq-mobile
        run: npx expo install --fix

      - name: Generate premium ZORYQ app icon
        run: |
          python -m pip install --quiet pillow
          mkdir -p zoryq-mobile/assets
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          S=1024
          im=Image.new('RGB',(S,S),(4,7,12)); px=im.load()
          for y in range(S):
              for x in range(S):
                  dx=(x-S*.48)/(S*.58); dy=(y-S*.45)/(S*.58); r=min(1,(dx*dx+dy*dy)**.5)
                  px[x,y]=(int(5+12*(1-r)),int(8+14*(1-r)),int(18+38*(1-r)))
          glow=Image.new('RGBA',(S,S),(0,0,0,0)); gd=ImageDraw.Draw(glow)
          gd.ellipse((155,155,870,870),fill=(77,45,255,35)); gd.ellipse((235,235,790,790),fill=(42,218,255,28))
          glow=glow.filter(ImageFilter.GaussianBlur(55)); im=Image.alpha_composite(im.convert('RGBA'),glow)
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((178,178,846,846),radius=196,fill=(9,13,25,235),outline=(86,104,255,170),width=12)
          poly=[(315,295),(720,295),(626,408),(445,408),(666,408),(403,724),(295,724),(395,602),(515,602),(365,602),(610,295)]
          d.polygon(poly,fill=(91,73,255,255))
          d.line([(315,295),(720,295),(626,408),(445,408)],fill=(72,228,255,255),width=18)
          d.line([(666,408),(403,724),(295,724)],fill=(199,92,255,255),width=18)
          d.ellipse((735,250,785,300),fill=(92,239,255,255))
          im.convert('RGB').save('zoryq-mobile/assets/zoryq-icon.png','PNG',optimize=True)
          PY

      - name: TypeScript check
        working-directory: zoryq-mobile
        run: npm run typecheck

      - name: Expo doctor
        working-directory: zoryq-mobile
        run: npx expo-doctor@latest

      - name: Generate Android project
        working-directory: zoryq-mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standalone release APK
        working-directory: zoryq-mobile/android
        env:
          NODE_ENV: 'production'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify SuperApp bundle and identity
        run: |
          APK=$(find zoryq-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'index\.android\.bundle|assets/.*\.bundle' >/dev/null
          grep -q '"version": "1.1.0"' zoryq-mobile/app.json
          grep -q '"versionCode": 3' zoryq-mobile/app.json
          grep -q "type Tab='home'|'send'|'social'|'ranking'|'activity'|'settings'" zoryq-mobile/SuperApp.tsx
          grep -q "community_create" zoryq-mobile/SuperApp.tsx
          grep -q "Pagar perfil" zoryq-mobile/SuperApp.tsx
          grep -q "pendingXp" zoryq-mobile/SuperApp.tsx
          grep -q "pickAvatar" zoryq-mobile/SuperApp.tsx

      - name: Package artifact
        run: |
          mkdir -p dist
          APK=$(find zoryq-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" dist/ZORYQ-Wallet-1.1.0-SuperApp.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Wallet-1.1.0-SuperApp-APK
          path: |
            dist/ZORYQ-Wallet-1.1.0-SuperApp.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
