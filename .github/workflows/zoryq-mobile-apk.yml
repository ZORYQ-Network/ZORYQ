name: Build ZORYQ Super App APK

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node, zoryq-release-candidate-full-product, feat/mobile-node-apk]
    paths:
      - 'zoryq-mobile/**'
      - '.github/workflows/zoryq-mobile-apk.yml'

permissions:
  contents: write

concurrency:
  group: zoryq-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: 'production'
      EXPO_PUBLIC_ZORYQ_BASE: 'https://zoryq-evm-node-live-production.up.railway.app'
      EXPO_PUBLIC_ZORYQ_RPC: 'https://zoryq-evm-node-live-production.up.railway.app/rpc'
      EXPO_PUBLIC_ZORYQ_TREASURY: '0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33'
      EXPO_PUBLIC_ZORYQ_SWAP_BACKEND: 'https://zoryq-wallet-swap-production.up.railway.app'
      EXPO_PUBLIC_ZORYQ_SOCIAL: 'https://zoryq-wallet-swap-production.up.railway.app/social'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        working-directory: zoryq-mobile
        run: npm install --no-audit --no-fund
      - name: Align Expo dependencies
        working-directory: zoryq-mobile
        run: npx expo install --fix
      - name: Generate ZORYQ chain app icon
        run: |
          python -m pip install --quiet pillow
          mkdir -p zoryq-mobile/assets
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          S=1024
          im=Image.new('RGB',(S,S),(5,6,9)); px=im.load()
          for y in range(S):
              for x in range(S):
                  dx=(x-S/2)/(S/2); dy=(y-S/2)/(S/2); r=min(1,(dx*dx+dy*dy)**0.5); t=(x+y)/(2*S)
                  px[x,y]=(int(5+4*(1-r)),int(7+15*(1-r)),int(15+34*t*(1-r)))
          glow=Image.new('RGBA',(S,S),(0,0,0,0)); gd=ImageDraw.Draw(glow)
          for w,a in [(70,20),(40,45),(18,110)]:
              gd.ellipse((145,330,885,720),outline=(70,30,255,a),width=w); gd.arc((115,260,910,790),200,340,fill=(0,230,255,a),width=max(8,w//2))
          glow=glow.filter(ImageFilter.GaussianBlur(10)); im=Image.alpha_composite(im.convert('RGBA'),glow)
          z=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(z); poly=[(250,250),(785,250),(665,390),(425,390),(745,390),(430,775),(245,775),(360,635),(530,635),(315,635),(625,250)]
          d.polygon(poly,fill=(65,92,255,255)); d.line([(250,250),(785,250),(665,390),(425,390)],fill=(73,231,255,255),width=14); d.line([(745,390),(430,775),(245,775)],fill=(198,73,255,255),width=14); d.polygon([(430,390),(745,390),(430,775),(535,635),(315,635)],fill=(30,46,195,255)); d.line([(430,390),(745,390),(430,775)],fill=(118,61,255,255),width=12)
          im=Image.alpha_composite(im,z.filter(ImageFilter.GaussianBlur(0.6))).convert('RGB'); im.save('zoryq-mobile/assets/zoryq-icon.png','PNG',optimize=True)
          PY
      - name: Wallet, Social, Mobile Node and revenue security gate
        run: |
          set -euo pipefail
          grep -q "export {default} from './WalletApp'" zoryq-mobile/App.tsx
          grep -q "UnifiedSocialApp" zoryq-mobile/WalletApp.tsx
          grep -q "CommunitiesApp" zoryq-mobile/WalletApp.tsx
          grep -q "MessagesApp" zoryq-mobile/WalletApp.tsx
          grep -q "MobileNodeApp" zoryq-mobile/WalletApp.tsx
          grep -q "CHAIN_ID=5919065" zoryq-mobile/MobileNodeApp.tsx
          grep -q "nativeMobileNodeAvailable" zoryq-mobile/MobileNodeApp.tsx
          grep -q "startNativeMobileNode" zoryq-mobile/MobileNodeApp.tsx
          grep -q "Heartbeat XP" zoryq-mobile/MobileNodeApp.tsx
          grep -q "não é apresentado como participante do consenso" zoryq-mobile/MobileNodeApp.tsx
          grep -q "withZoryqMobileNode" zoryq-mobile/app.json
          grep -q "MobileDataMeter.kt" zoryq-mobile/plugins/withZoryqMobileNode.js
          grep -q "AndroidKeyStore" zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/NodeIdentity.kt
          grep -q "CHALLENGE_ALREADY_USED" zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/WitnessService.kt
          grep -q "HEARTBEAT_MUST_AWARD_ZERO_XP" zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/WitnessService.kt
          grep -q "dailyMobileDataLimitBytes" zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode/ResourceGovernor.kt
          grep -q "signTypedData" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "5919065" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "/v1/profile/registration-challenge" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "/v1/profile/register" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "/v1/explore" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "/v1/search" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "/v1/notifications" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "/v1/media/image" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "provider.call" zoryq-mobile/UnifiedSocialApp.tsx
          grep -q "requireAuthentication" zoryq-mobile/MainnetWallet.tsx
          grep -q "provider.call" zoryq-mobile/MainnetWallet.tsx
          grep -q "estimateGas" zoryq-mobile/MainnetWallet.tsx
          grep -q "transferFeeBps:0" zoryq-mobile/revenue.ts
          grep -q "hiddenFees:false" zoryq-mobile/revenue.ts
          grep -q "swapFeeBps:25" zoryq-mobile/revenue.ts
          grep -q "0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33" zoryq-mobile/revenue.ts
          grep -q "Quote rejeitado: política da Treasury não confere" zoryq-mobile/SwapEngine.tsx
          grep -q "approve(getAddress(spender),needed)" zoryq-mobile/SwapEngine.tsx
          grep -q "provider.call({...req,from:wallet.address})" zoryq-mobile/SwapEngine.tsx
          grep -q "ZORYQ Social Sign-In" zoryq-wallet-backend/social.mjs
          grep -q "eip712-profile-registration" zoryq-wallet-backend/social.mjs
          grep -q "PROFILE_REGISTRATION_REQUIRED" zoryq-wallet-backend/social.mjs
          grep -q "Ethereum Mainnet" zoryq-mobile/networks.ts
          grep -q "Base" zoryq-mobile/networks.ts
          grep -q "Arbitrum One" zoryq-mobile/networks.ts
          grep -q "BNB Smart Chain" zoryq-mobile/networks.ts
          grep -q "Avalanche C-Chain" zoryq-mobile/networks.ts
          grep -q "Adicionar ERC-20 por contrato" zoryq-mobile/MainnetWallet.tsx
          ! grep -R -E "(sk-[A-Za-z0-9_-]{20,}|private[_-]?key[[:space:]]*[:=][[:space:]]*['\"][0-9a-fA-F]{64})" zoryq-mobile --exclude='MainnetWallet.tsx'
          if grep -R "rpcUrl:'http://" zoryq-mobile/networks.ts; then echo 'insecure builtin RPC' >&2; exit 1; fi
      - name: TypeScript check
        working-directory: zoryq-mobile
        run: npm run typecheck
      - name: Expo doctor
        working-directory: zoryq-mobile
        run: npx expo-doctor@latest
      - name: Generate Android project
        working-directory: zoryq-mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Prove native Mobile Node embedding
        run: |
          set -euo pipefail
          NODE_DIR="zoryq-mobile/android/app/src/main/java/network/zoryq/mobilenode"
          BRIDGE_DIR="zoryq-mobile/android/app/src/main/java/com/zoryq/wallet/mobilenodebridge"
          test -f "$NODE_DIR/WitnessService.kt"
          test -f "$NODE_DIR/NodeIdentity.kt"
          test -f "$NODE_DIR/MobileNodeApi.kt"
          test -f "$NODE_DIR/ResourceGovernor.kt"
          test -f "$NODE_DIR/MobileDataMeter.kt"
          test -f "$NODE_DIR/BootReceiver.kt"
          test -f "$BRIDGE_DIR/ZoryqMobileNodeModule.kt"
          test -f "$BRIDGE_DIR/ZoryqMobileNodePackage.kt"
          grep -q "AndroidKeyStore" "$NODE_DIR/NodeIdentity.kt"
          grep -q "CHAIN_ID = 5919065L" "$NODE_DIR/WitnessService.kt"
          grep -q "HEARTBEAT_MUST_AWARD_ZERO_XP" "$NODE_DIR/WitnessService.kt"
          grep -q "daily mobile data limit reached" "$NODE_DIR/ResourceGovernor.kt"
          grep -q "ZoryqMobileNodePackage" zoryq-mobile/android/app/src/main/java/com/zoryq/wallet/MainApplication.kt
          grep -q "network.zoryq.mobilenode.WitnessService" zoryq-mobile/android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.FOREGROUND_SERVICE_DATA_SYNC" zoryq-mobile/android/app/src/main/AndroidManifest.xml
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone release APK
        working-directory: zoryq-mobile/android
        env:
          NODE_ENV: 'production'
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify packaged super app bundle and identity
        run: |
          APK=$(find zoryq-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'index\.android\.bundle|assets/.*\.bundle' >/dev/null
          grep -q '"name": "ZORYQ"' zoryq-mobile/app.json
          grep -q '"version": "1.5.0"' zoryq-mobile/app.json
          grep -q '"versionCode": 9' zoryq-mobile/app.json
          grep -q '"package": "com.zoryq.wallet"' zoryq-mobile/app.json
      - name: Package artifact
        run: |
          mkdir -p dist
          APK=$(find zoryq-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" dist/ZORYQ-Super-App-1.5.0-Mobile-Node.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Super-App-1.5.0-Mobile-Node-APK
          path: |
            dist/ZORYQ-Super-App-1.5.0-Mobile-Node.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish rolling official testnet APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="zoryq-super-app-testnet-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            dist/ZORYQ-Super-App-1.5.0-Mobile-Node.apk \
            dist/SHA256SUMS.txt \
            --title "ZORYQ Super App 1.5.0 — Mobile Node Testnet Beta" \
            --notes "Official experimental Android build for ZORYQ Testnet. Includes Social, Wallet, Swap and Mobile Witness Node. The Mobile Node verifies network identity and block progress; it is not a consensus validator. Testnet assets have no monetary value." \
            --prerelease
