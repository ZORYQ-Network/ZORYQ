name: Build ZORYQ Wallet APK

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-release-candidate-full-product]
    paths:
      - 'zoryq-mobile/**'
      - '.github/workflows/zoryq-mobile-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: 'production'
      EXPO_PUBLIC_ZORYQ_BASE: 'https://zoryq-evm-node-live-production.up.railway.app'
      EXPO_PUBLIC_ZORYQ_RPC: 'https://zoryq-evm-node-live-production.up.railway.app/rpc'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: zoryq-mobile
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        working-directory: zoryq-mobile
        run: npx expo install --fix

      - name: TypeScript check
        working-directory: zoryq-mobile
        run: npm run typecheck

      - name: Expo doctor
        working-directory: zoryq-mobile
        run: npx expo-doctor@latest

      - name: Generate ZORYQ chain app icon
        run: |
          python -m pip install --quiet pillow
          mkdir -p zoryq-mobile/assets
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          S=1024
          im=Image.new('RGB',(S,S),(5,6,9)); px=im.load()
          for y in range(S):
              for x in range(S):
                  dx=(x-S/2)/(S/2); dy=(y-S/2)/(S/2); r=min(1,(dx*dx+dy*dy)**0.5); t=(x+y)/(2*S)
                  px[x,y]=(int(5+4*(1-r)),int(7+15*(1-r)),int(15+34*t*(1-r)))
          glow=Image.new('RGBA',(S,S),(0,0,0,0)); gd=ImageDraw.Draw(glow)
          for w,a in [(70,20),(40,45),(18,110)]:
              gd.ellipse((145,330,885,720),outline=(70,30,255,a),width=w); gd.arc((115,260,910,790),200,340,fill=(0,230,255,a),width=max(8,w//2))
          glow=glow.filter(ImageFilter.GaussianBlur(10)); im=Image.alpha_composite(im.convert('RGBA'),glow)
          z=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(z); poly=[(250,250),(785,250),(665,390),(425,390),(745,390),(430,775),(245,775),(360,635),(530,635),(315,635),(625,250)]
          d.polygon(poly,fill=(65,92,255,255)); d.line([(250,250),(785,250),(665,390),(425,390)],fill=(73,231,255,255),width=14); d.line([(745,390),(430,775),(245,775)],fill=(198,73,255,255),width=14); d.polygon([(430,390),(745,390),(430,775),(535,635),(315,635)],fill=(30,46,195,255)); d.line([(430,390),(745,390),(430,775)],fill=(118,61,255,255),width=12)
          im=Image.alpha_composite(im,z.filter(ImageFilter.GaussianBlur(0.6))).convert('RGB'); im.save('zoryq-mobile/assets/zoryq-icon.png','PNG',optimize=True)
          PY

      - name: Generate Android project
        working-directory: zoryq-mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standalone release APK
        working-directory: zoryq-mobile/android
        env:
          NODE_ENV: 'production'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify packaged wallet bundle and identity
        run: |
          APK=$(find zoryq-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'index\.android\.bundle|assets/.*\.bundle' >/dev/null
          grep -q '"version": "1.0.0"' zoryq-mobile/app.json
          grep -q '"versionCode": 2' zoryq-mobile/app.json
          grep -q "type Tab='wallet'|'send'|'social'|'activity'|'settings'" zoryq-mobile/App.tsx
          grep -q "socialCommit('post'" zoryq-mobile/App.tsx
          grep -q "socialCommit(action" zoryq-mobile/App.tsx

      - name: Package artifact
        run: |
          mkdir -p dist
          APK=$(find zoryq-mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" dist/ZORYQ-Wallet-1.0.0.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Wallet-1.0.0-APK
          path: |
            dist/ZORYQ-Wallet-1.0.0.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
