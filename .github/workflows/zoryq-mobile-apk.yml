name: Build ZORYQ Wallet APK

on:
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-mobile/**'
      - '.github/workflows/zoryq-mobile-apk.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      EXPO_PUBLIC_ZORYQ_BASE: https://zoryq-evm-node-live-production.up.railway.app
      EXPO_PUBLIC_ZORYQ_RPC: https://zoryq-evm-node-live-production.up.railway.app/rpc
      EXPO_PUBLIC_ZORYQ_EXPLORER: https://zoryq-testnet.vercel.app/explorer.html
      EXPO_PUBLIC_REWARD_REGISTRY: 0xE8c01A67735B47Ba3318e96266F0b8bef39710ad
      EXPO_PUBLIC_QUEST_REGISTRY: 0x00e8BDa4280e340f75beEEAAcd68C4A6E6828a5a
      EXPO_PUBLIC_QUEST_COMPLETION_REGISTRY: 0x2f2378ffdFA02622baF05523901de9a9b7f4f2e3
      EXPO_PUBLIC_STAKE_CONTRACT: 0xa1294BeC35184Ac9Ad2f16F3DCfd4de276833499
      EXPO_PUBLIC_TEST_TOKEN: 0xdDeE4ECD600aC501B2A6b2A4e98aC180EbF79f94
      EXPO_PUBLIC_SWAP_CONTRACT: 0xa16AaA3F4df98D312dD7D146E4d0116967F0F7bf
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: zoryq-mobile
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        working-directory: zoryq-mobile
        run: npx expo install --fix

      - name: TypeScript check
        working-directory: zoryq-mobile
        run: npm run typecheck

      - name: Expo doctor
        working-directory: zoryq-mobile
        run: npx expo-doctor@latest

      - name: Generate Android project
        working-directory: zoryq-mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: zoryq-mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Package artifact
        run: |
          mkdir -p dist
          cp zoryq-mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/ZORYQ-Wallet-${{ github.run_number }}.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZORYQ-Wallet-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
