name: ZORYQ Mobile Node Protocol

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-wallet-backend/mobile-node.mjs'
      - 'zoryq-wallet-backend/mobile-node.test.mjs'
      - 'zoryq-wallet-backend/mobile-node-http-smoke.mjs'
      - 'zoryq-wallet-backend/server.mjs'
      - 'zoryq-wallet-backend/Dockerfile'
      - 'zoryq-mobile-node/android/**'
      - '.github/workflows/zoryq-mobile-node-protocol.yml'
  pull_request:
    paths:
      - 'zoryq-wallet-backend/mobile-node.mjs'
      - 'zoryq-wallet-backend/mobile-node.test.mjs'
      - 'zoryq-wallet-backend/mobile-node-http-smoke.mjs'
      - 'zoryq-wallet-backend/server.mjs'
      - 'zoryq-mobile-node/android/**'
      - '.github/workflows/zoryq-mobile-node-protocol.yml'

permissions:
  contents: read

concurrency:
  group: zoryq-mobile-node-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Syntax gate
        run: |
          node --check zoryq-wallet-backend/mobile-node.mjs
          node --check zoryq-wallet-backend/server.mjs
          node --check zoryq-wallet-backend/mobile-node-http-smoke.mjs
      - name: Mobile protocol adversarial tests
        run: node --test zoryq-wallet-backend/mobile-node.test.mjs
      - name: Live ZORYQ chain HTTP round-trip
        shell: bash
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/zoryq-mobile-node-ci.jsonl"
          PORT=18084 ZORYQ_MOBILE_STATE_FILE="$STATE_FILE" node zoryq-wallet-backend/server.mjs >/tmp/zoryq-mobile-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:18084/health >/dev/null && break
            sleep 1
          done
          node zoryq-wallet-backend/mobile-node-http-smoke.mjs | tee /tmp/zoryq-mobile-smoke.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/zoryq-mobile-smoke.json','utf8')); if(!(r.ok&&r.chainId===5919065&&r.xpAwarded===3&&r.totalXp===3&&r.replayRejected===true&&r.acceptedProofs===1)) process.exit(1)"
          kill $PID; wait $PID || true; trap - EXIT
      - name: Security and truth invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ZORYQ_CHAIN_ID = 5919065" zoryq-wallet-backend/mobile-node.mjs
          grep -q "CHALLENGE_ALREADY_USED" zoryq-wallet-backend/mobile-node.mjs
          grep -q "CHALLENGE_EXPIRED" zoryq-wallet-backend/mobile-node.mjs
          grep -q "INVALID_NODE_SIGNATURE" zoryq-wallet-backend/mobile-node.mjs
          grep -q "BLOCK_PROOF_MISMATCH" zoryq-wallet-backend/mobile-node.mjs
          grep -q "xp_awarded" zoryq-wallet-backend/mobile-node.mjs
          grep -q "heartbeatAwardsXp:false" zoryq-wallet-backend/server.mjs
          grep -q "verified-proof-only" zoryq-wallet-backend/server.mjs
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [Path('zoryq-wallet-backend/mobile-node.mjs')]
          paths += list(Path('zoryq-mobile-node/android/app/src/main/java/network/zoryq/mobilenode').glob('*.kt'))
          source = '\n'.join(p.read_text(errors='ignore') for p in paths)
          patterns = {
              'raw-private-key': r'(?i)private[_-]?key\s*[:=]\s*["\'][0-9a-f]{64}["\']',
              'seed-or-mnemonic': r'(?i)(mnemonic|seed[_-]?phrase)\s*[:=]\s*["\'][^"\']{16,}["\']',
          }
          found = [name for name, pattern in patterns.items() if re.search(pattern, source)]
          if found:
              raise SystemExit('Potential hard-coded secret detected: ' + ', '.join(found))
          print('PASS: deterministic hard-coded secret scan')
          PY
      - name: Docker inclusion gate
        run: grep -q 'COPY mobile-node.mjs ./mobile-node.mjs' zoryq-wallet-backend/Dockerfile
