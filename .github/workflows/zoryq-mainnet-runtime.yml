name: ZORYQ Mainnet Runtime Preflight

on:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-mainnet/**'
      - 'zoryq-evm-node/mainnet-guard.mjs'
      - '.github/workflows/zoryq-mainnet-runtime.yml'
  pull_request:
    paths:
      - 'zoryq-mainnet/**'
      - 'zoryq-evm-node/mainnet-guard.mjs'
      - '.github/workflows/zoryq-mainnet-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-runtime-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Assert mainnet launcher contains no active dev-mode flags
        run: |
          set -euo pipefail
          if grep -E '^[[:space:]]+--dev([.=[:space:]]|$)' zoryq-mainnet/entrypoint.sh; then
            echo 'active Reth dev flag found in mainnet launcher' >&2
            exit 1
          fi
          grep -F -- '--http.api eth,net,web3' zoryq-mainnet/entrypoint.sh
          grep -F -- '--authrpc.jwtsecret' zoryq-mainnet/entrypoint.sh
          grep -F -- '--p2p-secret-key' zoryq-mainnet/entrypoint.sh
          grep -F -- '--bootnodes' zoryq-mainnet/entrypoint.sh
          grep -F -- '--peers-file' zoryq-mainnet/entrypoint.sh
          grep -F -- 'at least two bootnodes are required' zoryq-mainnet/entrypoint.sh
          grep -F -- 'key-custody-evidence.mjs' zoryq-mainnet/entrypoint.sh

      - name: Run key custody evidence adversarial self-test
        run: node zoryq-mainnet/key-custody-evidence.selftest.mjs

      - name: Run P2P topology adversarial self-test
        run: node zoryq-mainnet/p2p-topology.selftest.mjs

      - name: Build isolated mainnet execution image
        run: docker build -f zoryq-mainnet/Dockerfile -t zoryq-mainnet-preflight .

      - name: Verify pinned Reth supports authenticated Engine API and P2P controls
        run: |
          set -euo pipefail
          docker run --rm --entrypoint reth zoryq-mainnet-preflight node --help > /tmp/reth-help.txt
          grep -F -- '--authrpc.jwtsecret' /tmp/reth-help.txt
          grep -F -- '--authrpc.addr' /tmp/reth-help.txt
          grep -F -- '--http.api' /tmp/reth-help.txt
          grep -F -- '--p2p-secret-key' /tmp/reth-help.txt
          grep -F -- '--bootnodes' /tmp/reth-help.txt
          grep -F -- '--peers-file' /tmp/reth-help.txt

      - name: Generate ephemeral preflight evidence
        run: |
          set -euo pipefail
          node zoryq-mainnet/preflight-fixture.mjs --out /tmp/zoryq-mainnet-fixture | tee /tmp/preflight-fixture.json
          jq -e '.ok == true and .fixtureOnly == true and .evidenceBound == true' /tmp/preflight-fixture.json
          jq -e '.productionEvidence == false and .fixtureOnly == true and (.validatorRegistrySha256 | length == 64) and (.keyCustodyEvidenceSha256 | length == 64) and (.redundancyEvidenceSha256 | length == 64) and (.recoveryEvidenceSha256 | length == 64)' /tmp/zoryq-mainnet-fixture/fixture-meta.json
          node zoryq-mainnet/key-custody-evidence.mjs --input /tmp/zoryq-mainnet-fixture/key-custody-evidence.json --allow-fixture

      - name: Run fail-closed mainnet image preflight
        run: |
          set -euo pipefail
          CHAIN_ID="$(jq -r .chainId /tmp/zoryq-mainnet-fixture/fixture-meta.json)"
          GENESIS_SHA="$(jq -r .genesisSha256 /tmp/zoryq-mainnet-fixture/fixture-meta.json)"
          RELEASE_COMMIT="$(jq -r .releaseCommit /tmp/zoryq-mainnet-fixture/fixture-meta.json)"
          IMAGE_DIGEST="$(jq -r .imageDigest /tmp/zoryq-mainnet-fixture/fixture-meta.json)"
          docker run --rm \
            -v /tmp/zoryq-mainnet-fixture:/fixture:ro \
            -e ZORYQ_NETWORK_MODE=mainnet \
            -e ZORYQ_MAINNET_PREFLIGHT_ONLY=true \
            -e ZORYQ_MAINNET_CHAIN_ID="$CHAIN_ID" \
            -e ZORYQ_MAINNET_GENESIS_PATH=/fixture/genesis.json \
            -e ZORYQ_MAINNET_GENESIS_SHA256="$GENESIS_SHA" \
            -e ZORYQ_MAINNET_JWT_SECRET_PATH=/fixture/jwt.hex \
            -e ZORYQ_MAINNET_RELEASE_COMMIT="$RELEASE_COMMIT" \
            -e ZORYQ_MAINNET_IMAGE_DIGEST="$IMAGE_DIGEST" \
            -e ZORYQ_MAINNET_AUDIT_REPORT_PATH=/fixture/audit-report.txt \
            -e ZORYQ_MAINNET_INCIDENT_RUNBOOK_PATH=/fixture/incident-runbook.txt \
            -e ZORYQ_MAINNET_RECOVERY_EVIDENCE_PATH=/fixture/recovery-evidence.txt \
            -e ZORYQ_MAINNET_REDUNDANCY_EVIDENCE_PATH=/fixture/redundancy-evidence.txt \
            -e ZORYQ_MAINNET_VALIDATOR_REGISTRY_PATH=/fixture/validator-registry.json \
            -e ZORYQ_MAINNET_CONSENSUS_EVIDENCE_PATH=/fixture/consensus-evidence.txt \
            -e ZORYQ_MAINNET_KEY_CUSTODY_EVIDENCE_PATH=/fixture/key-custody-evidence.json \
            -e ZORYQ_MAINNET_RELEASE_GOVERNANCE_PATH=/fixture/release-governance.txt \
            -e ZORYQ_MAINNET_OBSERVABILITY_EVIDENCE_PATH=/fixture/observability-evidence.txt \
            -e ZORYQ_MAINNET_LAUNCH_MANIFEST=/fixture/launch-manifest.json \
            -e ZORYQ_MAINNET_LAUNCH_POLICY=/fixture/launch-policy.json \
            -e ZORYQ_MAINNET_LAUNCH_APPROVALS=/fixture/launch-approvals.json \
            -e ZORYQ_MAINNET_EXTERNAL_SIGNER_READY=true \
            -e ZORYQ_MAINNET_CONSENSUS_READY=true \
            -e ZORYQ_MAINNET_REDUNDANCY_READY=true \
            -e ZORYQ_MAINNET_RECOVERY_READY=true \
            -e ZORYQ_MAINNET_AUDIT_READY=true \
            -e ZORYQ_MAINNET_INCIDENT_RUNBOOK_READY=true \
            zoryq-mainnet-preflight | tee /tmp/mainnet-image-preflight.log
          grep -F 'KEY_CUSTODY_EVIDENCE_ACCEPTED' /tmp/mainnet-image-preflight.log
          grep -F '[zoryq-mainnet] preflight complete; runtime intentionally not started' /tmp/mainnet-image-preflight.log
          grep -F 'threshold-ed25519-offline-approvals-v3-evidence-bound' /tmp/mainnet-image-preflight.log

      - name: Prove public mainnet backend blocks dangerous namespaces
        run: |
          set -euo pipefail
          grep -F "debug_" zoryq-mainnet/backend.mjs
          grep -F "engine_" zoryq-mainnet/backend.mjs
          grep -F "faucet_not_available_on_mainnet" zoryq-mainnet/backend.mjs
          grep -F "rpc_rate_limit" zoryq-mainnet/backend.mjs
          grep -F "zoryq_mainnet_block_stall_seconds" zoryq-mainnet/backend.mjs
          if grep -F 'devFaucetWallets' zoryq-mainnet/backend.mjs; then
            echo 'development faucet wallet pool leaked into mainnet backend' >&2
            exit 1
          fi
