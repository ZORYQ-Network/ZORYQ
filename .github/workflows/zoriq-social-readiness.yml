name: ZORIQ Social Readiness

on:
  pull_request:
    paths:
      - 'zoryq-web/zoriq-social.html'
      - 'zoryq-evm-node/social-service.mjs'
      - 'zoryq-mobile/SuperApp.tsx'
      - 'zoryq-web/config.js'
      - 'zoryq-developer/scripts/check-zoriq-social-readiness.mjs'
      - '.github/workflows/zoriq-social-readiness.yml'
  push:
    branches:
      - zoryq-evm-testnet-node
      - zoryq-p0-wallet-superapp
    paths:
      - 'zoryq-web/zoriq-social.html'
      - 'zoryq-evm-node/social-service.mjs'
      - 'zoryq-mobile/SuperApp.tsx'
      - 'zoryq-web/config.js'
      - 'zoryq-developer/scripts/check-zoriq-social-readiness.mjs'
      - '.github/workflows/zoriq-social-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: SocialFi superapp readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ZORIQ SocialFi package
        run: node zoryq-developer/scripts/check-zoriq-social-readiness.mjs
