name: ZORYQ Social Gateway

'on':
  workflow_dispatch:
  push:
    branches: [zoryq-evm-testnet-node]
    paths:
      - 'zoryq-wallet-backend/**'
      - 'zoryq-web/zoriq-social.html'
      - '.github/workflows/zoryq-social-gateway.yml'

permissions:
  contents: read

jobs:
  social-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install gateway dependencies
        working-directory: zoryq-wallet-backend
        run: npm install --no-audit --no-fund
      - name: Syntax and unified client gates
        run: |
          set -euo pipefail
          node --check zoryq-wallet-backend/social.mjs
          node --check zoryq-wallet-backend/gateway.mjs
          grep -q "version:'0.4.0'" zoryq-wallet-backend/social.mjs
          grep -q "ZORYQ_TESTNET_CHAIN_ID=5919065" zoryq-wallet-backend/social.mjs
          grep -q "verifyTypedData" zoryq-wallet-backend/social.mjs
          grep -q "PROFILE_REGISTRATION_REQUIRED" zoryq-wallet-backend/social.mjs
          grep -q "zoryq-wallet-swap-production.up.railway.app" zoryq-web/zoriq-social.html
          grep -q "eth_signTypedData_v4" zoryq-web/zoriq-social.html
          grep -q "CHAIN_ID=5919065" zoryq-web/zoriq-social.html
          ! grep -q "/api/social/" zoryq-web/zoriq-social.html
      - name: Start gateway
        working-directory: zoryq-wallet-backend
        env:
          PORT: '8080'
          ZORYQ_WALLET_TREASURY: '0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33'
          ZORYQ_WALLET_SWAP_FEE_BPS: '25'
          SOCIAL_SESSION_SECRET: 'ci-only-social-secret-0123456789abcdef0123456789abcdef'
          SOCIAL_DATA_DIR: '/tmp/zoryq-social-ci'
          SOCIAL_MEDIA_DIR: '/tmp/zoryq-social-media-ci'
          SOCIAL_PUBLIC_BASE_URL: 'https://social.example'
        run: |
          rm -rf /tmp/zoryq-social-ci /tmp/zoryq-social-media-ci
          node gateway.mjs >/tmp/zoryq-gateway.log 2>&1 & echo $! >/tmp/zoryq-gateway.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/social/health >/tmp/health.json && break; sleep 1; done
          grep -q '"version":"0.4.0"' /tmp/health.json
          grep -q '"chainId":5919065' /tmp/health.json
          grep -q '"scheme":"eip712"' /tmp/health.json
      - name: Same-wallet identity and Social E2E
        working-directory: zoryq-wallet-backend
        run: |
          node --input-type=module <<'NODE'
          import {Wallet} from 'ethers';
          const base='http://127.0.0.1:8080/social';
          async function api(path,opt={}){const r=await fetch(base+path,opt);let j={};try{j=await r.json()}catch{}return {r,j}}
          async function authenticate(w){
            const c=(await api(`/v1/auth/challenge?address=${w.address}`)).j;
            if(c.createsProfile!==false||!c.message.includes('does not create a profile'))throw Error('login_challenge_regressed');
            const signature=await w.signMessage(c.message);
            const a=(await api('/v1/auth/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address:w.address,signature})})).j;
            if(!a.token||a.profile?.registered!==false||!a.profileRegistrationRequired)throw Error('auth_should_not_create_profile');
            return a.token;
          }
          async function register(w,token,handle){
            const headers={authorization:`Bearer ${token}`,'content-type':'application/json'};
            const unsigned=await api('/v1/profile',{method:'PUT',headers,body:JSON.stringify({handle,displayName:'Unsigned',bio:''})});
            if(unsigned.r.status!==400||unsigned.j.error!=='PROFILE_REGISTRATION_REQUIRED')throw Error('unsigned_profile_creation_allowed');
            const reg=(await api('/v1/profile/registration-challenge',{method:'POST',headers,body:JSON.stringify({handle,displayName:handle,bio:'synced web + apk'})})).j;
            if(reg.chainId!==5919065||reg.scheme!=='eip712'||reg.typedData?.domain?.chainId!==5919065)throw Error('wrong_registration_domain');
            const signature=await w.signTypedData(reg.typedData.domain,reg.typedData.types,reg.typedData.message);
            const done=(await api('/v1/profile/register',{method:'POST',headers,body:JSON.stringify({signature})})).j;
            if(done.profile?.registered!==true||done.registration?.chainId!==5919065||done.registration?.scheme!=='eip712')throw Error('registration_failed');
            return {headers,profile:done.profile};
          }
          const alice=Wallet.createRandom(),bob=Wallet.createRandom();
          const aliceToken=await authenticate(alice),bobToken=await authenticate(bob);
          const a=await register(alice,aliceToken,'zoryq_sync_alice');
          const b=await register(bob,bobToken,'zoryq_sync_bob');
          const post=(await api('/v1/posts',{method:'POST',headers:a.headers,body:JSON.stringify({content:'One identity across web and APK #zoryq',kind:'text'})})).j.post;
          if(!post?.id)throw Error('post_failed');
          await api(`/v1/posts/${post.id}/like`,{method:'POST',headers:b.headers});
          await api(`/v1/follow/${alice.address}`,{method:'POST',headers:b.headers});
          const feed=(await api('/v1/feed?scope=for-you',{headers:{authorization:`Bearer ${aliceToken}`}})).j;
          const row=feed.items?.find(x=>x.id===post.id);
          if(!row||row.likeCount!==1)throw Error('shared_feed_state_failed');
          const profile=(await api(`/v1/profile/${alice.address}`,{headers:{authorization:`Bearer ${bobToken}`}})).j.profile;
          if(profile.handle!=='zoryq_sync_alice'||profile.followers!==1||profile.registration?.chainId!==5919065)throw Error('shared_profile_state_failed');
          console.log(JSON.stringify({ok:true,chainId:profile.registration.chainId,profile:profile.handle,likes:row.likeCount,followers:profile.followers}));
          NODE
      - name: Persistence survives restart
        working-directory: zoryq-wallet-backend
        env:
          PORT: '8080'
          ZORYQ_WALLET_TREASURY: '0xc0e03982fb8615ddf8b8fabd27e5a35541e12f33'
          ZORYQ_WALLET_SWAP_FEE_BPS: '25'
          SOCIAL_SESSION_SECRET: 'ci-only-social-secret-0123456789abcdef0123456789abcdef'
          SOCIAL_DATA_DIR: '/tmp/zoryq-social-ci'
          SOCIAL_MEDIA_DIR: '/tmp/zoryq-social-media-ci'
        run: |
          kill $(cat /tmp/zoryq-gateway.pid) || true
          sleep 1
          node gateway.mjs >/tmp/zoryq-gateway-restart.log 2>&1 & PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/social/health >/dev/null && break; sleep 1; done
          curl -fsS 'http://127.0.0.1:8080/social/v1/feed?scope=for-you' | grep -q 'One identity across web and APK'
      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/zoryq-gateway.log /tmp/zoryq-gateway-restart.log 2>/dev/null || true
