[package]
name = "zoryq-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["full"] }
