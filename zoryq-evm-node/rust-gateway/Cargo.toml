[package]
name = "zoryq-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-consensus = "2.4.1"
alloy-eips = "2.4.1"
alloy-network = "2.4.1"
alloy-primitives = "1.6.0"
alloy-signer = "2.4.1"
alloy-signer-local = { version = "2.4.1", features = ["mnemonic"] }
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
http = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["full"] }
