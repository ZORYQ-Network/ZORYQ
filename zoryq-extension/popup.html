<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZORYQ Wallet</title>
  <style>
    :root{color-scheme:dark;--bg:#050508;--card:#0b0e16;--line:#272d40;--muted:#9299ae;--cyan:#00e5ff;--purple:#9c5cff;--lime:#c6ff00}*{box-sizing:border-box}body{margin:0;width:390px;min-height:560px;background:radial-gradient(circle at 10% 0,#24103e,transparent 36%),var(--bg);color:white;font:14px Inter,system-ui,sans-serif}.wrap{padding:20px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--purple);background:#10121c;color:var(--purple);font-size:23px;font-weight:900;font-style:italic}.word{font-size:21px;letter-spacing:5px;font-weight:900}.sub{font-size:9px;color:#6e768b;letter-spacing:2px;margin-top:4px}.eye{font-size:10px;letter-spacing:2px;font-weight:900;color:var(--cyan);margin:10px 0}.title{font-size:28px;line-height:1.05;font-weight:900;margin:8px 0 12px}.muted{color:var(--muted);line-height:1.55}.card{background:linear-gradient(180deg,#0e111b,#080a10);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}input,textarea{width:100%;border:1px solid var(--line);background:#070a10;color:#fff;border-radius:12px;padding:12px;margin-top:10px;outline:none}textarea{min-height:110px;resize:none}button{width:100%;min-height:46px;border-radius:12px;border:0;font-weight:900;letter-spacing:1px;margin-top:10px;cursor:pointer}.primary{background:linear-gradient(90deg,var(--purple),#6d74ff,var(--cyan));color:#050508}.secondary{background:#111522;border:1px solid #30374d;color:#fff}.danger{background:#241018;border:1px solid #653047;color:#fff}.seed{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.seed span{border:1px solid #332746;background:#0d0b13;border-radius:10px;padding:9px;font-weight:700}.addr{font:700 13px ui-monospace,monospace;word-break:break-all;margin:10px 0}.ok{color:var(--lime)}.err{color:#ff7b9e}.footer{text-align:center;color:#535a6e;font-size:9px;letter-spacing:1px;margin-top:20px}.hidden{display:none}</style>
</head>
<body><div class="wrap"><div class="brand"><div class="mark">Z</div><div><div class="word">ZORYQ</div><div class="sub">WALLET • TESTNET</div></div></div><div id="app"></div><div class="footer">ZORYQ Wallet Extension v0.1 • Testnet only</div></div><script src="popup.js"></script></body>
</html>
