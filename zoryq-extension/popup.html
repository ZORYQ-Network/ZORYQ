<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZORYQ Wallet</title><style>:root{color-scheme:dark;--bg:#020205;--card:#090c13;--line:#272d40;--muted:#8c94a8;--cyan:#00e5ff;--purple:#a855f7;--lime:#c6ff00}*{box-sizing:border-box}body{margin:0;width:410px;min-height:620px;background:radial-gradient(circle at 20% 0,#24103e,transparent 33%),radial-gradient(circle at 90% 40%,#042631,transparent 27%),var(--bg);color:#fff;font:14px Inter,system-ui,sans-serif}.wrap{padding:18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--purple);background:#0f0a18;color:var(--cyan);font-size:23px;font-weight:950}.word{font-size:20px;letter-spacing:5px;font-weight:950}.sub{font-size:9px;color:#70788c;letter-spacing:2px;margin-top:3px}.eye{font-size:9px;letter-spacing:2px;font-weight:900;color:var(--cyan);margin:8px 0}.title{font-size:27px;line-height:1.05;font-weight:950;margin:8px 0 12px}.muted{color:var(--muted);line-height:1.5}.card{background:linear-gradient(180deg,#0e111b,#07090e);border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:12px}.balance{font-size:34px;font-weight:950}.balance i{font-style:normal;color:var(--cyan);font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{background:#080b12;border:1px solid #1d2330;border-radius:10px;padding:10px}.stat small{color:#70798e;font-size:8px;font-weight:800}.stat b{display:block;font-size:18px;margin-top:4px}.green{color:var(--lime)}input,textarea{width:100%;border:1px solid var(--line);background:#05070c;color:#fff;border-radius:11px;padding:11px;margin-top:9px;outline:none}textarea{min-height:95px;resize:none}button{width:100%;min-height:43px;border-radius:11px;border:0;font-weight:900;letter-spacing:.8px;margin-top:9px;cursor:pointer}.primary{background:linear-gradient(90deg,var(--purple),#6879ff,var(--cyan));color:#020205}.secondary{background:#10141f;border:1px solid #30374d;color:#fff}.danger{background:#251019;border:1px solid #653047;color:#fff}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seed{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.seed span{border:1px solid #332746;background:#0d0b13;border-radius:9px;padding:8px;font-weight:700}.addr{font:700 11px ui-monospace,monospace;word-break:break-all;margin:8px 0;color:#aeb8cf}.clock{font-size:25px;font-weight:950;color:var(--purple);letter-spacing:2px;margin:8px 0}.ok{color:var(--lime)}.err{color:#ff7b9e}.status{border:1px solid #263143;background:#07101a;border-radius:10px;padding:10px;margin-top:10px;color:#b8c7de;line-height:1.4}.footer{text-align:center;color:#535a6e;font-size:9px;letter-spacing:1px;margin-top:16px}</style></head><body><div class="wrap"><div class="brand"><div class="mark">Z</div><div><div class="word">ZORYQ</div><div class="sub">WALLET • CHAIN • TESTNET</div></div></div><div id="app"></div><div class="footer">ZORYQ Wallet Extension v0.4 • ML-DSA-65 • Testnet</div></div><script src="popup.js"></script></body></html>
